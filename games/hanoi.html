<!--
  Tornet i Hanoi / Tower of Hanoi — flytta tornet en bricka i taget (spel-id: hanoi)
  Del av Stalman games. Helt fristående: inga nätverksresurser.
  Fem nivåer, Lätt till Omöjliga, med 3 till 7 brickor. Lätt är öppen från början,
  och ett löst torn låser upp nästa nivå med en bricka till.
  Stjärnor: 3 för minsta antalet drag (2^n − 1), 2 för högst hälften fler, annars 1.
  Med tips blir det som mest 2 stjärnor. Hubbens trofé är alla stjärnor tillsammans.
  localStorage: score.hanoi (stjärnor), state.hanoi (nivåer, stjärnor, rekord och tornet man håller på med)
-->

<body>
<nav class="hubnav"><a class="back" href="../index.html" data-en="← Games">← Spel</a></nav>
<div id="app"></div>
<noscript>Det här spelet behöver JavaScript. / This game needs JavaScript.</noscript>
<script>
'use strict';
/* =========================================================
   Tornet i Hanoi — flytta tornet till pinnen med flaggan
   ========================================================= */

/*LOGIC-START*/
// Ren spellogik utan DOM (testas i tests/hanoi.test.js).
// Språket: 'sv' (standard) eller 'en'. Spelet sätter det från hubben (I18N.lang).
let LANG='sv';
function setLang(l){LANG=l==='en'?'en':'sv';}
const tr=(sv,en)=>LANG==='en'?en:sv;

// Nivåerna, med lika namn som i de andra spelen. n = antal brickor.
const LEVELS=[
  {id:'latt',name:'Lätt',en:'Easy',icon:'🐣',n:3},
  {id:'mellan',name:'Mellan',en:'Medium',icon:'🧗',n:4},
  {id:'svar',name:'Svår',en:'Hard',icon:'🏔️',n:5},
  {id:'geni',name:'Geni',en:'Genius',icon:'🧠',n:6},
  {id:'omojliga',name:'Omöjliga',en:'Impossible',icon:'💀',n:7}
];
const PEGS=3,GOAL=2;                 // pinnarna 0, 1, 2; tornet ska till pinne 2
const minMoves=n=>2**n-1;
const lvName=L=>LANG==='en'?L.en:L.name;

// Ett nytt torn: alla brickor på pinne 0, största (n) längst ner.
function newGame(level){
  const n=LEVELS[level].n,pegs=[[],[],[]];
  for(let k=n;k>=1;k--)pegs[0].push(k);
  return {level,n,pegs,moves:0,history:[],hints:0,done:false};
}
const topDisc=(g,p)=>g.pegs[p].length?g.pegs[p][g.pegs[p].length-1]:0;
// Ett drag är tillåtet om pinnen har en bricka och den inte hamnar på en mindre.
function canMove(g,from,to){
  if(g.done||from===to||!(from>=0&&from<PEGS)||!(to>=0&&to<PEGS))return false;
  const a=topDisc(g,from),b=topDisc(g,to);
  return a>0&&(b===0||a<b);
}
// Flyttar översta brickan. Ger true om draget gjordes.
function move(g,from,to){
  if(!canMove(g,from,to))return false;
  g.pegs[to].push(g.pegs[from].pop());
  g.moves++;g.history.push([from,to]);
  g.done=g.pegs[GOAL].length===g.n;
  return true;
}
// Ångrar senaste draget. Ett ångrat drag räknas inte längre.
function undo(g){
  if(g.done||!g.history.length)return false;
  const [from,to]=g.history.pop();
  g.pegs[from].push(g.pegs[to].pop());
  g.moves--;
  return true;
}
const pegOf=(pegs,k)=>pegs.findIndex(p=>p.includes(k));
// Bästa nästa drag från vilket läge som helst: flytta den största brickan som inte
// är framme till målet, men först alla mindre till den tredje pinnen. Ger [från, till] eller null.
function bestMove(pegs,n,target){
  target=target==null?GOAL:target;
  for(let k=n;k>=1;k--){
    const at=pegOf(pegs,k);
    if(at===target)continue;
    const other=3-at-target;
    return bestMove(pegs,k-1,other)||[at,target];
  }
  return null;
}
// Hur många drag som minst behövs härifrån.
function movesLeft(pegs,n,target){
  target=target==null?GOAL:target;
  if(n===0)return 0;
  const at=pegOf(pegs,n);
  if(at===target)return movesLeft(pegs,n-1,target);
  return movesLeft(pegs,n-1,3-at-target)+1+minMoves(n-1);
}
// Stjärnor för ett löst torn.
function starsFor(n,moves,hints){
  const best=minMoves(n);
  const s=moves<=best?3:moves<=Math.floor(best*1.5)?2:1;
  return hints?Math.min(2,s):s;
}

// ---------- framsteg ----------
// prog: {unlocked: index för högsta öppna nivå, stars: {nivå-id: 1–3}, best: {nivå-id: minst antal drag}}
function cleanProgress(p){
  const out={unlocked:0,stars:{},best:{}};
  if(!p||typeof p!=='object')return out;
  const u=Number(p.unlocked);
  out.unlocked=Number.isInteger(u)?Math.max(0,Math.min(LEVELS.length-1,u)):0;
  for(const L of LEVELS){
    const s=Math.floor(Number(p.stars&&p.stars[L.id]));if(s>=1&&s<=3)out.stars[L.id]=s;
    const b=Math.floor(Number(p.best&&p.best[L.id]));if(b>=minMoves(L.n))out.best[L.id]=b;
  }
  return out;
}
// Sparar ett löst torn. Ger index för nivån som låstes upp, annars -1.
function recordWin(prog,level,moves,hints){
  const L=LEVELS[level],s=starsFor(L.n,moves,hints);
  if(!(prog.stars[L.id]>=s))prog.stars[L.id]=s;
  if(!(prog.best[L.id]<=moves))prog.best[L.id]=moves;
  if(level>=prog.unlocked&&level<LEVELS.length-1){prog.unlocked=level+1;return level+1;}
  return -1;
}
const totalStars=prog=>LEVELS.reduce((a,L)=>a+(prog.stars[L.id]||0),0);
const maxStars=()=>LEVELS.length*3;
// Ett sparat torn används bara om brickorna ligger rätt (inga stora på små, alla med).
function restoreGame(s,prog){
  if(!s||typeof s!=='object'||!Number.isInteger(s.level)||!LEVELS[s.level])return null;
  if(prog&&s.level>prog.unlocked)return null;
  const n=LEVELS[s.level].n;
  if(!Array.isArray(s.pegs)||s.pegs.length!==PEGS)return null;
  const seen=[];
  for(const p of s.pegs){
    if(!Array.isArray(p))return null;
    for(let i=0;i<p.length;i++){if(!Number.isInteger(p[i])||(i&&p[i]>p[i-1]))return null;seen.push(p[i]);}
  }
  seen.sort((a,b)=>a-b);
  if(seen.length!==n||seen.some((k,i)=>k!==i+1))return null;
  const g={level:s.level,n,pegs:s.pegs.map(p=>p.slice()),moves:Math.max(0,Math.floor(Number(s.moves))||0),
    history:Array.isArray(s.history)?s.history.filter(m=>Array.isArray(m)&&m.length===2&&m.every(x=>Number.isInteger(x)&&x>=0&&x<PEGS)).map(m=>[m[0],m[1]]):[],
    hints:Math.max(0,Math.floor(Number(s.hints))||0),done:false};
  if(g.pegs[GOAL].length===n)return null;   // redan löst
  return g;
}
const discsName=n=>tr(`${n} brickor`,`${n} discs`);
const pegName=p=>tr(['vänstra pinnen','mittenpinnen','högra pinnen'],['the left peg','the middle peg','the right peg'])[p];
/*LOGIC-END*/

// ---------- spelets id och sparade värden ----------
const GAME_ID='hanoi';
const SCORE_KEY='score.'+GAME_ID;   // hubbens trofé: alla stjärnor tillsammans
const SAVE_KEY='state.'+GAME_ID;    // nivåer, stjärnor, rekord och tornet man håller på med (hubbens konvention: state.<id>)
setLang(I18N.lang);
I18N.apply();
const COLORS=['#ff6b6b','#ff9f43','#ffc63f','#38d9a9','#3d8be0','#9a6ad6','#f06595'];
const reduceMotion=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const starStr=s=>'⭐'.repeat(s)+'☆'.repeat(3-s);
const lvLabel=L=>`${L.icon} ${lvName(L)}`;

function readSave(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));return s&&typeof s==='object'?s:{};}catch(e){return {};}}
const SAVED=readSave();
let PROG=cleanProgress(SAVED.prog);
let G=restoreGame(SAVED.game,PROG);  // tornet man håller på med, eller null
let sel=-1;                          // pinnen vars översta bricka är upplyft
let hint=null;                       // [från, till] när ett tips visas
let ACT={};
const app=document.getElementById('app');

function persist(){
  const game=G&&!G.done?{level:G.level,pegs:G.pegs,moves:G.moves,history:G.history,hints:G.hints}:null;
  try{localStorage.setItem(SAVE_KEY,JSON.stringify({prog:PROG,game}));}catch(e){}
}
function writeScore(){const n=totalStars(PROG);if(n>0)try{localStorage.setItem(SCORE_KEY,String(n));}catch(e){}}

function go(html,acts,bodyClass){
  closeModal();
  document.body.className=bodyClass||'';
  app.innerHTML=html;ACT=acts||{};
  window.scrollTo(0,0);
}

// ---------- meny ----------
function miniTower(n){
  return `<span class="mini" aria-hidden="true">${Array.from({length:n},(_,i)=>`<i style="width:${12+i*6}px;background:${COLORS[i]}"></i>`).join('')}</span>`;
}
function showMenu(msg){
  if(G&&G.done)G=null;
  sel=-1;hint=null;
  const total=totalStars(PROG),resume=G&&G.moves>0;
  go(`<main class="menu">
    <header class="hero">
      <div class="logo" aria-hidden="true">🗼</div>
      <h1>${tr('Tornet i Hanoi','Tower of Hanoi')}</h1>
      <p class="sub">${tr('Flytta hela tornet till pinnen med flaggan 🏁. En bricka i taget, och en större bricka får aldrig ligga på en mindre.','Move the whole tower to the peg with the flag 🏁. One disc at a time, and a bigger disc may never sit on a smaller one.')}</p>
    </header>
    ${resume?`<button class="resume panel" data-act="resume"><span class="ico" aria-hidden="true">${LEVELS[G.level].icon}</span><span><b>${tr('Fortsätt tornet','Continue the tower')}</b>${lvName(LEVELS[G.level])} · ${discsName(G.n)} · ${G.moves} ${tr('drag','moves')}</span></button>`:''}
    <h2 class="pickh">${resume?tr('Eller välj en nivå','Or pick a level'):tr('Välj nivå','Pick a level')}</h2>
    <p class="menumsg" role="status">${msg||''}</p>
    <div class="levels">${LEVELS.map(levelButton).join('')}</div>
    <div class="row center"><button class="btn" data-act="rules">📖 ${tr('Så spelar du','How to play')}</button></div>
    <p class="record">${total?`⭐ ${tr('Stjärnor','Stars')}: <b>${total}</b> ${tr('av','of')} ${maxStars()}`:tr('⭐ Flytta ett torn och få dina första stjärnor!','⭐ Move a tower to get your first stars!')}</p>
  </main>`,{
    resume:()=>renderPlay(),
    level:b=>chooseLevel(+b.dataset.lvl),
    rules:showRules
  },'at-menu');
}
function levelButton(L,i){
  const locked=i>PROG.unlocked,s=PROG.stars[L.id]||0;
  const tag=locked?`<span class="tag">${tr('Låst','Locked')}</span>`
    :s?`<span class="tag stars" aria-label="${s} ${tr('av 3 stjärnor','of 3 stars')}">${starStr(s)}</span>`
    :`<span class="tag">${tr('Inte klarad än','Not solved yet')}</span>`;
  return `<button class="level lv-${L.id}${locked?' locked':''}" data-act="level" data-lvl="${i}">
    <span class="ico" aria-hidden="true">${locked?'🔒':L.icon}</span>
    <span class="nm">${lvName(L)} ${miniTower(L.n)}</span>
    <span class="ds">${locked?tr(`Flytta tornet på ${lvName(LEVELS[i-1])} för att låsa upp.`,`Move the tower on ${lvName(LEVELS[i-1])} to unlock.`)
      :`${discsName(L.n)} · ${tr(`minst ${minMoves(L.n)} drag`,`at least ${minMoves(L.n)} moves`)}`}</span>
    ${tag}
  </button>`;
}
function chooseLevel(i){
  if(i>PROG.unlocked){
    const m=app.querySelector('.menumsg');
    if(m)m.textContent=tr(`${lvName(LEVELS[i])} är låst. Flytta tornet på ${lvName(LEVELS[i-1])} först!`,`${lvName(LEVELS[i])} is locked. Move the tower on ${lvName(LEVELS[i-1])} first!`);
    return;
  }
  if(G&&G.moves>0&&G.level!==i){
    modal(`<h3>${tr('Börja ett nytt torn?','Start a new tower?')}</h3>
      <p>${tr(`Du håller på med ett torn på <b>${lvName(LEVELS[G.level])}</b>. Det försvinner om du börjar ett nytt.`,`You are in the middle of a tower on <b>${lvName(LEVELS[G.level])}</b>. It will be lost if you start a new one.`)}</p>
      <div class="row center"><button class="btn go" data-m="old">${tr('Fortsätt det gamla','Continue the old one')}</button><button class="btn" data-m="new">${tr('Börja nytt','Start new')}</button></div>`,
      {old:()=>renderPlay(),new:()=>startLevel(i)});
    return;
  }
  if(G&&G.level===i)return renderPlay();
  startLevel(i);
}
function startLevel(i){G=newGame(i);sel=-1;hint=null;persist();renderPlay();}

// ---------- spelplanen ----------
// Brickornas höjd: så stor som får plats, mellan 18 och 46 px.
function sizes(){
  const vh=window.innerHeight,vw=Math.min(window.innerWidth,980);
  const room=Math.max(220,vh-300);
  const dh=Math.max(18,Math.min(46,Math.floor(room/(G.n+3)),Math.floor(vw/14)));
  return {dh,lift:dh*1.4};
}
function renderPlay(){
  if(!G)return showMenu();
  const {dh,lift}=sizes(),L=LEVELS[G.level];
  const bh=Math.round(dh*G.n+lift+dh+70);
  go(`<main class="play">
    <header class="bar">
      <button class="btn sm" data-act="menu">${tr('Meny','Menu')}</button>
      <div class="title"><b>${lvLabel(L)}</b><small>${discsName(G.n)} · ${tr(`minst ${minMoves(G.n)} drag`,`at least ${minMoves(G.n)} moves`)}</small></div>
      <div class="stats"><div class="stat" data-stat="moves"><span class="n"></span><span class="l">${tr('drag','moves')}</span></div></div>
    </header>
    <p class="msg" role="status" aria-live="polite"></p>
    <section class="board" aria-label="${tr('Tre pinnar','Three pegs')}" style="--bh:${bh}px;--dh:${dh}px;--lift:${lift}px;--liftby:${Math.round(lift-6)}px">
      ${[0,1,2].map(p=>`<button class="peg${p===GOAL?' goal':''}" data-act="peg" data-p="${p}"></button>`).join('')}
    </section>
    <div class="keys">
      <button class="btn" data-act="undo">↩️ ${tr('Ångra','Undo')}</button>
      <button class="btn" data-act="hint">💡 ${tr('Tips','Hint')}</button>
      <button class="btn" data-act="restart">🔄 ${tr('Börja om','Start over')}</button>
    </div>
  </main>`,{
    menu:()=>{persist();showMenu();},
    peg:b=>tapPeg(+b.dataset.p),
    undo:doUndo,
    hint:showHint,
    restart:askRestart
  });
  refresh();
  setMsg(G.moves===0?tr('Tryck på en pinne för att lyfta den översta brickan, och sedan på pinnen där den ska ligga.','Tap a peg to lift its top disc, then tap the peg where it should go.'):'');
}
function refresh(){
  const board=app.querySelector('.board');if(!board)return;
  board.querySelectorAll('.peg').forEach(el=>{
    const p=+el.dataset.p,ring=G.pegs[p];
    el.classList.toggle('sel',p===sel);
    el.classList.toggle('from',!!hint&&hint[0]===p);
    el.classList.toggle('to',!!hint&&hint[1]===p);
    el.innerHTML=ring.map((k,i)=>{
      const w=Math.round(30+70*(k-1)/Math.max(1,G.n-1));
      const lifted=p===sel&&i===ring.length-1;
      return `<span class="disc${lifted?' lifted':''}" data-k="${k}" style="width:${w}%;background:${COLORS[k-1]}" aria-hidden="true">${k}</span>`;
    }).join('');
    const label=`${pegName(p)}${p===GOAL?tr(' (målet)',' (the goal)'):''}: ${ring.length?tr('brickor ','discs ')+ring.join(', '):tr('tom','empty')}${p===sel?tr(', upplyft',', lifted'):''}`;
    el.setAttribute('aria-label',label.charAt(0).toUpperCase()+label.slice(1));
  });
  const n=app.querySelector('[data-stat="moves"] .n');if(n)n.textContent=G.moves;
  const u=app.querySelector('[data-act="undo"]');if(u)u.disabled=!G.history.length||G.done;
  const h=app.querySelector('[data-act="hint"]');if(h)h.disabled=G.done;
  const r=app.querySelector('[data-act="restart"]');if(r)r.disabled=!G.moves||G.done;
}
function setMsg(text,kind){
  const m=app.querySelector('.msg');if(!m)return;
  m.textContent=text;m.className='msg'+(kind?' '+kind:'');
}
function shakePeg(p){
  const el=app.querySelector(`.peg[data-p="${p}"]`);if(!el||reduceMotion())return;
  el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');
}
// Ett tryck på en pinne: lyft brickan, lägg den, eller ställ tillbaka den.
function tapPeg(p){
  if(!G||G.done)return;
  if(sel<0){
    if(!G.pegs[p].length){shakePeg(p);setMsg(tr('Den pinnen är tom. Välj en pinne med en bricka på.','That peg is empty. Pick a peg with a disc on it.'),'bad');return;}
    sel=p;refresh();setMsg('');return;
  }
  if(p===sel){sel=-1;refresh();return;}
  drop(sel,p);
}
function drop(from,to){
  sel=-1;
  if(!canMove(G,from,to)){
    refresh();shakePeg(to);
    setMsg(tr(`Bricka ${topDisc(G,from)} får inte ligga på bricka ${topDisc(G,to)}. En större bricka får aldrig ligga på en mindre.`,`Disc ${topDisc(G,from)} may not sit on disc ${topDisc(G,to)}. A bigger disc may never sit on a smaller one.`),'bad');
    return;
  }
  move(G,from,to);hint=null;
  refresh();setMsg('');persist();
  if(G.done)win();
}
function doUndo(){if(G&&undo(G)){sel=-1;hint=null;refresh();setMsg('');persist();}}
function showHint(){
  if(!G||G.done)return;
  const m=bestMove(G.pegs,G.n);if(!m)return;
  sel=-1;hint=m;G.hints++;persist();refresh();
  setMsg(tr(`💡 Flytta bricka ${topDisc(G,m[0])} från ${pegName(m[0])} till ${pegName(m[1])}. Härifrån behövs minst ${movesLeft(G.pegs,G.n)} drag till.`,
    `💡 Move disc ${topDisc(G,m[0])} from ${pegName(m[0])} to ${pegName(m[1])}. From here you need at least ${movesLeft(G.pegs,G.n)} more moves.`),'tip');
}
function askRestart(){
  if(!G||!G.moves)return;
  modal(`<h3>${tr('Börja om?','Start over?')}</h3><p>${tr('Alla brickor går tillbaka till den första pinnen.','All the discs go back to the first peg.')}</p>
    <div class="row center"><button class="btn go" data-m="close">${tr('Fortsätt','Continue')}</button><button class="btn" data-m="yes">${tr('Börja om','Start over')}</button></div>`,
    {yes:()=>startLevel(G.level)});
}
function win(){
  const level=G.level,n=G.n,moves=G.moves,hints=G.hints,s=starsFor(n,moves,hints),best=minMoves(n);
  const unlocked=recordWin(PROG,level,moves,hints);
  persist();writeScore();
  const next=level+1<LEVELS.length?level+1:-1;
  const lead=moves===best?tr(`Du flyttade tornet på ${moves} drag – det minsta som går!`,`You moved the tower in ${moves} moves – the fewest possible!`)
    :tr(`Du flyttade tornet på ${moves} drag. Det går på ${best}.`,`You moved the tower in ${moves} moves. It can be done in ${best}.`);
  const hintNote=hints&&starsFor(n,moves,0)>s?tr(' Med tips blir det som mest två stjärnor.',' With hints you get two stars at most.'):'';
  setMsg(tr('🎉 Tornet är flyttat!','🎉 The tower is moved!'),'ok');
  if(s===3||unlocked>=0)confetti();
  setTimeout(()=>modal(`<h2>${s===3?tr('Perfekt!','Perfect!'):tr('Snyggt!','Well done!')}</h2>
    <div class="bigstars" aria-label="${s} ${tr('av 3 stjärnor','of 3 stars')}">${starStr(s)}</div>
    <p class="lead">${lead}${hintNote}</p>
    ${unlocked>=0?`<p class="unlock"><b>🔓 ${tr(`Du har låst upp ${lvLabel(LEVELS[unlocked])}!`,`You have unlocked ${lvLabel(LEVELS[unlocked])}!`)}</b></p>`:''}
    <div class="row center">
      ${next>=0?`<button class="btn go big" data-m="next">${tr(`Prova ${lvName(LEVELS[next])}`,`Try ${lvName(LEVELS[next])}`)}</button>`:''}
      <button class="btn${next>=0?'':' go big'}" data-m="again">${tr('Spela igen','Play again')}</button>
      <button class="btn" data-m="menu">${tr('Meny','Menu')}</button>
    </div>`,{next:()=>startLevel(next),again:()=>startLevel(level),menu:()=>{G=null;persist();showMenu();}},true),reduceMotion()?0:500);
}

// ---------- regler ----------
function showRules(){
  modal(`<h3>📖 ${tr('Så spelar du','How to play')}</h3>
    <ul>${tr([
      'Flytta hela tornet från den första pinnen till pinnen med flaggan 🏁.',
      'Du får bara flytta en bricka i taget, och bara den översta brickan på en pinne.',
      'En större bricka får aldrig ligga på en mindre.',
      'Tryck på en pinne för att lyfta brickan och sedan på pinnen där den ska ligga. Du kan också dra brickan dit. På ett tangentbord funkar 1, 2 och 3.',
      'Minsta antalet drag är 7 för 3 brickor, 15 för 4 brickor … Varje bricka till dubblar nästan antalet.',
      '⭐⭐⭐ för minsta antalet drag, ⭐⭐ för högst hälften fler, annars ⭐. Med 💡 tips blir det som mest ⭐⭐.',
      'Flytta tornet på en nivå för att låsa upp nästa, med en bricka till.'
    ],[
      'Move the whole tower from the first peg to the peg with the flag 🏁.',
      'You may only move one disc at a time, and only the top disc on a peg.',
      'A bigger disc may never sit on a smaller one.',
      'Tap a peg to lift its disc, then tap the peg where it should go. You can also drag the disc there. On a keyboard, 1, 2 and 3 work too.',
      'The fewest moves are 7 for 3 discs, 15 for 4 discs … Every extra disc almost doubles the number.',
      '⭐⭐⭐ for the fewest moves, ⭐⭐ for at most half as many again, otherwise ⭐. With 💡 hints you get ⭐⭐ at most.',
      'Move the tower on a level to unlock the next one, with one more disc.'
    ]).map(t=>`<li>${t}</li>`).join('')}</ul>
    <div class="row center"><button class="btn go" data-m="close">${tr('Nu kör vi!',"Let's go!")}</button></div>`);
}

// ---------- dialog och konfetti ----------
let modalHandlers=null;
// sticky: dialogen stängs bara med en knapp (inte med Escape eller ett tryck utanför)
function modal(html,handlers,sticky){
  closeModal();
  const back=document.createElement('div');back.className='modal-back';
  if(sticky)back.dataset.sticky='1';
  back.innerHTML=`<div class="modal panel" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(back);
  modalHandlers=handlers||{};
  back.addEventListener('click',e=>{
    const b=e.target.closest('[data-m]');
    if(b){const fn=modalHandlers&&modalHandlers[b.dataset.m];closeModal();if(fn)fn(b);}
    else if(e.target===back&&!sticky)closeModal();
  });
  const f=back.querySelector('.btn.go')||back.querySelector('button');if(f)f.focus({preventScroll:true});
}
function closeModal(){document.querySelectorAll('.modal-back').forEach(m=>m.remove());modalHandlers=null;}
function confetti(){
  if(reduceMotion())return;
  const box=document.createElement('div');box.className='confetti';box.setAttribute('aria-hidden','true');
  for(let i=0;i<70;i++){
    const p=document.createElement('i');
    p.style.left=Math.random()*100+'%';p.style.background=COLORS[i%COLORS.length];
    p.style.animationDelay=(Math.random()*.6)+'s';p.style.animationDuration=(1.7+Math.random()*1.5)+'s';
    box.appendChild(p);
  }
  document.body.appendChild(box);setTimeout(()=>box.remove(),3800);
}

// ---------- inmatning ----------
// Ett tryck (eller Enter på en pinne) kommer som click. Att dra en bricka sköts med
// pointer-händelser; klicket som följer efter ett drag ignoreras.
const DR={pid:null,from:-1,x:0,y:0,moved:false,ghost:null,until:0};
const pegAt=(x,y)=>{const el=document.elementFromPoint(x,y);const p=el&&el.closest('.peg');return p?+p.dataset.p:-1;};
app.addEventListener('pointerdown',e=>{
  const peg=e.target.closest('.peg');
  if(!peg||!G||G.done||(e.button&&e.button!==0)||document.querySelector('.modal-back'))return;
  DR.pid=e.pointerId;DR.from=+peg.dataset.p;DR.x=e.clientX;DR.y=e.clientY;DR.moved=false;
});
app.addEventListener('pointermove',e=>{
  if(DR.pid!==e.pointerId||DR.from<0)return;
  const dx=e.clientX-DR.x,dy=e.clientY-DR.y;
  if(!DR.moved&&dx*dx+dy*dy>144&&G.pegs[DR.from].length&&(sel<0||sel===DR.from)){
    DR.moved=true;sel=DR.from;hint=null;refresh();
    const disc=app.querySelector(`.peg[data-p="${DR.from}"] .disc:last-child`);
    if(disc){
      const r=disc.getBoundingClientRect();
      DR.ghost=disc.cloneNode(true);DR.ghost.classList.remove('lifted');DR.ghost.classList.add('ghost');
      DR.ghost.style.width=r.width+'px';document.body.appendChild(DR.ghost);disc.classList.add('hidden');
    }
  }
  if(DR.moved&&DR.ghost){DR.ghost.style.left=e.clientX+'px';DR.ghost.style.top=e.clientY+'px';}
});
function endPointer(e,cancel){
  if(DR.pid!==e.pointerId)return;
  const {from,moved}=DR;
  if(DR.ghost)DR.ghost.remove();
  DR.pid=null;DR.from=-1;DR.ghost=null;
  if(!moved||!G||G.done)return;
  DR.until=Date.now()+500;            // klicket efter ett drag är inget tryck
  const to=cancel?-1:pegAt(e.clientX,e.clientY);
  if(to<0||to===from){sel=-1;refresh();return;}
  drop(from,to);
}
document.addEventListener('pointerup',e=>endPointer(e,false));
document.addEventListener('pointercancel',e=>endPointer(e,true));
app.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');
  if(!a||a.disabled)return;
  if(a.dataset.act==='peg'&&Date.now()<DR.until)return;
  const fn=ACT[a.dataset.act];if(fn){e.preventDefault();fn(a,e);}
});
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const open=document.querySelector('.modal-back');
  if(open){if(e.key==='Escape'&&!open.dataset.sticky){e.preventDefault();closeModal();}return;}
  if(!G||G.done||!app.querySelector('.board'))return;
  if(/^[123]$/.test(e.key)){e.preventDefault();tapPeg(+e.key-1);}
  else if(e.key==='Escape'&&sel>=0){e.preventDefault();sel=-1;refresh();}
  else if(e.key==='Backspace'){e.preventDefault();doUndo();}
});
let resizeTimer=0;
window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(G&&!G.done&&app.querySelector('.board')&&!document.querySelector('.modal-back'))renderPlay();},120);});

showMenu();

// fungerar utan internet via hubbens service worker
if('serviceWorker' in navigator){navigator.serviceWorker.register('../sw.js').catch(function(){});}
</script>
<script src="../shared/guard.js" data-game="hanoi"></script>
