function gateSVG(g){
  const sun=g==='sun';
  const rays=A(8,i=>{const r=i*Math.PI/4;return `<line x1="${(100+Math.cos(r)*22).toFixed(1)}" y1="${(80+Math.sin(r)*22).toFixed(1)}" x2="${(100+Math.cos(r)*31).toFixed(1)}" y2="${(80+Math.sin(r)*31).toFixed(1)}"/>`;}).join('');
  const emblem=sun?`<g stroke="#17335b" stroke-width="3.5" stroke-linecap="round">${rays}</g><circle cx="100" cy="80" r="16" fill="#ffc63f" stroke="#17335b" stroke-width="3.5"/>`
    :`<path d="M108 62a20 20 0 1 0 0 36a17 17 0 1 1 0-36z" fill="#f4f0d8" stroke="#17335b" stroke-width="3.5" stroke-linejoin="round"/><g fill="#fff"><circle cx="70" cy="128" r="2.6"/><circle cx="132" cy="146" r="2.2"/><circle cx="126" cy="112" r="1.8"/><circle cx="82" cy="170" r="1.8"/></g>`;
  return `<svg viewBox="0 0 200 220" aria-hidden="true"><path d="M12 214V98a88 88 0 0 1 176 0v116z" fill="#cfc6b8" stroke="#17335b" stroke-width="5" stroke-linejoin="round"/><g fill="none" stroke="#17335b" stroke-opacity=".3" stroke-width="3" stroke-linecap="round"><path d="M14 124h28M158 124h28M14 160h28M158 160h28M14 194h28M158 194h28M36 44l15 15M164 44l-15 15M100 12v22"/></g><path d="M44 214V102a56 56 0 0 1 112 0v112z" fill="${sun?'#ffe39a':'#35406f'}" stroke="#17335b" stroke-width="4"/>${emblem}<path d="M8 214h184" stroke="#17335b" stroke-width="5" stroke-linecap="round"/></svg>`;
}
function makeGates(troupe,L){
  const st=baseStation('gates',troupe,L);
  st.all=troupe.slice();st.rule=pickSplitRule(L,troupe);st.sun=[];st.moon=[];
  st.setHearts(L>=4?7:L===3?6:5);
  const GN=tr({sun:'Solporten',moon:'Månporten'},{sun:'the Sun Gate',moon:'the Moon Gate'});
  st.say=tr('Portarna har en hemlig regel. Dra en numling till en port, eller tryck på den och sedan på en port.','The gates have a secret rule. Drag a numling to a gate, or tap it and then a gate.');
  st.tapSay=tr('Tryck nu på en port.','Now tap a gate.');
  st.html=()=>`
    <div class="gates">${['sun','moon'].map(g=>`
      <div class="gatecol ${st.fx.gate===g?'rumble':''}" data-drop="${g}" tabindex="0" role="button" aria-label="${cap(GN[g])}">
        <div class="gate">${gateSVG(g)}</div>
        <div class="gname">${cap(GN[g])}</div>
        <div class="passed">${st[g].map(c=>crHTML(c,{sm:1,cls:st.fx.pop===c.id?'pop':''})).join('')}</div>
      </div>`).join('')}
    </div>
    <div><div class="tray-label">${tr('Väntar vid portarna','Waiting at the gates')}</div>
    <div class="tray" data-drop="tray">${st.waiting.map(c=>crHTML(c,{dr:1,sel:st.sel===c.id,cls:st.fx.shake===c.id?'shake':''})).join('')||`<span class="hint">${tr('Alla har gått igenom!','Everyone is through!')}</span>`}</div></div>
    <div class="actions"><button class="btn go" data-act="guess" ${st.sun.length+st.moon.length<3||st.done?'disabled':''}>${tr('Jag vet regeln!','I know the rule!')}</button></div>
    ${st.sun.length+st.moon.length<3?`<p class="hint" style="text-align:center">${tr('Skicka minst 3 numlingar först, sedan kan du gissa regeln.','Send at least 3 numlings first, then you can guess the rule.')}</p>`:''}`;
  st.onDrop=(id,zone)=>{
    if(st.done)return;
    const c=st.waiting.find(x=>x.id===id);st.sel=null;
    if(!c||(zone!=='sun'&&zone!=='moon')){st.render();return;}
    if(st.rule.test(c)===(zone==='sun')){
      st.waiting=st.waiting.filter(x=>x!==c);st[zone].push(c);st.across.push(c);
      SFX.ok();st.fx={pop:c.id};st.say=`${pick(PRAISE)} ${tr(`Nummer ${c.n} går genom ${GN[zone]}.`,`Number ${c.n} goes through ${GN[zone]}.`)}`;st.mood='good';
      if(!st.waiting.length){st.say=tr('Alla har gått igenom! Såg du regeln?','Everyone is through! Did you spot the rule?');st.win();}
    }else{
      st.fx={shake:c.id,gate:zone};
      st.strike(tr(`${GN[zone]} mullrar. Nummer ${c.n} får inte gå där.`,`${cap(GN[zone])} rumbles. Number ${c.n} may not go there.`));
    }
    st.render();
  };
  st.acts.guess=()=>{
    const placed=[...st.sun.map(c=>({c,val:true})),...st.moon.map(c=>({c,val:false}))];
    const opts=ruleOptions(st.rule,st.all,placed,st.L);
    const h={};opts.forEach((r,i)=>h['o'+i]=()=>{
      if(st.done)return;
      if(r===st.rule){
        st.waiting.forEach(c=>{(st.rule.test(c)?st.sun:st.moon).push(c);st.across.push(c);});
        st.waiting=[];SFX.ok();st.say=tr('Du knäckte den! Alla hoppar genom rätt port.','You cracked it! Everyone jumps through the right gate.');st.mood='good';st.cracked=true;st.render();st.win();
      }else{st.strike(tr('Inte den regeln. Titta på numlingarna vid varje port igen.','Not that rule. Look at the numlings at each gate again.'));st.render();}
    });
    modal(`<h3>${tr('Vilken regel har Solporten?','What is the Sun Gate\'s rule?')}</h3><p>${tr('Kolla alla numlingar som gick genom varje port. Bara en regel passar alla.','Check every numling that went through each gate. Only one rule fits them all.')}</p><div class="opts">${opts.map((r,i)=>`<button class="btn" data-m="o${i}">${cap(r.text)}</button>`).join('')}</div><button class="btn sm" data-m="close">${tr('Inte än','Not yet')}</button>`,h);
  };
  st.reveal=()=>`<p><b>${tr('Solportens regel:','The Sun Gate\'s rule:')}</b> ${cap(st.rule.text)}.</p><p><b>${tr('Månporten:','The Moon Gate:')}</b> ${tr('alla andra.','everyone else.')}</p>${tipFor(st.rule)?`<p>${tipFor(st.rule)}</p>`:''}${st.cracked?`<p><b>${tr('Du gissade regeln. Snyggt detektivarbete!','You guessed the rule. Nice detective work!')}</b></p>`:''}`;
  return st;
}

// =========================================================
//  Ballongfärden — exakt rätt summa
// =========================================================
const BALLOON_SVG=`<svg viewBox="0 0 200 200" aria-hidden="true"><path d="M100 6C42 6 18 50 18 88c0 40 44 66 64 92h36c20-26 64-52 64-92 0-38-24-82-82-82z" fill="#ff6b6b" stroke="#17335b" stroke-width="5" stroke-linejoin="round"/><path d="M100 6C78 30 66 60 68 92s10 64 18 88M100 6c22 24 34 54 32 86s-10 64-18 88" fill="#ffc63f" stroke="#17335b" stroke-width="4"/><path d="M100 6v174" stroke="#17335b" stroke-width="3" stroke-opacity=".5"/><path d="M84 180l-20 20M116 180l20 20M94 180l-6 20M106 180l6 20" stroke="#17335b" stroke-width="3"/></svg>`;
function makeBalloon(troupe,L){
  const st=baseStation('balloon',troupe,L);
  st.setHearts(L>=3?5:4);st.basket=[];
  st.showSum=L===1||L===3;
  st.newTrip=()=>{
    const s=Math.min(st.waiting.length,rnd(2,3));
    const grp=shuffle(st.waiting).slice(0,s);
    st.target=sum(grp.map(c=>c.n));
    st.count=L>=3?s:null;
    st.expr=L>=3?exprFor(st.target,L):null;
    st.basket=[];
  };
  st.newTrip();
  st.say=L>=3?tr('Räkna ut talet på skylten. Lasta sedan exakt så mycket vikt, med rätt antal passagerare.','Work out the number on the sign. Then load exactly that much weight, with the right number of passengers.'):tr('Varje numling väger lika mycket som talet på magen. Tryck på numlingar för att lasta korgen med exakt rätt vikt.','Each numling weighs as much as the number on its tummy. Tap numlings to load the basket with exactly the right weight.');
  const PASS=n=>pl(n,tr('passagerare','passenger'),tr('passagerare','passengers'));
  const inBasket=c=>st.basket.includes(c);
  st.html=()=>{
    const tot=sum(st.basket.map(c=>c.n));
    const sign=st.expr?`<small>${tr('Behöver exakt','Needs exactly')}</small><b class="expr">${st.expr}</b><small>${tr('med','with')} ${PASS(st.count)}</small>`:`<small>${tr('Behöver exakt','Needs exactly')}</small><b>${st.target}</b>`;
    return `<div class="canyon">
      <div class="cliff"><div class="tray-label">${tr('Väntar','Waiting')}</div><div class="tray" data-drop="tray">${st.waiting.filter(c=>!inBasket(c)).map(c=>crHTML(c,{dr:1,cls:st.fx.shake===c.id?'shake':''})).join('')||`<span class="hint">${tr('Alla sitter i korgen.','Everyone is in the basket.')}</span>`}</div></div>
      <div class="balloon ${st.flying?'flying':''}">
        <div class="envelope">${BALLOON_SVG}<div class="sign">${sign}</div></div>
        <div class="basket" data-drop="basket" tabindex="0" aria-label="${tr('Korgen','The basket')}">${st.basket.map(c=>crHTML(c,{dr:1})).join('')}</div>
        ${st.showSum?`<div class="sum" aria-live="polite">${st.basket.length?`${st.basket.map(c=>c.n).join(' + ')} = ${tot}`:tr('Korgen är tom','The basket is empty')}</div>`:''}
      </div>
      <div class="cliff"><div class="tray-label">${tr('Över ravinen','Across the canyon')}</div><div class="tray">${st.across.map(c=>crHTML(c,{sm:1,cls:st.fx.pop&&st.fx.pop.includes(c.id)?'pop':''})).join('')}</div></div>
    </div>
    <div class="actions"><button class="btn go big" data-act="lift" ${!st.basket.length||st.flying||st.done?'disabled':''}>${tr('Lyft!','Lift!')}</button>${st.basket.length?`<button class="btn" data-act="empty">${tr('Töm korgen','Empty the basket')}</button>`:''}</div>`;
  };
  st.onTap=id=>{
    if(st.done||st.flying)return;
    const c=st.waiting.find(x=>x.id===id);if(!c)return;
    if(inBasket(c))st.basket=st.basket.filter(x=>x!==c);
    else if(st.basket.length<6)st.basket.push(c);
    else{st.say=tr('Korgen är full. Högst sex passagerare!','The basket is full. Six passengers at most!');st.mood='bad';}
    SFX.pop();st.render();
  };
  st.onDrop=(id,zone)=>{
    if(st.done||st.flying)return;
    const c=st.waiting.find(x=>x.id===id);if(!c)return;
    if(zone==='basket'&&!inBasket(c)&&st.basket.length<6)st.basket.push(c);
    else if(zone==='tray'&&inBasket(c))st.basket=st.basket.filter(x=>x!==c);
    SFX.pop();st.render();
  };
  st.acts.empty=()=>{st.basket=[];st.render();};
  st.acts.lift=()=>{
    if(!st.basket.length||st.flying||st.done)return;
    const tot=sum(st.basket.map(c=>c.n));
    if(st.count&&st.basket.length!==st.count){st.strike(tr(`Skylten säger exakt ${pl(st.count,'passagerare','passagerare')}, men korgen har ${st.basket.length}.`,`The sign says exactly ${pl(st.count,'passenger','passengers')}, but the basket has ${st.basket.length}.`));st.render();return;}
    if(tot!==st.target){
      st.strike(tot>st.target?tr('För tungt! Ballongen lyfter inte från marken.','Too heavy! The balloon does not leave the ground.'):tr('För lätt! Ballongen vinglar och sjunker ner igen.','Too light! The balloon wobbles and sinks back down.'));
      st.render();return;
    }
    const riders=st.basket.slice();
    st.flying=true;SFX.ok();st.say=`${pick(PRAISE)} ${riders.map(c=>c.n).join(' + ')} = ${st.target}. ${tr('Upp, upp och iväg!','Up, up and away!')}`;st.mood='good';st.render();
    setTimeout(()=>{
      st.flying=false;
      st.waiting=st.waiting.filter(c=>!riders.includes(c));st.across.push(...riders);st.fx={pop:riders.map(c=>c.id)};
      if(!st.waiting.length){st.say=tr('Alla flög över ravinen!','Everyone flew across the canyon!');st.win();}
      else st.newTrip();
      st.render();
    },reduceMotion()?200:1200);
  };
  return st;
}

// =========================================================
//  Mönsterbäcken — talföljder
// =========================================================
function makeStones(troupe,L){
  const st=baseStation('stones',troupe,L);
  st.setHearts(L>=3?5:4);
  st.per=Math.max(2,Math.ceil(troupe.length/4));
  st.next=()=>{const s=makeSeq(st.L);st.seq=s.seq;st.why=s.why;st.blanks=s.blanks;st.bi=0;st.input='';st.hint=false;st.solved=false;};
  st.next();
  st.say=tr(`Hitta ${st.blanks.length>1?'de saknade talen':'det saknade talet'} på stegstenarna. Skriv svaret och tryck på ✓.`,`Find ${st.blanks.length>1?'the missing numbers':'the missing number'} on the stepping stones. Type the answer and tap ✓.`);
  st.html=()=>{
    const n=st.seq.length;
    const known=i=>!st.blanks.includes(i)||st.blanks.indexOf(i)<st.bi||st.solved;
    let cells='';
    st.seq.forEach((v,i)=>{
      const blank=!known(i),active=blank&&i===st.blanks[st.bi];
      const filledBlank=st.blanks.includes(i)&&known(i);
      const txt=blank?(active?(st.input||'?'):'?'):v;
      const d=String(txt).length>=4?'d4':String(txt).length===3?'d3':'';
      cells+=`<div class="stone ${blank?'blank':''} ${active?'active':''} ${filledBlank?'done':''} ${active&&st.fx.wob?'wobble':''} ${d}" style="grid-column:${i*2+1};grid-row:1" ${active?'aria-live="polite"':''} aria-label="${blank?tr('saknat tal','missing number'):v}">${txt}</div>`;
      if(i<n-1&&st.hint){
        const ok=known(i)&&known(i+1);const df=st.seq[i+1]-v;
        cells+=`<div class="diff" style="grid-column:${i*2+2};grid-row:1">${ok?(df>=0?'+'+df:'−'+(-df)):'?'}</div>`;
      }
    });
    const keys=[1,2,3,4,5,6,7,8,9,'⌫',0,'✓'];
    return `<div class="creek">
      <div class="bank"><div class="tray-label">${tr('Väntar','Waiting')}</div><div class="tray">${st.waiting.map(c=>crHTML(c,{sm:1})).join('')}</div></div>
      <div class="water"><div class="stones" style="--k:${n-1}">${cells}</div></div>
      <div class="bank"><div class="tray-label">${tr('Över bäcken','Across the creek')}</div><div class="tray">${st.across.map(c=>crHTML(c,{sm:1,cls:st.fx.pop&&st.fx.pop.includes(c.id)?'pop':''})).join('')}</div></div>
    </div>
    <div class="padrow">
      ${st.solved?'':`<div class="numpad" role="group" aria-label="${tr('Sifferknappar','Number keys')}">${keys.map(k=>`<button class="key ${k==='✓'?'ok':''}" data-act="key" data-v="${k}" aria-label="${k==='⌫'?tr('Radera','Delete'):k==='✓'?tr('Kontrollera svaret','Check the answer'):k}" ${st.done?'disabled':''}>${k}</button>`).join('')}</div>`}
      <div class="side">${st.solved?`<p><b>${tr('Mönster:','Pattern:')}</b> ${st.why}</p>${st.waiting.length?`<button class="btn go big" data-act="next">${tr('Nya stenar','New stones')}</button>`:''}`:`<button class="btn" data-act="hint" ${st.hint?'disabled':''}>${tr('Visa hoppen','Show the jumps')}</button><p class="hint">${tr('Varje klar stig bär över','Every finished path carries across')} ${NUMLINGS(Math.min(st.per,st.waiting.length))}.</p>`}</div>
    </div>`;
  };
  st.press=k=>{
    if(st.done||st.solved)return;
    if(k==='⌫'){st.input=st.input.slice(0,-1);SFX.key();st.render();return;}
    if(k==='✓'){st.check();return;}
    if(st.input.length<4){st.input=(st.input==='0'?'':st.input)+k;SFX.key();st.render();}
  };
  st.check=()=>{
    if(!st.input)return;
    const v=+st.input,want=st.seq[st.blanks[st.bi]];
    if(v===want){
      st.bi++;st.input='';SFX.ok();
      if(st.bi>=st.blanks.length){
        st.solved=true;
        const movers=st.waiting.slice(0,st.per);
        st.waiting=st.waiting.slice(movers.length);st.across.push(...movers);st.fx={pop:movers.map(c=>c.id)};
        st.say=`${pick(PRAISE)} ${tr(`Stenarna ligger stadigt och ${NUMLINGS(movers.length)} hoppar över.`,`The stones are steady and ${NUMLINGS(movers.length)} hop across.`)}`;st.mood='good';
        if(!st.waiting.length){st.say=tr('Alla tog sig över Mönsterbäcken!','Everyone made it across Pattern Creek!');st.win();}
      }else{st.say=tr('Rätt! Nu nästa saknade sten.','Right! Now the next missing stone.');st.mood='good';}
    }else{
      st.input='';st.fx={wob:1};
      st.strike(tr(`${v} passar inte. ${st.hint?'Titta på hoppen mellan stenarna.':'Prova ”Visa hoppen” om du vill ha hjälp.'}`,`${v} does not fit. ${st.hint?'Look at the jumps between the stones.':'Try “Show the jumps” if you want help.'}`));
    }
    st.render();
  };
  st.onKey=k=>{if(/^[0-9]$/.test(k)){st.press(+k);return true;}if(k==='Backspace'){st.press('⌫');return true;}if(k==='Enter'){st.press('✓');return true;}return false;};
  st.acts.key=b=>{const v=b.dataset.v;st.press(/^[0-9]$/.test(v)?+v:v);};
  st.acts.hint=()=>{st.hint=true;st.render();};
  st.acts.next=()=>{st.next();st.say=tr('Nya stenar! Vad kommer sedan?','New stones! What comes next?');st.mood='';st.render();};
  return st;
}

// =========================================================
//  Näckrosdammen — Venndiagram
// =========================================================
const VC=[
  {name:tr('Grön','Green'),def:tr('den gröna cirkeln','the green circle'),stroke:'#2a8f52',fill:'rgba(70,185,115,.32)'},
  {name:tr('Orange','Orange'),def:tr('den orange cirkeln','the orange circle'),stroke:'#d9721a',fill:'rgba(255,155,55,.32)'},
  {name:tr('Rosa','Pink'),def:tr('den rosa cirkeln','the pink circle'),stroke:'#c93d7c',fill:'rgba(235,100,160,.28)'}
];
function makeVenn(troupe,L){
  const st=baseStation('venn',troupe,L);
  st.k=L>=4?3:2;st.rules=pickVennRules(L,troupe);
  // Nivå 1: alla regler syns. Nivå 2: alla hemliga. Nivå 3–4: den svåraste regeln syns, resten är hemliga.
  if(L===1)st.visible=st.rules.map(()=>true);
  else if(L===2)st.visible=st.rules.map(()=>false);
  else{const top=st.rules.reduce((b,r,i)=>r.lvl>st.rules[b].lvl?i:b,0);st.visible=st.rules.map((r,i)=>i===top);}
  st.setHearts(L>=4?7:L===3?6:5);st.placed=[];
  st.circles=st.k===2?[{x:240,y:205,r:135},{x:360,y:205,r:135}]:[{x:245,y:150,r:116},{x:355,y:150,r:116},{x:300,y:250,r:116}];
  const nv=st.visible.filter(Boolean).length;
  st.say=nv===st.k?tr('Läs cirklarnas regler och släpp sedan varje numling på rätt plats.','Read the circles\' rules, then drop every numling in the right place.'):nv?tr('En regel syns, resten är hemliga. Släpp numlingar i dammen och lista ut var de hör hemma!','One rule is shown, the rest are secret. Drop numlings in the pond and work out where they belong!'):tr('Cirklarna har hemliga regler. Släpp numlingar i dammen och lista ut var de hör hemma!','The circles have secret rules. Drop numlings in the pond and work out where they belong!');
  st.tapSay=tr('Tryck nu på den plats i dammen där den hör hemma.','Now tap the place in the pond where it belongs.');
  const pondSVG=()=>`<svg viewBox="0 0 600 400" aria-hidden="true"><defs><linearGradient id="pw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#63b9db"/><stop offset="1" stop-color="#3f93bd"/></linearGradient></defs><rect width="600" height="400" fill="url(#pw)"/><g fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="3" stroke-linecap="round"><path d="M30 60q20-8 40 0M520 340q20-8 40 0M40 330q16-6 32 0M530 70q16-6 32 0"/></g><g fill="#5fb36f" stroke="#17335b" stroke-width="2.5"><path d="M38 360a22 16 0 1 0 30 6l-14-6z"/><path d="M560 40a20 14 0 1 0 -26 -8l12 6z"/></g>${st.circles.map((c,i)=>`<circle cx="${c.x}" cy="${c.y}" r="${c.r}" fill="${VC[i].fill}" stroke="${VC[i].stroke}" stroke-width="7"/>`).join('')}</svg>`;
  st.html=()=>`
    <div class="legend">${st.rules.map((r,i)=>`<div class="lchip" style="--c:${VC[i].stroke}"><i></i><span><b>${VC[i].name} ${tr('cirkel','circle')}:</b> ${st.visible[i]||st.done?cap(r.text):'<span class="secret">? ? ?</span>'}</span></div>`).join('')}</div>
    <div class="pond" data-drop="pond" aria-label="${tr(`Damm med ${st.k} cirklar`,`Pond with ${st.k} circles`)}">${pondSVG()}${st.placed.map(p=>crHTML(p.c,{style:`left:${(p.x/6).toFixed(2)}%;top:${(p.y/4).toFixed(2)}%`,cls:st.fx.pop===p.c.id?'pop':''})).join('')}</div>
    <div><div class="tray-label">${tr('Väntar på stranden','Waiting on the shore')}</div><div class="tray" data-drop="tray">${st.waiting.map(c=>crHTML(c,{dr:1,sel:st.sel===c.id,cls:st.fx.shake===c.id?'shake':''})).join('')||`<span class="hint">${tr('Alla är i dammen!','Everyone is in the pond!')}</span>`}</div></div>`;
  st.onDrop=(id,zone,x,y)=>{
    if(st.done)return;
    const c=st.waiting.find(q=>q.id===id);st.sel=null;
    if(!c||zone!=='pond'){st.render();return;}
    const r=document.querySelector('.pond').getBoundingClientRect();
    const px=Math.min(578,Math.max(22,(x-r.left)/r.width*600)),py=Math.min(378,Math.max(22,(y-r.top)/r.height*400));
    const regionAt=(qx,qy)=>st.circles.map(ci=>(qx-ci.x)**2+(qy-ci.y)**2<=ci.r**2);
    const inside=regionAt(px,py);
    const truth=st.rules.map(rl=>rl.test(c));
    if(inside.every((v,i)=>v===truth[i])){
      // flytta lite om någon annan numling redan står på samma plats
      const key=inside.join(),free=(qx,qy)=>st.placed.every(p=>(p.x-qx)**2+(p.y-qy)**2>=36*36);
      let spot=[px,py];
      if(!free(px,py)){
        search:for(let rad=24;rad<=120;rad+=12)for(let a=0;a<16;a++){
          const qx=px+rad*Math.cos(a*Math.PI/8),qy=py+rad*Math.sin(a*Math.PI/8);
          if(qx<22||qx>578||qy<22||qy>378)continue;
          if(regionAt(qx,qy).join()===key&&free(qx,qy)){spot=[qx,qy];break search;}
        }
      }
      st.waiting=st.waiting.filter(q=>q!==c);st.placed.push({c,x:spot[0],y:spot[1]});st.across.push(c);
      SFX.ok();st.fx={pop:c.id};st.say=`${pick(PRAISE)} ${tr(`Nummer ${c.n} hittade sitt näckrosblad.`,`Number ${c.n} found its lily pad.`)}`;st.mood='good';
      if(!st.waiting.length){st.say=tr('Alla är sorterade! Här är de hemliga reglerna.','Everyone is sorted! Here are the secret rules.');st.win();}
    }else{
      st.fx={shake:c.id};
      const i=inside.findIndex((v,j)=>v!==truth[j]);
      if(st.visible[i])st.strike(tr(`Kolla ${VC[i].def}: nummer ${c.n} ${truth[i]?'passar':'passar inte'} ”${st.rules[i].short}”.`,`Check ${VC[i].def}: number ${c.n} ${truth[i]?'fits':'does not fit'} “${st.rules[i].short}”.`));
      else st.strike(tr('Plask! Det är inte rätt plats. Prova någon annanstans.','Splash! That is not the right place. Try somewhere else.'));
    }
    st.render();
  };
  st.reveal=()=>st.rules.map((r,i)=>`<p><b>${VC[i].name} ${tr('cirkel','circle')}:</b> ${cap(r.text)}.</p>`).join('')+(st.rules.map(tipFor).filter(Boolean).slice(0,1).map(t=>`<p>${t}</p>`).join(''));
  return st;
}

// =========================================================
//  Kompisflotten — grannar följer en regel
// =========================================================
function makeRaft(troupe,L){
  const st=baseStation('raft',troupe,L);
  st.setHearts(L>=3?5:4);st.ring=L>=4;st.seatsMax=4;
  const n0=troupe.length,k0=Math.min(st.seatsMax,n0);
  const cands=wshuffle(PAIR_RULES.filter(r=>r.lvl<=L),L>=3?(r=>r.lvl>=L-1?2:1):(r=>r.lvl===L?4:1));
  st.rule=cands.find(r=>findChain(troupe,k0,r.test,st.ring&&k0>=4))||cands.find(r=>findChain(troupe,Math.min(3,n0),r.test,false))||PAIR_RULES[0];
  st.newTrip=()=>{
    const rem=st.waiting;let k=Math.min(st.seatsMax,rem.length);
    while(k>1&&!findChain(rem,k,st.rule.test,st.ring&&k>=4))k--;
    st.k=k;st.isRing=st.ring&&k>=4;st.seats=new Array(k).fill(null);st.res=null;
  };
  st.newTrip();
  st.say=tr(`Fyll alla ${st.k} platser så att varje grannpar följer regeln. Tryck sedan på Segla!`,`Fill all ${st.k} seats so that every pair of neighbours follows the rule. Then tap Sail!`);
  st.tapSay=tr('Tryck nu på en plats på flotten.','Now tap a seat on the raft.');
  const SEATS=n=>pl(n,tr('plats','seat'),tr('platser','seats'));
  const seatOf=id=>st.seats.indexOf(id);
  const pairs=()=>{const p=A(st.k-1,i=>[i,i+1]);if(st.isRing)p.push([st.k-1,0]);return p;};
  const byId=id=>st.waiting.find(c=>c.id===id)||st.across.find(c=>c.id===id);
  const linkState=(i,j,idx)=>{
    if(st.res)return st.res[idx];
    if(st.L===1&&st.seats[i]!=null&&st.seats[j]!=null)return st.rule.test(byId(st.seats[i]),byId(st.seats[j]))?'ok':'bad';
    return '';
  };
  st.html=()=>{
    const ps=pairs();
    let raft='';
    const seatHTML=i=>{const id=st.seats[i];const c=id!=null?byId(id):null;return `<div class="seat" data-drop="seat-${i}" tabindex="0" aria-label="${tr('Plats','Seat')} ${i+1}${c?': '+describe(c):tr(', tom',', empty')}"${st.isRing?` style="left:${(50+35*Math.cos(-Math.PI/2+2*Math.PI*i/st.k)).toFixed(2)}%;top:${(50+35*Math.sin(-Math.PI/2+2*Math.PI*i/st.k)).toFixed(2)}%"`:''}>${c?crHTML(c,{dr:1,sel:st.sel===c.id}):''}</div>`;};
    const linkHTML=(idx,style='')=>{const s=linkState(ps[idx][0],ps[idx][1],idx);return `<span class="link ${s}"${style} aria-hidden="true">${s==='ok'?'✓':s==='bad'?'✗':''}</span>`;};
    if(st.isRing){
      for(let i=0;i<st.k;i++)raft+=seatHTML(i);
      ps.forEach((p,idx)=>{const a=-Math.PI/2+2*Math.PI*(p[0]+.5)/st.k;raft+=linkHTML(idx,` style="left:${(50+30*Math.cos(a)).toFixed(2)}%;top:${(50+30*Math.sin(a)).toFixed(2)}%"`);});
    }else{
      for(let i=0;i<st.k;i++){raft+=seatHTML(i);if(i<st.k-1)raft+=linkHTML(i);}
    }
    const shore=st.waiting.filter(c=>seatOf(c.id)<0);
    return `<div class="rulesign panel"><b>${tr('Flottens regel:','The raft\'s rule:')}</b> ${st.rule.text}${st.isRing?` <b>${tr('Flotten är rund: första och sista platsen är också grannar.','The raft is round: the first and last seats are neighbours too.')}</b>`:''}</div>
    <div class="sidewrap">
      <div class="sidemain">
        <div class="lake ${st.sailing?'sailing':''}"><div class="raft ${st.isRing?'ring':''}">${raft}</div></div>
        <div class="actions"><button class="btn go big" data-act="sail" ${st.sailing||st.done?'disabled':''}>${tr('Segla!','Sail!')}</button>${st.seats.some(x=>x!=null)?`<button class="btn" data-act="clear">${tr('Töm flotten','Clear the raft')}</button>`:''}</div>
      </div>
      <div class="sidecol">
        <div><div class="tray-label">${tr('På stranden','On the shore')}</div><div class="tray" data-drop="shore">${shore.map(c=>crHTML(c,{dr:1,sel:st.sel===c.id})).join('')||`<span class="hint">${tr('Alla sitter på flotten.','Everyone is on the raft.')}</span>`}</div></div>
        <div><div class="tray-label">${tr('Över sjön','Across the lake')}</div><div class="tray">${st.across.map(c=>crHTML(c,{sm:1,cls:st.fx.pop&&st.fx.pop.includes(c.id)?'pop':''})).join('')}</div></div>
      </div>
    </div>`;
  };
  st.onTap=id=>{
    if(st.done||st.sailing)return;
    if(st.sel!=null&&st.sel!==id&&seatOf(id)>=0){st.onDrop(st.sel,'seat-'+seatOf(id));return;}
    st.sel=st.sel===id?null:id;SFX.pop();
    if(st.sel!=null){st.say=seatOf(id)>=0?tr('Tryck på en annan plats för att flytta den, eller på stranden för att ta av den.','Tap another seat to move it, or the shore to take it off.'):st.tapSay;st.mood='';}
    st.render();
  };
  st.onDrop=(id,zone)=>{
    if(st.done||st.sailing)return;
    st.sel=null;const from=seatOf(id);
    if(zone.startsWith('seat-')){
      const to=+zone.slice(5);
      if(from===to){st.render();return;}
      const other=st.seats[to];st.seats[to]=id;
      if(from>=0)st.seats[from]=other;
      st.res=null;SFX.pop();
    }else if(zone==='shore'&&from>=0){st.seats[from]=null;st.res=null;SFX.pop();}
    const left=st.seats.filter(x=>x==null).length;
    st.say=left?tr(`Fortsätt! ${SEATS(left)} kvar att fylla.`,`Keep going! ${SEATS(left)} left to fill.`):tr('Flotten är full. Följer alla grannar regeln? Tryck på Segla!','The raft is full. Do all neighbours follow the rule? Tap Sail!');st.mood='';
    st.render();
  };
  st.acts.clear=()=>{st.seats.fill(null);st.res=null;st.sel=null;st.render();};
  st.acts.sail=()=>{
    if(st.sailing||st.done)return;
    const empty=st.seats.filter(x=>x==null).length;
    if(empty){st.say=tr(`Fyll alla ${st.k} platser först. ${SEATS(empty)} är fortfarande ${empty===1?'tom':'tomma'}.`,`Fill all ${st.k} seats first. ${SEATS(empty)} ${empty===1?'is':'are'} still empty.`);st.mood='bad';SFX.bad();st.render();return;}
    const ps=pairs();
    st.res=ps.map(([i,j])=>st.rule.test(byId(st.seats[i]),byId(st.seats[j]))?'ok':'bad');
    const bad=st.res.filter(x=>x==='bad').length;
    if(bad){st.strike(tr(`${bad===1?'Ett grannpar bryter':bad+' grannpar bryter'} mot regeln. Leta efter de röda markeringarna.`,`${bad===1?'One pair of neighbours breaks':bad+' pairs of neighbours break'} the rule. Look for the red marks.`));st.render();return;}
    const riders=st.seats.map(byId);
    st.sailing=true;SFX.ok();st.say=`${pick(PRAISE)} ${tr('Alla grannpar följer regeln. Iväg de seglar!','Every pair of neighbours follows the rule. Off they sail!')}`;st.mood='good';st.render();
    setTimeout(()=>{
      st.sailing=false;
      st.waiting=st.waiting.filter(c=>!riders.includes(c));st.across.push(...riders);st.fx={pop:riders.map(c=>c.id)};
      if(!st.waiting.length){st.say=tr('Alla tog sig över sjön!','Everyone made it across the lake!');st.win();}
      else{st.newTrip();st.say=st.k===1?tr('Ingen av de som är kvar kan sitta bredvid varandra enligt regeln, så en numling åker ensam. Sätt en numling på flotten!','None of those left can sit next to each other under the rule, so one numling goes alone. Put a numling on the raft!'):tr(`Flotten är tillbaka med ${SEATS(st.k)}. Samma regel!`,`The raft is back with ${SEATS(st.k)}. Same rule!`);st.mood='';}
      st.render();
    },reduceMotion()?200:1200);
  };
  return st;
}

function lockLegend(st){
  return st.mode==='color'
    ?tr(`<div class="legend-s"><span><i class="sq" style="background:#5cc27f"></i> Grön: rätt siffra på rätt plats.</span><span><i class="sq" style="background:#ffc63f"></i> Gul: siffran finns i koden, men på en annan plats.</span><span><i class="sq" style="background:#c9cdd4"></i> Grå: siffran finns inte i koden${st.rep?' (eller inte så många gånger)':''}.</span></div>`,
      `<div class="legend-s"><span><i class="sq" style="background:#5cc27f"></i> Green: the right digit in the right place.</span><span><i class="sq" style="background:#ffc63f"></i> Yellow: the digit is in the code, but in another place.</span><span><i class="sq" style="background:#c9cdd4"></i> Grey: the digit is not in the code${st.rep?' (or not that many times)':''}.</span></div>`)
    :tr(`<div class="legend-s"><span><i class="peg full"></i> En siffra är rätt OCH på rätt plats.</span><span><i class="peg hollow"></i> En siffra finns i koden men på fel plats.</span><span>Ugglan säger inte vilka siffror prickarna gäller!</span></div>`,
      `<div class="legend-s"><span><i class="peg full"></i> A digit is right AND in the right place.</span><span><i class="peg hollow"></i> A digit is in the code but in the wrong place.</span><span>The owl does not say which digits the dots are about!</span></div>`);
}
function makeLock(troupe,L){
  const st=baseStation('lock',troupe,L);
  const cfg=[null,
    {slots:3,D:4,rep:false,mode:'color',free:6},
    {slots:3,D:6,rep:true,mode:'color',free:7},
    {slots:4,D:6,rep:false,mode:'color',free:8},
    {slots:4,D:6,rep:false,mode:'count',free:10}][L];
  Object.assign(st,cfg);
  st.code=st.rep?A(st.slots,()=>rnd(1,st.D)):shuffle(A(st.D,i=>i+1)).slice(0,st.slots);
  st.guesses=[];st.cur=[];
  st.say=tr(`Gissa ugglans kod med ${st.slots} siffror. Varje siffra är från 1 till ${st.D}.${st.rep?' En siffra kan finnas flera gånger.':' Ingen siffra används två gånger.'}`,
    `Guess the owl's code with ${st.slots} digits. Each digit is from 1 to ${st.D}.${st.rep?' A digit can appear more than once.':' No digit is used twice.'}`);
  const freeLeft=()=>Math.max(0,st.free-st.guesses.length);
  const GUESSES=n=>pl(n,tr('gissning','guess'),tr('gissningar','guesses'));
  st.heartsHTML=()=>`<div class="tries" aria-live="polite">${tr('Gratisgissningar kvar','Free guesses left')}: ${freeLeft()}</div>`;
  const feedback=g=>{
    if(st.mode==='color'){
      const res=A(g.length,()=>'no'),left={};
      g.forEach((d,i)=>{if(d===st.code[i])res[i]='yes';else left[st.code[i]]=(left[st.code[i]]||0)+1;});
      g.forEach((d,i)=>{if(res[i]!=='yes'&&left[d]>0){res[i]='near';left[d]--;}});
      return res;
    }
    let exact=0;g.forEach((d,i)=>{if(d===st.code[i])exact++;});
    let common=0;for(let d=1;d<=st.D;d++)common+=Math.min(g.filter(x=>x===d).length,st.code.filter(x=>x===d).length);
    return{exact,near:common-exact};
  };
  st.html=()=>{
    const solved=st.done&&st.guesses.length&&st.guesses[st.guesses.length-1].win;
    const mood=solved?'happy':st.guesses.length>=st.free?'sleepy':'';
    const owlLine=solved?tr('Ho-hurra! Du knäckte min kod!','Hoo-hooray! You cracked my code!'):st.guesses.length===0?tr('Hoho! Kan du knäcka min kod?','Hoo-hoo! Can you crack my code?'):st.guesses.length>=st.free?tr('Gääsp … jag börjar bli sömnig. Skynda dig!','Yaaawn … I\'m getting sleepy. Hurry up!'):tr('Hmm, ho-ho. Fortsätt tänka!','Hmm, hoo-hoo. Keep thinking!');
    const rows=st.guesses.map((g,gi)=>`<div class="grow"><span class="gnum">${gi+1}.</span>${g.g.map((d,i)=>`<span class="cell ${st.mode==='color'?g.fb[i]:''}">${d}</span>`).join('')}${st.mode==='count'?`<span class="pegs" role="img" aria-label="${tr(`${g.fb.exact} rätt plats, ${g.fb.near} fel plats`,`${g.fb.exact} right place, ${g.fb.near} wrong place`)}">${A(g.fb.exact,()=>'<i class="peg full"></i>').join('')}${A(g.fb.near,()=>'<i class="peg hollow"></i>').join('')}${g.fb.exact+g.fb.near===0?`<span class="hint">${tr('inga','none')}</span>`:''}</span>`:''}</div>`).join('');
    const cur=A(st.slots,i=>`<span class="cell cur ${st.cur[i]!=null?'filled':''}">${st.cur[i]??''}</span>`).join('');
    return `<div class="lockscene">
      <div class="owlbox">${owlSVG(mood)}<div class="owl-say">${owlLine}</div></div>
      <div class="lockpanel panel">
        ${lockLegend(st)}
        <div class="history">${rows||`<span class="hint">${tr('Dina gissningar visas här.','Your guesses show up here.')}</span>`}</div>
        ${st.done?'':`<div class="grow" aria-label="${tr('Din gissning','Your guess')}">${cur}</div>
        <div class="numpad wide" role="group" aria-label="${tr('Siffror','Digits')}">${A(st.D,i=>`<button class="key" data-act="dig" data-v="${i+1}">${i+1}</button>`).join('')}<button class="key" data-act="del" aria-label="${tr('Radera','Delete')}">⌫</button><button class="key ok" data-act="try" ${st.cur.length<st.slots?'disabled':''} aria-label="${tr('Testa koden','Try the code')}">${tr('Testa','Try')}</button></div>`}
      </div>
    </div>
    <div><div class="tray-label">${tr('Väntar vid dörren','Waiting at the door')}</div><div class="tray">${st.waiting.map(c=>crHTML(c,{sm:1})).join('')||`<span class="hint">${tr('Ingen väntar längre.','Nobody is waiting any more.')}</span>`}</div></div>`;
  };
  st.dig=d=>{
    if(st.done||st.cur.length>=st.slots)return;
    if(!st.rep&&st.cur.includes(d)){st.say=tr('Ingen siffra används två gånger i den här koden. Välj en annan.','No digit is used twice in this code. Pick another one.');st.mood='bad';st.render();return;}
    st.cur.push(d);SFX.key();st.render();
  };
  st.del=()=>{if(st.done)return;st.cur.pop();SFX.key();st.render();};
  st.tryIt=()=>{
    if(st.done||st.cur.length<st.slots)return;
    const g=st.cur.slice(),fb=feedback(g);st.cur=[];
    const win=g.every((d,i)=>d===st.code[i]);
    st.guesses.push({g,fb,win});
    if(win){
      st.across.push(...st.waiting);st.waiting=[];SFX.win();
      st.say=`${pick(PRAISE)} ${tr(`Dörren knarrar upp efter ${GUESSES(st.guesses.length)}. Alla går igenom!`,`The door creaks open after ${GUESSES(st.guesses.length)}. Everyone goes through!`)}`;st.mood='good';
      st.win();
    }else if(st.guesses.length>st.free){
      const c=st.waiting.pop();st.back.push(c);SFX.bad();
      if(!st.waiting.length){st.say=tr('Ugglan somnade, och den sista numlingen gick tillbaka till lägret.','The owl fell asleep, and the last numling went back to camp.');st.mood='bad';st.done=true;setTimeout(()=>finishStation(st),1300);}
      else{st.say=tr(`Ugglan gäspar, och en numling går tillbaka till lägret för att vila. ${NUMLINGS(st.waiting.length)} väntar fortfarande.`,`The owl yawns, and a numling goes back to camp to rest. ${NUMLINGS(st.waiting.length)} ${st.waiting.length===1?'is':'are'} still waiting.`);st.mood='bad';}
    }else{
      SFX.pop();
      st.say=st.guesses.length===st.free?tr('Det var din sista gratisgissning. Tänk noga innan nästa!','That was your last free guess. Think carefully before the next one!'):pick(tr(['Använd ledtrådarna: vilka siffror kan du stryka?','Varje ledtråd säger något. Vad vet du säkert?','Prova att bara byta en eller två siffror för att testa en idé.'],['Use the clues: which digits can you cross out?','Every clue tells you something. What do you know for sure?','Try changing just one or two digits to test an idea.']));st.mood='';
    }
    st.render();
  };
  st.acts.dig=b=>st.dig(+b.dataset.v);
  st.acts.del=()=>st.del();
  st.acts.try=()=>st.tryIt();
  st.onKey=k=>{if(/^[1-9]$/.test(k)&&+k<=st.D){st.dig(+k);return true;}if(k==='Backspace'){st.del();return true;}if(k==='Enter'){st.tryIt();return true;}return false;};
  st.reveal=()=>`<p><b>${tr('Koden var:','The code was:')}</b> ${st.code.join(' ')}</p><p>${tr('Du använde','You used')} ${GUESSES(st.guesses.length)}.</p>`;
  return st;
}

const MACHINE_SVG=`<svg viewBox="0 0 300 190" aria-hidden="true"><path d="M14 18h64l-16 32H30z" fill="#ffc63f" stroke="#17335b" stroke-width="4" stroke-linejoin="round"/><rect x="36" y="48" width="20" height="26" fill="#c9d4e3" stroke="#17335b" stroke-width="4"/><rect x="196" y="26" width="24" height="40" fill="#c9d4e3" stroke="#17335b" stroke-width="4"/><g fill="#fff" opacity=".8"><circle cx="214" cy="16" r="8"/><circle cx="226" cy="6" r="5"/></g><rect x="22" y="64" width="246" height="112" rx="20" fill="#9fb3cf" stroke="#17335b" stroke-width="5"/><circle cx="92" cy="120" r="30" fill="none" stroke="#ffc63f" stroke-width="13" stroke-dasharray="10 7"/><circle cx="92" cy="120" r="21" fill="#ffc63f" stroke="#17335b" stroke-width="4"/><circle cx="92" cy="120" r="7" fill="#17335b"/><circle cx="148" cy="140" r="19" fill="none" stroke="#38d9a9" stroke-width="10" stroke-dasharray="8 6"/><circle cx="148" cy="140" r="12" fill="#38d9a9" stroke="#17335b" stroke-width="4"/><circle cx="148" cy="140" r="4" fill="#17335b"/><circle cx="236" cy="92" r="7" fill="#38d9a9" stroke="#17335b" stroke-width="3"/><circle cx="236" cy="114" r="7" fill="#ff6b6b" stroke="#17335b" stroke-width="3"/><rect x="196" y="132" width="56" height="12" rx="6" fill="#17335b"/><path d="M268 136h22v40h-14" fill="none" stroke="#17335b" stroke-width="5" stroke-linejoin="round"/></svg>`;
function makeMachine(troupe,L){
  const st=baseStation('machine',troupe,L);
  st.setHearts(L>=3?6:5);
  const nums=troupe.map(c=>c.n);st.mn=Math.min(...nums);st.mx=Math.max(...nums);

  for(let i=0;i<ex;i++){const c=st.waiting.shift();st.table.push({c,in:c.n,out:st.rule.f(c.n)});st.across.push(c);}
  st.say=ex?tr(`Maskinen visar hur den fungerar med de ${ex} första numlingarna. Vad kommer ut för nästa?`,`The machine shows how it works with the first ${ex} numlings. What comes out for the next one?`):tr('Vad kommer ut ur maskinen?','What comes out of the machine?');

      <div class="mach">${MACHINE_SVG}
        ${cur?`<div class="mdisp ${st.fx.wob?'shake':''}" aria-live="polite"><span>${cur.n}</span><span class="arrow">→</span><span class="out">${st.input||'?'}</span></div>`:''}
      </div>
      <div><div class="tray-label">${tr('Har gått igenom','Gone through')}</div><div class="tray">${st.across.map(c=>crHTML(c,{sm:1,cls:st.fx.pop===c.id?'pop':''})).join('')}</div></div>
    </div>
    <div class="padrow">
      ${cur&&!st.done?`<div class="numpad" role="group" aria-label="${tr('Sifferknappar','Number keys')}">${keys.map(k=>`<button class="key ${k==='✓'?'ok':''}" data-act="key" data-v="${k}" aria-label="${k==='⌫'?tr('Radera','Delete'):k==='✓'?tr('Kontrollera svaret','Check the answer'):k}">${k}</button>`).join('')}</div>`:''}
      <div class="side">
        <div class="ftable" role="table" aria-label="${tr('Det maskinen har gjort','What the machine has done')}"><span class="h">In</span><span></span><span class="h">${tr('Ut','Out')}</span>${st.table.map(r=>`<span>${r.in}</span><span class="ar">→</span><span>${r.out}</span>`).join('')}</div>
        ${cur&&!st.done?`<button class="btn go" data-act="guess" ${st.typed<1||st.waiting.length<2?'disabled':''}>${tr('Jag vet regeln!','I know the rule!')}</button>${st.typed<1?`<p class="hint">${tr('Räkna rätt på en numling först, sedan kan du gissa regeln.','Get one numling right first, then you can guess the rule.')}</p>`:''}`:''}

    if(k==='✓'){st.check();return;}
    if(st.input.length<4){st.input=(st.input==='0'?'':st.input)+k;SFX.key();st.render();}
  };
  st.check=()=>{
    if(!st.input)return;
    const c=st.waiting[0],v=+st.input,want=st.rule.f(c.n);
    st.input='';
    if(v===want){
      st.waiting.shift();st.table.push({c,in:c.n,out:want});st.across.push(c);st.typed++;
      SFX.ok();st.fx={pop:c.id};st.say=`${pick(PRAISE)} ${c.n} ${tr('blir','becomes')} ${want}.`;st.mood='good';
      if(!st.waiting.length){st.say=tr('Alla har gått genom Talmaskinen!','Everyone has gone through the Number Machine!');st.win();}
    }else{
      st.fx={wob:1};
      st.strike(tr(`${v} stämmer inte. Titta i tabellen: vad händer med talen i maskinen?`,`${v} is not right. Look at the table: what happens to the numbers in the machine?`));
    }
    st.render();
  };
  st.acts.key=b=>{const v=b.dataset.v;st.press(/^[0-9]$/.test(v)?+v:v);};
  st.acts.guess=()=>{
    const opts=machineOptions(st.rule,st.table.map(r=>r.in),st.L,st.mn,st.mx);
    const h={};opts.forEach((r,i)=>h['o'+i]=()=>{
      if(st.done)return;
      if(r===st.rule){

      }else{st.strike(tr('Inte den regeln. Kolla den mot talen i tabellen.','Not that rule. Check it against the numbers in the table.'));st.render();}
    });
    modal(`<h3>${tr('Vad gör Talmaskinen?','What does the Number Machine do?')}</h3><p>${tr('Kolla varje rad i tabellen. Bara en regel passar alla.','Check every row in the table. Only one rule fits them all.')}</p><div class="opts">${opts.map((r,i)=>`<button class="btn" data-m="o${i}">${cap(r.txt)}</button>`).join('')}</div><button class="btn sm" data-m="close">${tr('Inte än','Not yet')}</button>`,h);
  };
  st.onKey=k=>{if(/^[0-9]$/.test(k)){st.press(+k);return true;}if(k==='Backspace'){st.press('⌫');return true;}if(k==='Enter'){st.press('✓');return true;}return false;};
  st.reveal=()=>`<p><b>${tr('Maskinens regel:','The machine\'s rule:')}</b> ${cap(st.rule.txt)}</p><p>${st.rule.expl}</p>${st.cracked?`<p><b>${tr('Du listade ut regeln. Snyggt!','You worked out the rule. Nice!')}</b></p>`:''}`;
  return st;
}

// =========================================================
//  Trädgårdslandet — rader och kolumner med rätt summa
// =========================================================
function gardenSpec(L){return L===1?{r:2,c:2,stones:0,diag:false}:L===2?{r:2,c:3,stones:0,diag:false}:L===3?{r:3,c:3,stones:3,diag:false}:{r:3,c:3,stones:2,diag:true};}
function makeGarden(troupe,L){
  const st=baseStation('garden',troupe,L);
  st.setHearts(L>=3?5:4);
  st.newTrip=()=>{
    const sp=gardenSpec(st.L),cells=sp.r*sp.c;
    const use=Math.min(cells-sp.stones,st.waiting.length);
    const pos=shuffle(A(cells,i=>i)),rocks=new Set(pos.slice(0,cells-use));
    const chosen=shuffle(st.waiting).slice(0,use);
    let j=0;
    st.cells=A(cells,i=>rocks.has(i)?{rock:rnd(1,9)}:{id:null});
    const sol=A(cells,i=>rocks.has(i)?st.cells[i].rock:chosen[j++].n);
    st.spec=sp;st.res=null;
    st.rowT=A(sp.r,r=>sum(A(sp.c,c=>sol[r*sp.c+c])));
    st.colT=A(sp.c,c=>sum(A(sp.r,r=>sol[r*sp.c+c])));
    st.diagT=sp.diag?sum(A(sp.r,i=>sol[i*sp.c+i])):null;
  };
  st.newTrip();
  st.say=tr('Sätt numlingarna i landet så att varje rad och kolumn får rätt summa. Talen på stenarna räknas också.','Put the numlings in the patch so every row and column gets the right sum. The numbers on the stones count too.');
  st.tapSay=tr('Tryck nu på en ruta i landet.','Now tap a square in the patch.');
  const SQUARES=n=>pl(n,tr('ruta','square'),tr('rutor','squares'));
  const byId=id=>st.waiting.find(c=>c.id===id)||st.across.find(c=>c.id===id);
  const val=i=>{const x=st.cells[i];if(x.rock!=null)return x.rock;return x.id!=null?byId(x.id).n:0;};
  const filled=i=>st.cells[i].rock!=null||st.cells[i].id!=null;
  const cellOf=id=>st.cells.findIndex(x=>x.id===id);
  const lines=()=>{
    const {r,c}=st.spec,L=[];
    for(let y=0;y<r;y++)L.push({kind:'row',idx:y,cells:A(c,x=>y*c+x),t:st.rowT[y]});
    for(let x=0;x<c;x++)L.push({kind:'col',idx:x,cells:A(r,y=>y*c+x),t:st.colT[x]});
    if(st.spec.diag)L.push({kind:'diag',idx:0,cells:A(r,i=>i*c+i),t:st.diagT});
    return L;
  };
  const sumBox=(ln,label)=>{
    const now=sum(ln.cells.map(val)),full=ln.cells.every(filled);
    const cls=st.res?(now===ln.t?'ok':'wrong'):now>ln.t?'over':full&&now===ln.t?'ok':'';
    return `<div class="tsum ${cls}" aria-label="${label}: ${tr('ska bli','should be')} ${ln.t}, ${tr('nu','now')} ${now}"><b>${label?label+' ':''}${ln.t}</b><small>${tr('nu','now')} ${now}</small></div>`;
  };
  st.html=()=>{
    const {r,c}=st.spec,ls=lines();
    let g='';
    for(let y=0;y<r;y++){
      for(let x=0;x<c;x++){
        const i=y*c+x,cell=st.cells[i];
        if(cell.rock!=null)g+=`<div class="rock" aria-label="${tr('Sten med talet','Stone with the number')} ${cell.rock}">${cell.rock}</div>`;
        else{const cr=cell.id!=null?byId(cell.id):null;g+=`<div class="plot ${cr?'':'empty'}" data-drop="plot-${i}" tabindex="0" aria-label="${tr('Ruta','Square')} ${i+1}${cr?': '+describe(cr):tr(', tom',', empty')}">${cr?crHTML(cr,{dr:1,sel:st.sel===cr.id}):''}</div>`;}
      }
      g+=sumBox(ls.find(l=>l.kind==='row'&&l.idx===y),'');
    }
    for(let x=0;x<c;x++)g+=sumBox(ls.find(l=>l.kind==='col'&&l.idx===x),'');
    g+=st.spec.diag?sumBox(ls.find(l=>l.kind==='diag'),'↘'):'<div class="tsum ghost-cell"></div>';
    const loose=st.waiting.filter(cr=>cellOf(cr.id)<0);
    return `<div class="sidewrap"><div class="sidemain">
      <div class="garden"><div class="plots" style="--c:${c}">${g}</div></div>
      <div class="actions"><button class="btn go big" data-act="plant" ${st.done?'disabled':''}>${tr('Plantera!','Plant!')}</button>${st.cells.some(x=>x.id!=null)?`<button class="btn" data-act="clear">${tr('Töm landet','Clear the patch')}</button>`:''}</div>
    </div>
    <div class="sidecol">
      <div><div class="tray-label">${tr('Väntar','Waiting')}</div><div class="tray" data-drop="tray">${loose.map(cr=>crHTML(cr,{dr:1,sel:st.sel===cr.id})).join('')||`<span class="hint">${tr('Alla står i landet.','Everyone is in the patch.')}</span>`}</div></div>
      <div><div class="tray-label">${tr('Klara','Done')}</div><div class="tray">${st.across.map(cr=>crHTML(cr,{sm:1,cls:st.fx.pop&&st.fx.pop.includes(cr.id)?'pop':''})).join('')}</div></div>
    </div></div>`;
  };
  st.onTap=id=>{
    if(st.done)return;
    if(st.sel!=null&&st.sel!==id&&cellOf(id)>=0){st.onDrop(st.sel,'plot-'+cellOf(id));return;}
    st.sel=st.sel===id?null:id;SFX.pop();
    if(st.sel!=null){st.say=cellOf(id)>=0?tr('Tryck på en annan ruta för att flytta den, eller på Väntar för att ta bort den.','Tap another square to move it, or Waiting to take it out.'):st.tapSay;st.mood='';}
    st.render();
  };
  st.onDrop=(id,zone)=>{
    if(st.done)return;
    st.sel=null;const from=cellOf(id);
    if(zone.startsWith('plot-')){
      const to=+zone.slice(5);if(from===to||st.cells[to].rock!=null){st.render();return;}
      const other=st.cells[to].id;st.cells[to].id=id;
      if(from>=0)st.cells[from].id=other;
      st.res=null;SFX.pop();
    }else if(zone==='tray'&&from>=0){st.cells[from].id=null;st.res=null;SFX.pop();}
    const left=st.cells.filter(x=>x.rock==null&&x.id==null).length;
    st.say=left?tr(`Fortsätt! ${SQUARES(left)} kvar att fylla.`,`Keep going! ${SQUARES(left)} left to fill.`):tr('Alla rutor är fyllda. Stämmer summorna? Tryck på Plantera!','All squares are filled. Are the sums right? Tap Plant!');st.mood='';
    st.render();
  };
  st.acts.clear=()=>{st.cells.forEach(x=>{if(x.rock==null)x.id=null;});st.res=null;st.sel=null;st.render();};
  st.acts.plant=()=>{
    if(st.done)return;
    const empty=st.cells.filter(x=>x.rock==null&&x.id==null).length;
    if(empty){st.say=tr(`Fyll alla rutor först. ${SQUARES(empty)} är fortfarande ${empty===1?'tom':'tomma'}.`,`Fill all the squares first. ${SQUARES(empty)} ${empty===1?'is':'are'} still empty.`);st.mood='bad';SFX.bad();st.render();return;}
    const wrong=lines().filter(l=>sum(l.cells.map(val))!==l.t).length;
    if(wrong){st.res=true;st.strike(tr(`${wrong===1?'En summa':wrong+' summor'} stämmer inte. Kolla de röda rutorna vid kanten.`,`${wrong===1?'One sum is':wrong+' sums are'} not right. Check the red boxes at the edge.`));st.render();return;}
    const movers=st.cells.filter(x=>x.id!=null).map(x=>byId(x.id));
    st.waiting=st.waiting.filter(cr=>!movers.includes(cr));st.across.push(...movers);st.fx={pop:movers.map(cr=>cr.id)};
    SFX.ok();st.say=`${pick(PRAISE)} ${tr(`Alla summor stämmer och ${NUMLINGS(movers.length)} växer sig starka.`,`All the sums are right and ${NUMLINGS(movers.length)} grow strong.`)}`;st.mood='good';
    if(!st.waiting.length){st.say=tr('Hela truppen är klar i Trädgårdslandet!','The whole troupe is done in the Garden Patch!');st.win();}
    else st.newTrip();
    st.render();
  };
  return st;
}

// =========================================================
//  Bärbusken — dela lika
// =========================================================
function bushSVG(N,hide){
  const cols=Math.min(10,Math.max(1,N)),rows=Math.ceil(N/10);
  const gap=cols>5?10:0,sx=170-((cols-1)*26+gap)/2,sy=118-(rows-1)*13;
  let berries='';
  if(!hide)for(let i=0;i<N;i++){const x=sx+(i%10)*26+(i%10>=5?gap:0),y=sy+Math.floor(i/10)*26;berries+=`<circle cx="${x}" cy="${y}" r="10" fill="#c93a3a" stroke="#17335b" stroke-width="2.2"/><circle cx="${x-3}" cy="${y-3.5}" r="2.6" fill="#fff" opacity=".7"/>`;}
  return `<svg viewBox="0 0 340 250" aria-hidden="true"><rect x="158" y="196" width="24" height="44" rx="4" fill="#8a5a2b" stroke="#17335b" stroke-width="4"/><g fill="#4e9a73" stroke="#17335b" stroke-width="5"><circle cx="86" cy="128" r="68"/><circle cx="170" cy="92" r="82"/><circle cx="254" cy="128" r="68"/><circle cx="122" cy="168" r="56"/><circle cx="218" cy="168" r="56"/></g><g fill="#4e9a73"><circle cx="86" cy="128" r="64"/><circle cx="170" cy="92" r="78"/><circle cx="254" cy="128" r="64"/><circle cx="122" cy="168" r="52"/><circle cx="218" cy="168" r="52"/><rect x="90" y="100" width="160" height="90"/></g>${berries}${hide?'<text x="170" y="138" text-anchor="middle" font-size="84" font-weight="900" fill="#fff" stroke="#17335b" stroke-width="4" paint-order="stroke" style="font-family:var(--font)">?</text>':''}</svg>`;
}
function makeShare(troupe,L){
  const st=baseStation('share',troupe,L);
  st.setHearts(L>=3?5:4);
  st.newTrip=()=>{
    const w=st.waiting.length,rg={1:[2,3,2,5],2:[2,4,2,6],3:[3,5,3,9],4:[3,6,3,9]}[st.L];
    const g=Math.min(w,rnd(rg[0],rg[1])),q=rnd(rg[2],rg[3]);
    let r=0,rev=false;
    if(st.L>=2&&g>1){r=rnd(0,g-1);if(!r&&Math.random()<.7)r=rnd(1,g-1);}
    if(st.L>=4&&g>1&&Math.random()<.5){rev=true;if(!r)r=rnd(1,g-1);}
    st.p={g,q,r,N:g*q+r,rev};
    st.boxes=rev?['total']:(st.L>=2&&g>1)?['each','left']:['each'];
    st.vals={};st.active=st.boxes[0];
    st.group=st.waiting.slice(0,g);
  };
  st.newTrip();
  st.say=tr('Hjälp numlingarna att dela bären lika!','Help the numlings share the berries equally!');
  const LAB=tr({each:'Var och en får',left:'Över blir',total:'Bär i busken'},{each:'Each one gets',left:'Left over',total:'Berries in the bush'});
  const question=()=>{const {g,q,r,N,rev}=st.p;
    if(LANG==='en'){
      if(rev)return `${g} numlings shared the berries equally. Each one got ${q}, and ${r} were left over. How many berries were there in the bush?`;
      if(st.boxes.length===2)return `${N} berries are to be shared equally between ${g} numlings. How many does each one get, and how many are left over?`;
      return `${N} berries are to be shared equally between ${NUMLINGS(g)}. How many berries does each one get?`;
    }
    if(rev)return `${g} numlingar delade lika på bären. Var och en fick ${q}, och ${r} blev över. Hur många bär fanns det i busken?`;
    if(st.boxes.length===2)return `${N} bär ska delas lika mellan ${g} numlingar. Hur många får var och en, och hur många blir över?`;
    return `${N} bär ska delas lika mellan ${pl(g,'numling','numlingar')}. Hur många bär får var och en?`;};
  st.html=()=>{
    const keys=[1,2,3,4,5,6,7,8,9,'⌫',0,'✓'];
    const gids=new Set(st.group.map(c=>c.id));
    return `<div class="bushscene">
      <div><div class="tray-label">${tr('Väntar','Waiting')}</div><div class="tray">${st.waiting.filter(c=>!gids.has(c.id)).map(c=>crHTML(c,{sm:1})).join('')||`<span class="hint">${tr('Alla är vid busken.','Everyone is at the bush.')}</span>`}</div></div>
      <div class="bush">${bushSVG(st.p.N,st.p.rev)}<div class="group" aria-label="${tr('Numlingarna som delar','The numlings who share')}">${st.group.map(c=>crHTML(c,{sm:1,cls:'bob'})).join('')}</div></div>
      <div><div class="tray-label">${tr('Mätta och glada','Full and happy')}</div><div class="tray">${st.across.map(c=>crHTML(c,{sm:1,cls:st.fx.pop&&st.fx.pop.includes(c.id)?'pop':''})).join('')}</div></div>
    </div>
    <div class="padrow">
      <div class="qcol"><p class="question panel">${question()}</p>
      <div class="answers">${st.boxes.map(b=>`<button class="ans ${st.active===b?'on':''} ${st.fx.wob?'shake':''}" data-act="box" data-v="${b}" aria-pressed="${st.active===b}"><small>${LAB[b]}</small><b>${st.vals[b]??''}</b></button>`).join('')}</div></div>
      ${st.done?'':`<div class="numpad" role="group" aria-label="${tr('Sifferknappar','Number keys')}">${keys.map(k=>`<button class="key ${k==='✓'?'ok':''}" data-act="key" data-v="${k}" aria-label="${k==='⌫'?tr('Radera','Delete'):k==='✓'?tr('Kontrollera svaret','Check the answer'):k}">${k}</button>`).join('')}</div>`}
    </div>`;
  };
  st.press=k=>{
    if(st.done)return;
    const b=st.active,cur=st.vals[b]??'';
    if(k==='⌫'){st.vals[b]=cur.slice(0,-1);if(!st.vals[b])delete st.vals[b];SFX.key();st.render();return;}
    if(k==='✓'){
      const missing=st.boxes.find(x=>st.vals[x]==null);
      if(missing){st.active=missing;st.render();return;}
      st.check();return;
    }
    if(cur.length<3){st.vals[b]=(cur==='0'?'':cur)+k;SFX.key();st.render();}
  };
  st.check=()=>{
    const {g,q,r,N,rev}=st.p;
    let ok,msg='';
    if(rev){
      const x=+st.vals.total;ok=x===N;
      if(!ok)msg=tr(`Tänk: ${g} numlingar fick ${q} var, det blir ${g} · ${q}. Glöm inte de ${r} som blev över.`,`Think: ${g} numlings got ${q} each, that makes ${g} · ${q}. Don't forget the ${r} left over.`);
    }else{
      const a=+st.vals.each,b=st.boxes.includes('left')?+st.vals.left:0;
      ok=a===q&&b===r;
      if(!ok){
        if(g*a>N)msg=tr(`För många! ${g} · ${a} = ${g*a}, men busken har bara ${N} bär.`,`Too many! ${g} · ${a} = ${g*a}, but the bush only has ${N} berries.`);
        else if(st.boxes.includes('left')&&b>=g)msg=tr(`Om ${b} blir över kan alla få ett bär till!`,`If ${b} are left over, everyone can get one more berry!`);
        else if(g*a+b!==N)msg=st.boxes.includes('left')?tr(`${g} · ${a} + ${b} = ${g*a+b}, men busken har ${N} bär.`,`${g} · ${a} + ${b} = ${g*a+b}, but the bush has ${N} berries.`):tr(`${g} · ${a} = ${g*a}. Det finns bär kvar att dela ut!`,`${g} · ${a} = ${g*a}. There are berries left to hand out!`);
        else msg=tr('Det stämmer inte. Prova igen!','That is not right. Try again!');
      }
    }
    if(ok){
      const movers=st.group.slice();
      st.waiting=st.waiting.filter(c=>!movers.includes(c));st.across.push(...movers);st.fx={pop:movers.map(c=>c.id)};
      SFX.ok();st.say=`${pick(PRAISE)} ${tr(`${N} delat med ${g} blir ${q}${r?`, och ${r} blir över`:''}. Mums!`,`${N} divided by ${g} is ${q}${r?`, and ${r} are left over`:''}. Yum!`)}`;st.mood='good';
      if(!st.waiting.length){st.say=tr('Alla har ätit sig mätta vid Bärbusken!','Everyone has eaten their fill at the Berry Bush!');st.win();}
      else st.newTrip();
    }else{
      st.vals={};st.active=st.boxes[0];st.fx={wob:1};
      st.strike(msg);
    }
    st.render();
  };
  st.acts.key=b=>{const v=b.dataset.v;st.press(/^[0-9]$/.test(v)?+v:v);};
  st.acts.box=b=>{st.active=b.dataset.v;SFX.pop();st.render();};
  st.onKey=k=>{if(/^[0-9]$/.test(k)){st.press(+k);return true;}if(k==='Backspace'){st.press('⌫');return true;}if(k==='Enter'){st.press('✓');return true;}return false;};
  return st;
}

// =========================================================
//  Bergsstigen — räkneväg till toppen
// =========================================================
const FLAG=`<svg viewBox="0 0 30 30" aria-hidden="true"><path d="M6 28V3" stroke="#17335b" stroke-width="3" stroke-linecap="round"/><path d="M7 4h17l-4 5 4 5H7z" fill="#ff6b6b" stroke="#17335b" stroke-width="2.4" stroke-linejoin="round"/></svg>`;
const MOUNTAIN_BG=`<svg class="mbg" viewBox="0 0 400 300" preserveAspectRatio="none" aria-hidden="true"><path d="M-10 300 L70 120 L120 170 L200 30 L270 140 L320 90 L410 300Z" fill="#a3aebb" stroke="#17335b" stroke-width="2" vector-effect="non-scaling-stroke"/><path d="M200 30 L222 70 L208 64 L196 76 L186 62 L176 72Z" fill="#fff"/><path d="M-10 300 L60 210 L140 250 L230 190 L330 240 L410 200 L410 300Z" fill="#8f9aa8"/></svg>`;
function makePathStation(troupe,L){
  const st=baseStation('path',troupe,L);
  st.setHearts(L>=3?5:4);
  st.per=Math.max(2,Math.ceil(troupe.length/4));
  st.next=()=>{
    const lead=st.waiting[0];
    const start=st.L===1?Math.min(lead.n,20):lead.n;
    st.pz=makePath(st.L,start);st.choice=st.pz.rows.map(()=>null);st.solved=false;st.trail=null;
  };
  st.next();
  st.say=tr('Välj en sten på varje rad, nerifrån och upp, så att du når toppen med exakt rätt tal.','Pick a stone on every row, from the bottom up, so you reach the top with exactly the right number.');
  const runVals=()=>{const v=[st.pz.start];for(let r=0;r<st.pz.rows.length;r++){const ci=st.choice[r];if(ci==null)break;v.push(st.pz.rows[r][ci].f(v[v.length-1]));}return v;};
  st.html=()=>{
    const R=st.pz.rows.length,rv=runVals(),showRun=st.L===1||st.solved;
    let rows='';
    for(let r=R-1;r>=0;r--){
      const v=rv[r+1];
      rows+=`<div class="prow2"><span class="runv l"></span>${st.pz.rows[r].map((o,i)=>`<button class="opst ${st.choice[r]===i?'on':''}" data-act="op" data-v="${r}-${i}" aria-pressed="${st.choice[r]===i}" ${st.done||st.solved?'disabled':''}>${o.t}</button>`).join('')}<span class="runv">${showRun&&v!=null&&!Number.isNaN(v)?'= '+v:''}</span></div>`;
    }
    const lead=st.waiting[0];
    return `<div class="sidewrap"><div class="sidemain"><div class="mountain">${MOUNTAIN_BG}
      <div class="peak">${FLAG}<span>${tr('Toppen','Top')}: ${st.pz.target}</span></div>
      ${rows}
      <div class="base">${lead?crHTML(lead):''}<span>Start: ${st.pz.start}</span></div>
      ${st.trail?`<div class="trail">${tr('Din stig','Your path')}: ${st.trail}</div>`:''}
    </div>
    <div class="actions">${st.solved?(st.waiting.length?`<button class="btn go big" data-act="next">${tr('Nästa stig','Next path')}</button>`:''):`<button class="btn go big" data-act="climb" ${st.choice.some(x=>x==null)||st.done?'disabled':''}>${tr('Klättra!','Climb!')}</button>`}</div>
    ${!st.solved&&st.choice.some(x=>x==null)?`<p class="hint" style="text-align:center">${tr('Välj en sten på varje rad.','Pick a stone on every row.')}</p>`:''}
    </div>
    <div class="sidecol">
      <div><div class="tray-label">${tr('Väntar vid foten','Waiting at the foot')}</div><div class="tray">${st.waiting.map(c=>crHTML(c,{sm:1})).join('')||`<span class="hint">${tr('Alla är uppe.','Everyone is up.')}</span>`}</div></div>
      <div><div class="tray-label">${tr('Uppe på toppen','Up at the top')}</div><div class="tray">${st.across.map(c=>crHTML(c,{sm:1,cls:st.fx.pop&&st.fx.pop.includes(c.id)?'pop':''})).join('')}</div></div>
    </div></div>`;
  };
  st.acts.op=b=>{if(st.done||st.solved)return;const [r,i]=b.dataset.v.split('-').map(Number);st.choice[r]=st.choice[r]===i?null:i;st.trail=null;SFX.pop();st.render();};
  st.acts.climb=()=>{
    if(st.done||st.solved||st.choice.some(x=>x==null))return;
    const vals=[st.pz.start];let bad=null;
    for(let r=0;r<st.pz.rows.length;r++){
      const o=st.pz.rows[r][st.choice[r]],prev=vals[vals.length-1],nv=o.f(prev);
      if(Number.isNaN(nv)){bad=tr(`${prev} kan inte delas jämnt med ${o.t.replace('/ ','')}.`,`${prev} cannot be divided evenly by ${o.t.replace('/ ','')}.`);break;}
      if(nv<0){bad=tr(`${prev} ${o.t} blir mindre än noll. Så långt ner går inte stigen!`,`${prev} ${o.t} is less than zero. The path does not go that far down!`);break;}
      vals.push(nv);
    }
    st.trail=vals.join(' → ');
    if(bad){st.strike(bad);st.render();return;}
    const end=vals[vals.length-1];
    if(end===st.pz.target){
      st.solved=true;
      const movers=st.waiting.slice(0,st.per);
      st.waiting=st.waiting.slice(movers.length);st.across.push(...movers);st.fx={pop:movers.map(c=>c.id)};
      SFX.ok();st.say=`${pick(PRAISE)} ${tr(`Exakt ${end}! ${NUMLINGS(movers.length)} klättrar upp till toppen.`,`Exactly ${end}! ${NUMLINGS(movers.length)} climb up to the top.`)}`;st.mood='good';
      if(!st.waiting.length){st.say=tr('Alla har klättrat upp på Bergsstigen!','Everyone has climbed up the Mountain Path!');st.win();}
    }else st.strike(tr(`Stigen slutade på ${end}, men toppen är ${st.pz.target}.`,`The path ended at ${end}, but the top is ${st.pz.target}.`));
    st.render();
  };
  st.acts.next=()=>{st.next();st.say=tr('En ny stig! Vilka stenar leder till toppen?','A new path! Which stones lead to the top?');st.mood='';st.render();};
  return st;
}

const FACTORY={gates:makeGates,balloon:makeBalloon,stones:makeStones,venn:makeVenn,raft:makeRaft,lock:makeLock,machine:makeMachine,garden:makeGarden,share:makeShare,path:makePathStation};
function startStation(i,L){
  const key=S.journey.route[i];
  const lv=Math.max(1,Math.min(S.levels[key],L||S.levels[key]));
  const troupe=S.journey.troupe.map(c=>({...c}));
  document.querySelectorAll('.confetti').forEach(n=>n.remove());
  CUR=FACTORY[key](troupe,lv);CUR.render(true);
}
// Varje resa går genom 6 av de 10 banorna. Banor man spelat minst väljs först.
function pickRoute(){
  const ranked=ALL.map(k=>({k,c:(S.played[k]||0)+Math.random()*.9})).sort((a,b)=>a.c-b.c).map(o=>o.k);
  let route=shuffle(ranked.slice(0,ROUTE_LEN));
  if(route.includes('lock'))route=route.filter(k=>k!=='lock').concat('lock');
  return route;
}

function smoothPath(p){
  let d=`M${p[0][0]} ${p[0][1]}`;
  for(let i=0;i<p.length-1;i++){
    const p0=p[i-1]||p[i],p1=p[i],p2=p[i+1],p3=p[i+2]||p2;
    d+=` C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)} ${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)} ${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0]} ${p2[1]}`;
  }
  return d;
}

    <div class="row"><button class="btn sm" data-act="back">${tr('Tillbaka','Back')}</button><h2>${tr('Inställningar','Settings')}</h2></div>
    <div class="row"><b>${tr('Ljud','Sound')}</b><button class="btn sm" data-act="snd">${S.sound?tr('På','On'):tr('Av','Off')}</button></div>
    <div><h3>${tr('Föreslagen nivå för varje bana','Suggested level for each stop')}</h3><p class="hint">${tr('En bana föreslås på en högre nivå när hela truppen klarar den. Före varje bana kan man alltid välja en lättare nivå.','A stop is suggested at a higher level when the whole troupe clears it. Before every stop you can always pick an easier level.')}</p>
    ${ALL.map(k=>`<div class="lvlrow"><span class="nm">${ICONS[k]}${META[k].name}</span>${[1,2,3,4].map(l=>`<button class="lvbtn ${S.levels[k]===l?'on':''}" data-act="lv" data-k="${k}" data-v="${l}" aria-pressed="${S.levels[k]===l}" aria-label="${META[k].name} ${tr('nivå','level')} ${l}">${'★'.repeat(l)}</button>`).join('')}</div>`).join('')}
    <div class="row" style="margin-top:10px"><span class="hint">${tr('Sätt alla till:','Set all to:')}</span>${[1,2,3,4].map(l=>`<button class="lvbtn" data-act="all" data-v="${l}" aria-label="${tr('Alla banor nivå','All stops level')} ${l}">${'★'.repeat(l)}</button>`).join('')}</div></div>
    <div><h3>${tr('För vuxna','For grown-ups')}</h3><p class="hint">${tr('Vad varje bana tränar:','What each stop practises:')}</p><ul class="skills">${ALL.map(k=>`<li><b>${META[k].name}:</b> ${META[k].skill}</li>`).join('')}</ul>
    <p class="hint" style="margin-top:8px">${tr('Framstegen sparas på den här enheten. Troféen på spelets kort i Stalman games visar hur många numlingar som bor i Numeria. Varje resa går genom 6 av de 10 banorna, och banor som spelats minst väljs först. Hjärtan begränsar gissande: när de tar slut går de numlingar som väntar tillbaka till lägret och följer med på nästa resa, så ingen försvinner för alltid.','Progress is saved on this device. The trophy on the game\'s card in Stalman games shows how many numlings live in Numeria. Every journey goes through 6 of the 10 stops, and the stops played least are picked first. Hearts limit guessing: when they run out, the numlings still waiting go back to camp and come along on the next journey, so nobody is lost for ever.')}</p></div>
    <div class="row"><button class="btn sm" data-act="reset">${tr('Radera alla framsteg','Erase all progress')}</button></div>
  </main>`,{
    back:showTitle,
    snd:()=>{S.sound=!S.sound;save();showSettings();},
    lv:b=>{S.levels[b.dataset.k]=+b.dataset.v;S.chosen=true;save();showSettings();},
    all:b=>{ALL.forEach(k=>S.levels[k]=+b.dataset.v);S.startLevel=+b.dataset.v;S.chosen=true;save();showSettings();},
    reset:()=>modal(tr(`<h3>Radera allt?</h3><p>Det här tar bort Numeria, lägret, nivåerna och den pågående resan.</p><div class="row"><button class="btn go" data-m="close">Behåll mina framsteg</button><button class="btn" data-m="yes">Radera</button></div>`,
      `<h3>Erase everything?</h3><p>This removes Numeria, the camp, the levels and the journey in progress.</p><div class="row"><button class="btn go" data-m="close">Keep my progress</button><button class="btn" data-m="yes">Erase</button></div>`),{yes:()=>{S=freshState();B=null;PICK=null;save();try{localStorage.removeItem(SCORE_KEY);}catch(e){}showTitle();}})
  });
}

showTitle();

// fungerar utan internet via hubbens service worker
if('serviceWorker' in navigator){navigator.serviceWorker.register('../sw.js').catch(function(){});}
</script>
<script src="../shared/guard.js" data-game="numlings"></script>
</body>
</html>
