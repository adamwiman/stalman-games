const MACHINE_SVG=`<svg viewBox="0 0 300 190" aria-hidden="true"><path d="M14 18h64l-16 32H30z" fill="#ffc63f" stroke="#17335b" stroke-width="4" stroke-linejoin="round"/><rect x="36" y="48" width="20" height="26" fill="#c9d4e3" stroke="#17335b" stroke-width="4"/><rect x="196" y="26" width="24" height="40" fill="#c9d4e3" stroke="#17335b" stroke-width="4"/><g fill="#fff" opacity=".8"><circle cx="214" cy="16" r="8"/><circle cx="226" cy="6" r="5"/></g><rect x="22" y="64" width="246" height="112" rx="20" fill="#9fb3cf" stroke="#17335b" stroke-width="5"/><circle cx="92" cy="120" r="30" fill="none" stroke="#ffc63f" stroke-width="13" stroke-dasharray="10 7"/><circle cx="92" cy="120" r="21" fill="#ffc63f" stroke="#17335b" stroke-width="4"/><circle cx="92" cy="120" r="7" fill="#17335b"/><circle cx="148" cy="140" r="19" fill="none" stroke="#38d9a9" stroke-width="10" stroke-dasharray="8 6"/><circle cx="148" cy="140" r="12" fill="#38d9a9" stroke="#17335b" stroke-width="4"/><circle cx="148" cy="140" r="4" fill="#17335b"/><circle cx="236" cy="92" r="7" fill="#38d9a9" stroke="#17335b" stroke-width="3"/><circle cx="236" cy="114" r="7" fill="#ff6b6b" stroke="#17335b" stroke-width="3"/><rect x="196" y="132" width="56" height="12" rx="6" fill="#17335b"/><path d="M268 136h22v40h-14" fill="none" stroke="#17335b" stroke-width="5" stroke-linejoin="round"/></svg>`;
function makeMachine(troupe,L){
  const st=baseStation('machine',troupe,L);
  st.setHearts(L>=3?6:5);
  const nums=troupe.map(c=>c.n);st.mn=Math.min(...nums);st.mx=Math.max(...nums);
  st.rule=machineRule(L,nums);
  st.table=[];st.input='';st.typed=0;
  const ex=Math.min(L<=2?2:3,Math.max(0,troupe.length-1));
  for(let i=0;i<ex;i++){const c=st.waiting.shift();st.table.push({c,in:c.n,out:st.rule.f(c.n)});st.across.push(c);}
  st.say=ex?`Maskinen visar hur den fungerar med de ${ex} första numlingarna. Vad kommer ut för nästa?`:'Vad kommer ut ur maskinen?';
  st.html=()=>{
    const cur=st.waiting[0];
    const keys=[1,2,3,4,5,6,7,8,9,'⌫',0,'✓'];
    return `<div class="factory">
      <div><div class="tray-label">Väntar</div><div class="tray">${st.waiting.map((c,i)=>crHTML(c,{sm:1,cls:i===0?'bob':''})).join('')||'<span class="hint">Alla har gått igenom.</span>'}</div></div>
      <div class="mach">${MACHINE_SVG}
        ${cur?`<div class="mdisp ${st.fx.wob?'shake':''}" aria-live="polite"><span>${cur.n}</span><span class="arrow">→</span><span class="out">${st.input||'?'}</span></div>`:''}
      </div>
      <div><div class="tray-label">Har gått igenom</div><div class="tray">${st.across.map(c=>crHTML(c,{sm:1,cls:st.fx.pop===c.id?'pop':''})).join('')}</div></div>
    </div>
    <div class="padrow">
      ${cur&&!st.done?`<div class="numpad" role="group" aria-label="Sifferknappar">${keys.map(k=>`<button class="key ${k==='✓'?'ok':''}" data-act="key" data-v="${k}" aria-label="${k==='⌫'?'Radera':k==='✓'?'Kontrollera svaret':k}">${k}</button>`).join('')}</div>`:''}
      <div class="side">
        <div class="ftable" role="table" aria-label="Det maskinen har gjort"><span class="h">In</span><span></span><span class="h">Ut</span>${st.table.map(r=>`<span>${r.in}</span><span class="ar">→</span><span>${r.out}</span>`).join('')}</div>
        ${cur&&!st.done?`<button class="btn go" data-act="guess" ${st.typed<1||st.waiting.length<2?'disabled':''}>Jag vet regeln!</button>${st.typed<1?'<p class="hint">Räkna rätt på en numling först, sedan kan du gissa regeln.</p>':''}`:''}
      </div>

  };
  st.check=()=>{
    if(!st.input)return;
    const c=st.waiting[0],v=+st.input,want=st.rule.f(c.n);
    st.input='';
    if(v===want){
      st.waiting.shift();st.table.push({c,in:c.n,out:want});st.across.push(c);st.typed++;
      SFX.ok();st.fx={pop:c.id};st.say=`${pick(PRAISE)} ${c.n} blir ${want}.`;st.mood='good';
      if(!st.waiting.length){st.say='Alla har gått genom Talmaskinen!';st.win();}
    }else{
      st.fx={wob:1};
      st.strike(`${v} stämmer inte. Titta i tabellen: vad händer med talen i maskinen?`);
    }
    st.render();
  };
  st.acts.key=b=>{const v=b.dataset.v;st.press(/^[0-9]$/.test(v)?+v:v);};
  st.acts.guess=()=>{
    const opts=machineOptions(st.rule,st.table.map(r=>r.in),st.L,st.mn,st.mx);
    const h={};opts.forEach((r,i)=>h['o'+i]=()=>{
      if(st.done)return;
      if(r===st.rule){
        st.waiting.forEach(c=>{st.table.push({c,in:c.n,out:st.rule.f(c.n)});st.across.push(c);});
        st.waiting=[];st.cracked=true;SFX.ok();st.say='Du knäckte maskinen! Alla som var kvar går igenom.';st.mood='good';st.render();st.win();
      }else{st.strike('Inte den regeln. Kolla den mot talen i tabellen.');st.render();}
    });
    modal(`<h3>Vad gör Talmaskinen?</h3><p>Kolla varje rad i tabellen. Bara en regel passar alla.</p><div class="opts">${opts.map((r,i)=>`<button class="btn" data-m="o${i}">${cap(r.txt)}</button>`).join('')}</div><button class="btn sm" data-m="close">Inte än</button>`,h);
  };
  st.onKey=k=>{if(/^[0-9]$/.test(k)){st.press(+k);return true;}if(k==='Backspace'){st.press('⌫');return true;}if(k==='Enter'){st.press('✓');return true;}return false;};
  st.reveal=()=>`<p><b>Maskinens regel:</b> ${cap(st.rule.txt)}</p><p>${st.rule.expl}</p>${st.cracked?'<p><b>Du listade ut regeln. Snyggt!</b></p>':''}`;
  return st;
}

// =========================================================
//  Trädgårdslandet — rader och kolumner med rätt summa
// =========================================================
function gardenSpec(L){return L===1?{r:2,c:2,stones:0,diag:false}:L===2?{r:2,c:3,stones:0,diag:false}:L===3?{r:3,c:3,stones:3,diag:false}:{r:3,c:3,stones:2,diag:true};}
function makeGarden(troupe,L){
  const st=baseStation('garden',troupe,L);
  st.setHearts(L>=3?5:4);
  st.newTrip=()=>{
    const sp=gardenSpec(st.L),cells=sp.r*sp.c;
    const use=Math.min(cells-sp.stones,st.waiting.length);
    const pos=shuffle(A(cells,i=>i)),rocks=new Set(pos.slice(0,cells-use));
    const chosen=shuffle(st.waiting).slice(0,use);
    let j=0;
    st.cells=A(cells,i=>rocks.has(i)?{rock:rnd(1,9)}:{id:null});
    const sol=A(cells,i=>rocks.has(i)?st.cells[i].rock:chosen[j++].n);
    st.spec=sp;st.res=null;
    st.rowT=A(sp.r,r=>sum(A(sp.c,c=>sol[r*sp.c+c])));
    st.colT=A(sp.c,c=>sum(A(sp.r,r=>sol[r*sp.c+c])));
    st.diagT=sp.diag?sum(A(sp.r,i=>sol[i*sp.c+i])):null;
  };
  st.newTrip();
  st.say='Sätt numlingarna i landet så att varje rad och kolumn får rätt summa. Talen på stenarna räknas också.';
  st.tapSay='Tryck nu på en ruta i landet.';
  const byId=id=>st.waiting.find(c=>c.id===id)||st.across.find(c=>c.id===id);
  const val=i=>{const x=st.cells[i];if(x.rock!=null)return x.rock;return x.id!=null?byId(x.id).n:0;};
  const filled=i=>st.cells[i].rock!=null||st.cells[i].id!=null;
  const cellOf=id=>st.cells.findIndex(x=>x.id===id);
  const lines=()=>{
    const {r,c}=st.spec,L=[];
    for(let y=0;y<r;y++)L.push({kind:'row',idx:y,cells:A(c,x=>y*c+x),t:st.rowT[y]});
    for(let x=0;x<c;x++)L.push({kind:'col',idx:x,cells:A(r,y=>y*c+x),t:st.colT[x]});
    if(st.spec.diag)L.push({kind:'diag',idx:0,cells:A(r,i=>i*c+i),t:st.diagT});
    return L;
  };
  const sumBox=(ln,label)=>{
    const now=sum(ln.cells.map(val)),full=ln.cells.every(filled);
    const cls=st.res?(now===ln.t?'ok':'wrong'):now>ln.t?'over':full&&now===ln.t?'ok':'';
    return `<div class="tsum ${cls}" aria-label="${label}: ska bli ${ln.t}, nu ${now}"><b>${label?label+' ':''}${ln.t}</b><small>nu ${now}</small></div>`;
  };
  st.html=()=>{
    const {r,c}=st.spec,ls=lines();
    let g='';
    for(let y=0;y<r;y++){
      for(let x=0;x<c;x++){
        const i=y*c+x,cell=st.cells[i];
        if(cell.rock!=null)g+=`<div class="rock" aria-label="Sten med talet ${cell.rock}">${cell.rock}</div>`;
        else{const cr=cell.id!=null?byId(cell.id):null;g+=`<div class="plot ${cr?'':'empty'}" data-drop="plot-${i}" tabindex="0" aria-label="Ruta ${i+1}${cr?': '+describe(cr):', tom'}">${cr?crHTML(cr,{dr:1,sel:st.sel===cr.id}):''}</div>`;}
      }
      g+=sumBox(ls.find(l=>l.kind==='row'&&l.idx===y),'');
    }
    for(let x=0;x<c;x++)g+=sumBox(ls.find(l=>l.kind==='col'&&l.idx===x),'');
    g+=st.spec.diag?sumBox(ls.find(l=>l.kind==='diag'),'↘'):'<div class="tsum ghost-cell"></div>';
    const loose=st.waiting.filter(cr=>cellOf(cr.id)<0);
    return `<div class="sidewrap"><div class="sidemain">
      <div class="garden"><div class="plots" style="--c:${c}">${g}</div></div>
      <div class="actions"><button class="btn go big" data-act="plant" ${st.done?'disabled':''}>Plantera!</button>${st.cells.some(x=>x.id!=null)?'<button class="btn" data-act="clear">Töm landet</button>':''}</div>
    </div>
    <div class="sidecol">
      <div><div class="tray-label">Väntar</div><div class="tray" data-drop="tray">${loose.map(cr=>crHTML(cr,{dr:1,sel:st.sel===cr.id})).join('')||'<span class="hint">Alla står i landet.</span>'}</div></div>
      <div><div class="tray-label">Klara</div><div class="tray">${st.across.map(cr=>crHTML(cr,{sm:1,cls:st.fx.pop&&st.fx.pop.includes(cr.id)?'pop':''})).join('')}</div></div>
    </div></div>`;
  };
  st.onTap=id=>{
    if(st.done)return;
    if(st.sel!=null&&st.sel!==id&&cellOf(id)>=0){st.onDrop(st.sel,'plot-'+cellOf(id));return;}
    st.sel=st.sel===id?null:id;SFX.pop();
    if(st.sel!=null){st.say=cellOf(id)>=0?'Tryck på en annan ruta för att flytta den, eller på Väntar för att ta bort den.':st.tapSay;st.mood='';}
    st.render();
  };
  st.onDrop=(id,zone)=>{
    if(st.done)return;
    st.sel=null;const from=cellOf(id);
    if(zone.startsWith('plot-')){
      const to=+zone.slice(5);if(from===to||st.cells[to].rock!=null){st.render();return;}
      const other=st.cells[to].id;st.cells[to].id=id;
      if(from>=0)st.cells[from].id=other;
      st.res=null;SFX.pop();
    }else if(zone==='tray'&&from>=0){st.cells[from].id=null;st.res=null;SFX.pop();}
    const left=st.cells.filter(x=>x.rock==null&&x.id==null).length;
    st.say=left?`Fortsätt! ${pl(left,'ruta','rutor')} kvar att fylla.`:'Alla rutor är fyllda. Stämmer summorna? Tryck på Plantera!';st.mood='';
    st.render();
  };
  st.acts.clear=()=>{st.cells.forEach(x=>{if(x.rock==null)x.id=null;});st.res=null;st.sel=null;st.render();};
  st.acts.plant=()=>{
    if(st.done)return;
    const empty=st.cells.filter(x=>x.rock==null&&x.id==null).length;
    if(empty){st.say=`Fyll alla rutor först. ${pl(empty,'ruta','rutor')} är fortfarande ${empty===1?'tom':'tomma'}.`;st.mood='bad';SFX.bad();st.render();return;}
    const wrong=lines().filter(l=>sum(l.cells.map(val))!==l.t).length;
    if(wrong){st.res=true;st.strike(`${wrong===1?'En summa':wrong+' summor'} stämmer inte. Kolla de röda rutorna vid kanten.`);st.render();return;}
    const movers=st.cells.filter(x=>x.id!=null).map(x=>byId(x.id));
    st.waiting=st.waiting.filter(cr=>!movers.includes(cr));st.across.push(...movers);st.fx={pop:movers.map(cr=>cr.id)};
    SFX.ok();st.say=`${pick(PRAISE)} Alla summor stämmer och ${pl(movers.length,'numling','numlingar')} växer sig starka.`;st.mood='good';
    if(!st.waiting.length){st.say='Hela truppen är klar i Trädgårdslandet!';st.win();}
    else st.newTrip();
    st.render();
  };
  return st;
}

// =========================================================
//  Bärbusken — dela lika
// =========================================================
function bushSVG(N,hide){
  const cols=Math.min(10,Math.max(1,N)),rows=Math.ceil(N/10);
  const gap=cols>5?10:0,sx=170-((cols-1)*26+gap)/2,sy=118-(rows-1)*13;
  let berries='';
  if(!hide)for(let i=0;i<N;i++){const x=sx+(i%10)*26+(i%10>=5?gap:0),y=sy+Math.floor(i/10)*26;berries+=`<circle cx="${x}" cy="${y}" r="10" fill="#c93a3a" stroke="#17335b" stroke-width="2.2"/><circle cx="${x-3}" cy="${y-3.5}" r="2.6" fill="#fff" opacity=".7"/>`;}
  return `<svg viewBox="0 0 340 250" aria-hidden="true"><rect x="158" y="196" width="24" height="44" rx="4" fill="#8a5a2b" stroke="#17335b" stroke-width="4"/><g fill="#4e9a73" stroke="#17335b" stroke-width="5"><circle cx="86" cy="128" r="68"/><circle cx="170" cy="92" r="82"/><circle cx="254" cy="128" r="68"/><circle cx="122" cy="168" r="56"/><circle cx="218" cy="168" r="56"/></g><g fill="#4e9a73"><circle cx="86" cy="128" r="64"/><circle cx="170" cy="92" r="78"/><circle cx="254" cy="128" r="64"/><circle cx="122" cy="168" r="52"/><circle cx="218" cy="168" r="52"/><rect x="90" y="100" width="160" height="90"/></g>${berries}${hide?'<text x="170" y="138" text-anchor="middle" font-size="84" font-weight="900" fill="#fff" stroke="#17335b" stroke-width="4" paint-order="stroke" style="font-family:var(--font)">?</text>':''}</svg>`;
}
function makeShare(troupe,L){
  const st=baseStation('share',troupe,L);
  st.setHearts(L>=3?5:4);
  st.newTrip=()=>{
    const w=st.waiting.length,rg={1:[2,3,2,5],2:[2,4,2,6],3:[3,5,3,9],4:[3,6,3,9]}[st.L];
    const g=Math.min(w,rnd(rg[0],rg[1])),q=rnd(rg[2],rg[3]);
    let r=0,rev=false;
    if(st.L>=2&&g>1){r=rnd(0,g-1);if(!r&&Math.random()<.7)r=rnd(1,g-1);}
    if(st.L>=4&&g>1&&Math.random()<.5){rev=true;if(!r)r=rnd(1,g-1);}
    st.p={g,q,r,N:g*q+r,rev};
    st.boxes=rev?['total']:(st.L>=2&&g>1)?['each','left']:['each'];
    st.vals={};st.active=st.boxes[0];
    st.group=st.waiting.slice(0,g);
  };
  st.newTrip();
  st.say='Hjälp numlingarna att dela bären lika!';
  const LAB={each:'Var och en får',left:'Över blir',total:'Bär i busken'};
  const question=()=>{const {g,q,r,N,rev}=st.p;
    if(rev)return `${g} numlingar delade lika på bären. Var och en fick ${q}, och ${r} blev över. Hur många bär fanns det i busken?`;
    if(st.boxes.length===2)return `${N} bär ska delas lika mellan ${g} numlingar. Hur många får var och en, och hur många blir över?`;
    return `${N} bär ska delas lika mellan ${pl(g,'numling','numlingar')}. Hur många bär får var och en?`;};
  st.html=()=>{
    const keys=[1,2,3,4,5,6,7,8,9,'⌫',0,'✓'];
    const gids=new Set(st.group.map(c=>c.id));
    return `<div class="bushscene">
      <div><div class="tray-label">Väntar</div><div class="tray">${st.waiting.filter(c=>!gids.has(c.id)).map(c=>crHTML(c,{sm:1})).join('')||'<span class="hint">Alla är vid busken.</span>'}</div></div>
      <div class="bush">${bushSVG(st.p.N,st.p.rev)}<div class="group" aria-label="Numlingarna som delar">${st.group.map(c=>crHTML(c,{sm:1,cls:'bob'})).join('')}</div></div>
      <div><div class="tray-label">Mätta och glada</div><div class="tray">${st.across.map(c=>crHTML(c,{sm:1,cls:st.fx.pop&&st.fx.pop.includes(c.id)?'pop':''})).join('')}</div></div>
    </div>
    <div class="padrow">
      <div class="qcol"><p class="question panel">${question()}</p>
      <div class="answers">${st.boxes.map(b=>`<button class="ans ${st.active===b?'on':''} ${st.fx.wob?'shake':''}" data-act="box" data-v="${b}" aria-pressed="${st.active===b}"><small>${LAB[b]}</small><b>${st.vals[b]??''}</b></button>`).join('')}</div></div>
      ${st.done?'':`<div class="numpad" role="group" aria-label="Sifferknappar">${keys.map(k=>`<button class="key ${k==='✓'?'ok':''}" data-act="key" data-v="${k}" aria-label="${k==='⌫'?'Radera':k==='✓'?'Kontrollera svaret':k}">${k}</button>`).join('')}</div>`}
    </div>`;
  };
  st.press=k=>{
    if(st.done)return;
    const b=st.active,cur=st.vals[b]??'';
    if(k==='⌫'){st.vals[b]=cur.slice(0,-1);if(!st.vals[b])delete st.vals[b];SFX.key();st.render();return;}
    if(k==='✓'){
      const missing=st.boxes.find(x=>st.vals[x]==null);
      if(missing){st.active=missing;st.render();return;}
      st.check();return;
    }
    if(cur.length<3){st.vals[b]=(cur==='0'?'':cur)+k;SFX.key();st.render();}
  };
  st.check=()=>{
    const {g,q,r,N,rev}=st.p;
    let ok,msg='';
    if(rev){
      const x=+st.vals.total;ok=x===N;
      if(!ok)msg=`Tänk: ${g} numlingar fick ${q} var, det blir ${g} · ${q}. Glöm inte de ${r} som blev över.`;
    }else{
      const a=+st.vals.each,b=st.boxes.includes('left')?+st.vals.left:0;
      ok=a===q&&b===r;
      if(!ok){
        if(g*a>N)msg=`För många! ${g} · ${a} = ${g*a}, men busken har bara ${N} bär.`;
        else if(st.boxes.includes('left')&&b>=g)msg=`Om ${b} blir över kan alla få ett bär till!`;
        else if(g*a+b!==N)msg=st.boxes.includes('left')?`${g} · ${a} + ${b} = ${g*a+b}, men busken har ${N} bär.`:`${g} · ${a} = ${g*a}. Det finns bär kvar att dela ut!`;
        else msg='Det stämmer inte. Prova igen!';
      }
    }
    if(ok){
      const movers=st.group.slice();
      st.waiting=st.waiting.filter(c=>!movers.includes(c));st.across.push(...movers);st.fx={pop:movers.map(c=>c.id)};
      SFX.ok();st.say=`${pick(PRAISE)} ${N} delat med ${g} blir ${q}${r?`, och ${r} blir över`:''}. Mums!`;st.mood='good';
      if(!st.waiting.length){st.say='Alla har ätit sig mätta vid Bärbusken!';st.win();}
      else st.newTrip();
    }else{
      st.vals={};st.active=st.boxes[0];st.fx={wob:1};
      st.strike(msg);
    }
    st.render();
  };
  st.acts.key=b=>{const v=b.dataset.v;st.press(/^[0-9]$/.test(v)?+v:v);};
  st.acts.box=b=>{st.active=b.dataset.v;SFX.pop();st.render();};
  st.onKey=k=>{if(/^[0-9]$/.test(k)){st.press(+k);return true;}if(k==='Backspace'){st.press('⌫');return true;}if(k==='Enter'){st.press('✓');return true;}return false;};
  return st;
}

// =========================================================
//  Bergsstigen — räkneväg till toppen
// =========================================================
const FLAG=`<svg viewBox="0 0 30 30" aria-hidden="true"><path d="M6 28V3" stroke="#17335b" stroke-width="3" stroke-linecap="round"/><path d="M7 4h17l-4 5 4 5H7z" fill="#ff6b6b" stroke="#17335b" stroke-width="2.4" stroke-linejoin="round"/></svg>`;
const MOUNTAIN_BG=`<svg class="mbg" viewBox="0 0 400 300" preserveAspectRatio="none" aria-hidden="true"><path d="M-10 300 L70 120 L120 170 L200 30 L270 140 L320 90 L410 300Z" fill="#a3aebb" stroke="#17335b" stroke-width="2" vector-effect="non-scaling-stroke"/><path d="M200 30 L222 70 L208 64 L196 76 L186 62 L176 72Z" fill="#fff"/><path d="M-10 300 L60 210 L140 250 L230 190 L330 240 L410 200 L410 300Z" fill="#8f9aa8"/></svg>`;
function makePathStation(troupe,L){
  const st=baseStation('path',troupe,L);
  st.setHearts(L>=3?5:4);
  st.per=Math.max(2,Math.ceil(troupe.length/4));
  st.next=()=>{
    const lead=st.waiting[0];
    const start=st.L===1?Math.min(lead.n,20):lead.n;
    st.pz=makePath(st.L,start);st.choice=st.pz.rows.map(()=>null);st.solved=false;st.trail=null;
  };
  st.next();
  st.say='Välj en sten på varje rad, nerifrån och upp, så att du når toppen med exakt rätt tal.';
  const runVals=()=>{const v=[st.pz.start];for(let r=0;r<st.pz.rows.length;r++){const ci=st.choice[r];if(ci==null)break;v.push(st.pz.rows[r][ci].f(v[v.length-1]));}return v;};
  st.html=()=>{
    const R=st.pz.rows.length,rv=runVals(),showRun=st.L===1||st.solved;
    let rows='';
    for(let r=R-1;r>=0;r--){
      const v=rv[r+1];
      rows+=`<div class="prow2"><span class="runv l"></span>${st.pz.rows[r].map((o,i)=>`<button class="opst ${st.choice[r]===i?'on':''}" data-act="op" data-v="${r}-${i}" aria-pressed="${st.choice[r]===i}" ${st.done||st.solved?'disabled':''}>${o.t}</button>`).join('')}<span class="runv">${showRun&&v!=null&&!Number.isNaN(v)?'= '+v:''}</span></div>`;
    }
    const lead=st.waiting[0];
    return `<div class="sidewrap"><div class="sidemain"><div class="mountain">${MOUNTAIN_BG}
      <div class="peak">${FLAG}<span>Toppen: ${st.pz.target}</span></div>
      ${rows}
      <div class="base">${lead?crHTML(lead):''}<span>Start: ${st.pz.start}</span></div>
      ${st.trail?`<div class="trail">Din stig: ${st.trail}</div>`:''}
    </div>
    <div class="actions">${st.solved?(st.waiting.length?'<button class="btn go big" data-act="next">Nästa stig</button>':''):`<button class="btn go big" data-act="climb" ${st.choice.some(x=>x==null)||st.done?'disabled':''}>Klättra!</button>`}</div>
    ${!st.solved&&st.choice.some(x=>x==null)?'<p class="hint" style="text-align:center">Välj en sten på varje rad.</p>':''}
    </div>
    <div class="sidecol">
      <div><div class="tray-label">Väntar vid foten</div><div class="tray">${st.waiting.map(c=>crHTML(c,{sm:1})).join('')||'<span class="hint">Alla är uppe.</span>'}</div></div>
      <div><div class="tray-label">Uppe på toppen</div><div class="tray">${st.across.map(c=>crHTML(c,{sm:1,cls:st.fx.pop&&st.fx.pop.includes(c.id)?'pop':''})).join('')}</div></div>
    </div></div>`;
  };
  st.acts.op=b=>{if(st.done||st.solved)return;const [r,i]=b.dataset.v.split('-').map(Number);st.choice[r]=st.choice[r]===i?null:i;st.trail=null;SFX.pop();st.render();};
  st.acts.climb=()=>{
    if(st.done||st.solved||st.choice.some(x=>x==null))return;
    const vals=[st.pz.start];let bad=null;
    for(let r=0;r<st.pz.rows.length;r++){
      const o=st.pz.rows[r][st.choice[r]],prev=vals[vals.length-1],nv=o.f(prev);
      if(Number.isNaN(nv)){bad=`${prev} kan inte delas jämnt med ${o.t.replace('/ ','')}.`;break;}
      if(nv<0){bad=`${prev} ${o.t} blir mindre än noll. Så långt ner går inte stigen!`;break;}
      vals.push(nv);
    }
    st.trail=vals.join(' → ');
    if(bad){st.strike(bad);st.render();return;}
    const end=vals[vals.length-1];
    if(end===st.pz.target){
      st.solved=true;
      const movers=st.waiting.slice(0,st.per);
      st.waiting=st.waiting.slice(movers.length);st.across.push(...movers);st.fx={pop:movers.map(c=>c.id)};
      SFX.ok();st.say=`${pick(PRAISE)} Exakt ${end}! ${pl(movers.length,'numling','numlingar')} klättrar upp till toppen.`;st.mood='good';
      if(!st.waiting.length){st.say='Alla har klättrat upp på Bergsstigen!';st.win();}
    }else st.strike(`Stigen slutade på ${end}, men toppen är ${st.pz.target}.`);
    st.render();
  };
  st.acts.next=()=>{st.next();st.say='En ny stig! Vilka stenar leder till toppen?';st.mood='';st.render();};
  return st;
}

const FACTORY={gates:makeGates,balloon:makeBalloon,stones:makeStones,venn:makeVenn,raft:makeRaft,lock:makeLock,machine:makeMachine,garden:makeGarden,share:makeShare,path:makePathStation};
function startStation(i,L){
  const key=S.journey.route[i];
  const lv=Math.max(1,Math.min(S.levels[key],L||S.levels[key]));
  const troupe=S.journey.troupe.map(c=>({...c}));
  document.querySelectorAll('.confetti').forEach(n=>n.remove());
  CUR=FACTORY[key](troupe,lv);CUR.render(true);
}
// Varje resa går genom 6 av de 10 banorna. Banor man spelat minst väljs först.
function pickRoute(){
  const ranked=ALL.map(k=>({k,c:(S.played[k]||0)+Math.random()*.9})).sort((a,b)=>a.c-b.c).map(o=>o.k);
  let route=shuffle(ranked.slice(0,ROUTE_LEN));
  if(route.includes('lock'))route=route.filter(k=>k!=='lock').concat('lock');
  return route;
}

function smoothPath(p){
  let d=`M${p[0][0]} ${p[0][1]}`;
  for(let i=0;i<p.length-1;i++){
    const p0=p[i-1]||p[i],p1=p[i],p2=p[i+1],p3=p[i+2]||p2;
    d+=` C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)} ${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)} ${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0]} ${p2[1]}`;
  }
  return d;
}
