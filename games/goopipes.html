<!--
  Rörmokaren / The Plumber — lägg rören innan vattnet börjar rinna (spel-id: goopipes)
  Del av Stalman games. Helt fristående: inga nätverksresurser.
  Hette förut Slemrören (Goo Pipes). Id:t och de sparade nycklarna är kvar, så rekord
  och tidsgränser följer med.
  localStorage: score.goopipes (bästa poäng, visas på hubbens kort),
                state.goopipes ({difficulty}: senast valda svårighet)
-->
<style>
:root{

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:var(--font);color:var(--ink);background:var(--sky);overflow-x:hidden;font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;touch-action:manipulation}
[hidden]{display:none!important}
.wrap{max-width:860px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
/* länk tillbaka till hubben (visas på menyn) */
.hubnav{display:none;max-width:860px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
body.at-menu .hubnav{display:block}
body.at-menu .wrap{padding-top:8px}
.back{display:inline-block;text-decoration:none;color:var(--ink);font-weight:800;font-size:16px;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:8px 16px;box-shadow:0 3px 0 var(--ink)}
.back:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}

.panel{background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:4px 5px 0 var(--ink)}
.btn{font-weight:800;font-size:1.05rem;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:999px;padding:.55em 1.15em;box-shadow:0 4px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s;line-height:1.15;min-height:48px}

  .btn:hover{background:#f0f8ff}

}

h2{font-size:clamp(1.35rem,3vw,1.8rem);font-weight:900}

.level .ico{font-size:2.1rem;line-height:1;grid-row:span 2}
.level .nm{font-size:1.35rem;font-weight:900;line-height:1.1}
.level .ds{color:var(--ink2);font-weight:700;font-size:.95rem;grid-column:2}
.level .tag{grid-column:3;grid-row:1 / span 2;font-size:.8rem;font-weight:900;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:1px 9px;white-space:nowrap}

/* ---------- spelplanen ---------- */

.bar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}

.ctrl{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.qwrap{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:16px;box-shadow:3px 4px 0 var(--ink)}

.status{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:16px;box-shadow:3px 4px 0 var(--ink);font-size:16px;font-weight:900;letter-spacing:.5px;padding:6px 12px;min-width:150px}

.board-outer{display:flex;justify-content:center}
#boardWrap{background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:4px 5px 0 var(--ink);padding:6px}
#board{display:block;touch-action:none;border-radius:10px}
.hint{text-align:center;font-size:14px;font-weight:700;color:var(--ink2)}

/* ---------- dialog ---------- */
.modal-back{position:fixed;inset:0;z-index:60;background:rgba(23,51,91,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{max-width:460px;width:100%;padding:22px 20px;display:flex;flex-direction:column;gap:12px;text-align:center;max-height:calc(100vh - 32px);overflow:auto}
.modal .lead{font-weight:700;color:var(--ink2)}
.modal .lead:empty{display:none}
.modal ul{text-align:left;margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;font-weight:600}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

<script>
/*LOGIC-START*/
"use strict";
// ---- pure game logic (no DOM) — exercised by tests/goopipes.test.js ----
var COLS = 10, ROWS = 7;
var SIDES = ["U", "R", "D", "L"];
var OPPOSITE = { U: "D", R: "L", D: "U", L: "R" };
var DELTA = { U: [-1, 0], R: [0, 1], D: [1, 0], L: [0, -1] };
// which side the water leaves through, given the side it entered from
var CONNECT = {
  H:  { L: "R", R: "L" },
  V:  { U: "D", D: "U" },
  UR: { U: "R", R: "U" },
  RD: { R: "D", D: "R" },
  DL: { D: "L", L: "D" },
  LU: { L: "U", U: "L" },
  X:  { U: "D", D: "U", L: "R", R: "L" }
};
var PIECE_TYPES = ["H", "V", "UR", "RD", "DL", "LU", "X"];

function exitSide(type, enterSide) {
  var m = CONNECT[type];
  return (m && m[enterSide]) || null;
}
function axisOf(side) { return side === "L" || side === "R" ? "h" : "v"; }
function inBounds(r, c) { return r >= 0 && r < ROWS && c >= 0 && c < COLS; }
function emptyBoard() {
  var g = [];
  for (var r = 0; r < ROWS; r++) { g.push([]); for (var c = 0; c < COLS; c++) g[r].push(null); }
  return g;
}
function makePiece(type) { return { type: type, filled: { h: false, v: false }, gooPasses: [] }; }
function makeStart(dir) { return { type: "S", dir: dir, filled: { h: true, v: true }, gooPasses: [] }; }
function isFlooded(cell) { return !!cell && (cell.filled.h || cell.filled.v); }

// Where may the next queue piece go? "place" (empty cell), "replace"
// (existing un-flooded piece, costs a penalty) or null (locked).
function placement(board, r, c) {
  var cell = board[r][c];
  if (!cell) return "place";
  if (cell.type === "S" || isFlooded(cell)) return null;
  return "replace";
}

// Water leaves (r,c) travelling `moveDir`. Can it enter the next cell?
function tryEnter(board, r, c, moveDir) {
  var d = DELTA[moveDir], nr = r + d[0], nc = c + d[1];
  if (!inBounds(nr, nc)) return { ok: false, reason: "edge" };
  var cell = board[nr][nc];
  if (!cell) return { ok: false, reason: "empty" };
  var enter = OPPOSITE[moveDir];
  var exit = exitSide(cell.type, enter);
  if (!exit) return { ok: false, reason: "blocked" };
  if (cell.type === "X") {
    if (cell.filled[axisOf(enter)]) return { ok: false, reason: "filled" };
    return { ok: true, r: nr, c: nc, enterSide: enter, exit: exit, secondPass: isFlooded(cell) };
  }
  if (isFlooded(cell)) return { ok: false, reason: "filled" };
  return { ok: true, r: nr, c: nc, enterSide: enter, exit: exit, secondPass: false };
}

// One flow step: the water just finished filling the cell in `state`
// ({r,c,enterSide}; enterSide null for the start piece). Claims the next
// cell's axis and returns {done:false, state:{r,c,enterSide,exit,secondPass}}
// or {done:true, reason, exitDir}.
function advanceFlow(board, state) {
  var cell = board[state.r][state.c];
  var out = cell.type === "S" ? cell.dir : exitSide(cell.type, state.enterSide);
  var res = tryEnter(board, state.r, state.c, out);
  if (!res.ok) return { done: true, reason: res.reason, exitDir: out };
  var next = board[res.r][res.c];
  if (next.type === "X") next.filled[axisOf(res.enterSide)] = true;
  else { next.filled.h = true; next.filled.v = true; }
  return {
    done: false,
    state: { r: res.r, c: res.c, enterSide: res.enterSide, exit: res.exit, secondPass: res.secondPass }
  };
}

// Runs the whole flow at once (used by the tests; the UI steps it over time).
function simulateFlow(board, start) {
  var state = { r: start.r, c: start.c, enterSide: null };
  var path = [];
  for (;;) {
    var res = advanceFlow(board, state);
    if (res.done) return { path: path, reason: res.reason, distance: path.length };
    state = res.state;
    path.push(state);
    if (path.length > COLS * ROWS * 2 + 4) return { path: path, reason: "overflow", distance: path.length };
  }
}

function roundOutcome(distance, required) { return distance >= required ? "level" : "over"; }
// 50/segment, 100 for the second pass through a cross, +50 while fast-forwarding
function segmentScore(secondPass, fast) { return (secondPass ? 100 : 50) + (fast ? 50 : 0); }

// Difficulty is picked when a game starts. Each one sets how long a pipe the
// first level needs and how slow the water starts; every level after that needs
// a longer pipe, faster water and a shorter countdown. "svar" is the original game.
var DIFFICULTIES = {
  latt:   { name: "Lätt",   icon: "🐣", kid: "Lugnt vatten och korta rör",
            en: { name: "Easy", kid: "Calm water and short pipes" },
            required: [5, 1, 16],   fill: [4400, 0.94, 1600], countdown: [20, 10] },
  mellan: { name: "Mellan", icon: "🚿", kid: "Lite snabbare vatten",
            en: { name: "Medium", kid: "Slightly faster water" },
            required: [6, 1.5, 20], fill: [3400, 0.91, 1100], countdown: [16, 6] },
  svar:   { name: "Svår",   icon: "🌊", kid: "Snabbt vatten och långa rör",
            en: { name: "Hard", kid: "Fast water and long pipes" },
            required: [8, 2, 24],   fill: [2600, 0.88, 700],  countdown: [12, 4] }
};
var DIFFICULTY_ORDER = ["latt", "mellan", "svar"];

function levelParams(level, difficulty) {
  var d = DIFFICULTIES[difficulty] || DIFFICULTIES.svar, n = level - 1;
  return {
    required: Math.min(d.required[0] + Math.floor(n * d.required[1]), d.required[2]),
    fillMs: Math.max(d.fill[2], Math.round(d.fill[0] * Math.pow(d.fill[1], n))),
    countdownMs: Math.max(d.countdown[1], d.countdown[0] - n) * 1000,
    fastMs: 110
  };
}
function randomType(rand) { return PIECE_TYPES[Math.floor(rand() * PIECE_TYPES.length)]; }
// The queue draws from a shuffled bag holding each piece once, refilled when
// empty: every piece turns up regularly and the same piece never comes three
// times in a row (at most twice, where one bag ends and the next begins).
function makePieceBag(rand) {
  var bag = [];
  return function () {
    if (!bag.length) {
      bag = PIECE_TYPES.slice();
      for (var i = bag.length - 1; i > 0; i--) {
        var j = Math.floor(rand() * (i + 1)), t = bag[i];
        bag[i] = bag[j]; bag[j] = t;
      }
    }
    return bag.pop();
  };
}
// Start piece anywhere, any direction, as long as it doesn't face the board edge.
function randomStart(rand) {
  for (;;) {
    var r = Math.floor(rand() * ROWS), c = Math.floor(rand() * COLS);
    var dir = SIDES[Math.floor(rand() * 4)];
    var d = DELTA[dir];
    if (inBounds(r + d[0], c + d[1])) return { r: r, c: c, dir: dir };
  }
}
// mulberry32 — seedable RNG so tests are deterministic
function makeRand(seed) {
  var a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    var t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
/*LOGIC-END*/

// ================= rendering & game shell =================
I18N.apply();
var tr = I18N.t;
var NUM_LOCALE = tr("sv-SE", "en-GB");
// a difficulty's name and description in the hub's language
function diffText(id) { return I18N.lang === "en" ? DIFFICULTIES[id].en : DIFFICULTIES[id]; }
var SCORE_KEY = "score.goopipes";
var STATE_KEY = "state.goopipes";   // { difficulty } — the last one picked (the id is from the time it was called Goo Pipes)
var REPLACE_PENALTY = 50, REPLACE_MS = 500, DIST_BONUS = 100, STUB_MS = 450;

var boardCv = document.getElementById("board");
var queueCv = document.getElementById("queue");
var bctx = boardCv.getContext("2d");
var qctx = queueCv.getContext("2d");
var scoreEl = document.getElementById("score");
var bestEl = document.getElementById("best");
var levelEl = document.getElementById("level");
var distEl = document.getElementById("dist");
var statusEl = document.getElementById("status");
var fastBtn = document.getElementById("fast");
var modal = document.getElementById("modal");
var menuEl = document.getElementById("menu");
var playEl = document.getElementById("play");

var EDGE = "#4f5966", BODY = "#b8c0cb", CHANNEL = "#2b3139", GOO = "#3aa0f5";   // GOO: the water
var SLOT = "#f1f4f8", LINE = "#d6dce4", ACCENT = "#f0a400", REPLACE = "#e8590c";
// piece geometry: polylines between cell-side midpoints ("C" = center)
var PATHS = {
  H: [["L", "C", "R"]], V: [["U", "C", "D"]],
  UR: [["U", "C", "R"]], RD: [["R", "C", "D"]], DL: [["D", "C", "L"]], LU: [["L", "C", "U"]],
  X: [["L", "C", "R"], ["U", "C", "D"]]
};
var DIR_ANGLE = { U: 0, R: Math.PI / 2, D: Math.PI, L: -Math.PI / 2 };

var game = null;
var cursor = { r: 3, c: 4 };
// The cursor and the preview of the next piece only show for the mouse and the
// keyboard. With a finger the cursor would stay on the square just tapped and
// draw the next piece on top of the one that was just laid there.
var cursorOn = false;
var cellPx = 48, dpr = 1;

function sidePoint(side, s) {
  if (side === "U") return [s / 2, 0];
  if (side === "R") return [s, s / 2];
  if (side === "D") return [s / 2, s];
  if (side === "L") return [0, s / 2];
  return [s / 2, s / 2];
}
function strokePath(ctx, pts, width, color) {
  ctx.strokeStyle = color; ctx.lineWidth = width;
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.stroke();
}
function strokePartial(ctx, pts, width, color, t) {
  if (t <= 0) return;
  var total = 0, lens = [], i, dx, dy;
  for (i = 1; i < pts.length; i++) {
    dx = pts[i][0] - pts[i - 1][0]; dy = pts[i][1] - pts[i - 1][1];
    lens.push(Math.sqrt(dx * dx + dy * dy)); total += lens[i - 1];
  }
  var target = total * Math.min(1, t);
  ctx.strokeStyle = color; ctx.lineWidth = width;
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (i = 1; i < pts.length && target > 0; i++) {
    if (target >= lens[i - 1]) { ctx.lineTo(pts[i][0], pts[i][1]); target -= lens[i - 1]; }
    else {
      var f = target / lens[i - 1];
      ctx.lineTo(pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * f,
                 pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * f);
      target = 0;
    }
  }
  ctx.stroke();
}
function drawFlange(ctx, side, s, pw) {
  var th = Math.max(3, s * 0.11), w = pw + s * 0.10;
  ctx.fillStyle = BODY; ctx.strokeStyle = EDGE; ctx.lineWidth = Math.max(1.5, s * 0.03);
  var x, y, ww, hh;
  if (side === "L") { x = 0; y = (s - w) / 2; ww = th; hh = w; }
  else if (side === "R") { x = s - th; y = (s - w) / 2; ww = th; hh = w; }
  else if (side === "U") { x = (s - w) / 2; y = 0; ww = w; hh = th; }
  else { x = (s - w) / 2; y = s - th; ww = w; hh = th; }
  ctx.fillRect(x, y, ww, hh);
  ctx.strokeRect(x + 0.5, y + 0.5, ww - 1, hh - 1);
}
// Draws one piece into an s×s box at the current origin.
function drawPiece(ctx, s, cell, now) {
  ctx.lineCap = "butt"; ctx.lineJoin = "miter";
  var pw = s * 0.46, ch = s * 0.22;
  if (cell.type === "S") { drawStart(ctx, s, cell, now, pw, ch); return; }
  var i, pts;
  var paths = PATHS[cell.type];
  for (i = 0; i < paths.length; i++) {
    pts = paths[i].map(function (sd) { return sidePoint(sd, s); });
    strokePath(ctx, pts, pw, EDGE);
    strokePath(ctx, pts, pw - Math.max(3, s * 0.08), BODY);
    drawFlange(ctx, paths[i][0], s, pw);
    drawFlange(ctx, paths[i][paths[i].length - 1], s, pw);
    strokePath(ctx, pts, ch, CHANNEL);
  }
  for (i = 0; i < cell.gooPasses.length; i++) {
    var p = cell.gooPasses[i];
    pts = [sidePoint(p.from, s), [s / 2, s / 2], sidePoint(p.to, s)];
    strokePartial(ctx, pts, ch, GOO, p.t);
  }
}
function drawStart(ctx, s, cell, now, pw, ch) {
  var stub = [[s / 2, s / 2], sidePoint(cell.dir, s)];
  strokePath(ctx, stub, pw, EDGE);
  strokePath(ctx, stub, pw - Math.max(3, s * 0.08), BODY);
  drawFlange(ctx, cell.dir, s, pw);
  strokePath(ctx, stub, ch, CHANNEL);
  var pass = cell.gooPasses[0];
  if (pass) strokePartial(ctx, stub, ch, GOO, pass.t);
  // pump body
  var ts = s * 0.62, o = (s - ts) / 2;
  ctx.fillStyle = BODY; ctx.fillRect(o, o, ts, ts);
  ctx.strokeStyle = EDGE; ctx.lineWidth = Math.max(2, s * 0.06);
  ctx.strokeRect(o, o, ts, ts);
  var iw = s * 0.30, io = (s - iw) / 2;
  ctx.fillStyle = CHANNEL; ctx.fillRect(io, io, iw, iw);
  if (pass && pass.t > 0) {
    ctx.globalAlpha = Math.min(1, pass.t * 2);
    ctx.fillStyle = GOO; ctx.fillRect(io, io, iw, iw);
    ctx.globalAlpha = 1;
  }
  // direction arrow (pulses while the countdown runs)
  var counting = game && game.phase === "countdown";
  ctx.save();
  ctx.translate(s / 2, s / 2);
  ctx.rotate(DIR_ANGLE[cell.dir]);
  ctx.globalAlpha = counting ? 0.55 + 0.45 * Math.sin(now / 140) : 0.9;
  ctx.fillStyle = (pass && pass.t > 0) ? CHANNEL : ACCENT;
  ctx.beginPath();
  ctx.moveTo(0, -iw * 0.42); ctx.lineTo(iw * 0.36, iw * 0.30); ctx.lineTo(-iw * 0.36, iw * 0.30);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

// ---------- layout ----------
// The board fills the width of the play screen, and as much of the height as is
// left under the bar and the queue (only measured while the play screen shows).
function resize() {
  if (playEl.hidden) return;
  dpr = window.devicePixelRatio || 1;
  var wrapW = playEl.clientWidth - 18;      // the board's frame: 6px padding and 3px border on each side
  var availH = window.innerHeight - boardCv.getBoundingClientRect().top - 56;
  cellPx = Math.max(30, Math.floor(Math.min(wrapW / COLS, Math.max(availH, 220) / ROWS)));
  boardCv.style.width = cellPx * COLS + "px";
  boardCv.style.height = cellPx * ROWS + "px";
  boardCv.width = cellPx * COLS * dpr;
  boardCv.height = cellPx * ROWS * dpr;
  var qs = 46;
  queueCv.style.width = (qs * 5 + 24) + "px";
  queueCv.style.height = qs + "px";
  queueCv.width = (qs * 5 + 24) * dpr;
  queueCv.height = qs * dpr;
}

// ---------- HUD ----------
function syncScore() {
  scoreEl.textContent = game.score.toLocaleString(NUM_LOCALE);
  var best = Number(localStorage.getItem(SCORE_KEY) || 0);
  if (game.score > best) { best = game.score; localStorage.setItem(SCORE_KEY, String(best)); }
  bestEl.textContent = best.toLocaleString(NUM_LOCALE);
}
function addScore(delta) {
  game.score = Math.max(0, game.score + delta);
  syncScore();
}
function syncDist() {
  distEl.textContent = game.dist + "/" + game.params.required;
  distEl.classList.toggle("met", game.dist >= game.params.required);
}
function syncStatus() {
  if (game.phase === "countdown") {
    var s = Math.ceil(game.countLeft / 1000);
    statusEl.textContent = tr("VATTNET KOMMER OM ", "WATER IN ") + s + " s";
    statusEl.classList.toggle("hot", s <= 3);
  } else if (game.phase === "flow") {
    statusEl.textContent = game.fast ? tr("SNABBT! ⏩", "FAST! ⏩") : tr("VATTNET RINNER…", "WATER FLOWING…");
    statusEl.classList.remove("hot");
  } else {
    statusEl.textContent = tr("RUNDAN ÄR SLUT", "ROUND OVER");
    statusEl.classList.remove("hot");
  }
}

// ---------- dialog ----------
// buttons: [text, function, extra class]; the first is the main one (yellow).
// extra: HTML under the text (the rules). closable: Escape and a tap outside close it.
function showModal(title, text, buttons, extra, closable) {
  document.getElementById("modalTitle").textContent = title;
  document.getElementById("modalText").textContent = text || "";
  document.getElementById("modalExtra").innerHTML = extra || "";
  var wrap = document.getElementById("modalBtns");
  wrap.innerHTML = "";
  buttons.forEach(function (b, i) {
    var btn = document.createElement("button");
    btn.className = "btn" + (i === 0 ? " go big" : "") + (b[2] ? " " + b[2] : "");
    btn.textContent = b[0];
    btn.onclick = function () { hideModal(); b[1](); };
    wrap.appendChild(btn);
  });
  modal.dataset.closable = closable ? "1" : "";
  modal.hidden = false;
  var first = wrap.querySelector("button");
  if (first) first.focus({ preventScroll: true });
}
function hideModal() { modal.hidden = true; }
modal.addEventListener("click", function (e) { if (e.target === modal && modal.dataset.closable) hideModal(); });

// ---------- menu ----------
function readState() {
  try { var s = JSON.parse(localStorage.getItem(STATE_KEY)); return s && typeof s === "object" ? s : {}; }
  catch (e) { return {}; }
}
function lastDifficulty() {
  var d = readState().difficulty;
  return DIFFICULTIES[d] ? d : "latt";
}
function atMenu() { return !menuEl.hidden; }
// The round waits (no countdown, no flow, no placing) behind the menu and dialogs.
function paused() { return atMenu() || !modal.hidden; }
function playing() { return !!game && game.phase !== "done"; }

// The start screen, also shown for "Meny" during a round, which then waits

  playEl.hidden = true;
  document.body.className = "at-menu";

function showPlay() {

// A new game on that difficulty. With a game under way, it asks first.
function chooseDifficulty(id) {
  if (playing() && (game.level > 1 || game.score > 0)) {
    showModal(tr("Börja ett nytt spel?", "Start a new game?"),
      tr("Du är på nivå " + game.level + " med " + game.score.toLocaleString(NUM_LOCALE) + " poäng. Det spelet försvinner om du börjar om.",

    return;
  }
  newGame(id);
}
function showRules() {

  ], [

    "A pipe the water has not reached can be replaced, but it costs 50 points.",

// ---------- game state ----------
function newGame(difficulty) {
  difficulty = DIFFICULTIES[difficulty] ? difficulty : (game ? game.difficulty : lastDifficulty());
  try { localStorage.setItem(STATE_KEY, JSON.stringify({ difficulty: difficulty })); } catch (e) {}
  game = { level: 1, score: 0, difficulty: difficulty, nextPiece: makePieceBag(Math.random) };
  document.getElementById("diff").textContent = DIFFICULTIES[difficulty].icon + " " + diffText(difficulty).name;
  startLevel();
  syncScore();
  showPlay();
}
function startLevel() {
  game.params = levelParams(game.level, game.difficulty);
  game.board = emptyBoard();
  game.dist = 0;
  game.phase = "countdown";
  game.countLeft = game.params.countdownMs;
  game.fast = false;
  game.current = null;
  game.pending = null;
  game.spill = null;
  game.fx = [];
  game.startPos = randomStart(Math.random);
  game.board[game.startPos.r][game.startPos.c] = makeStart(game.startPos.dir);
  game.queue = [];
  for (var i = 0; i < 5; i++) game.queue.push(game.nextPiece());
  fastBtn.classList.remove("on");
  levelEl.textContent = game.level;
  hideModal();
  syncDist();
  syncStatus();
}
function nextLevel() {
  game.level++;
  startLevel();
}
function takeQueue() {
  var t = game.queue.shift();
  game.queue.push(game.nextPiece());
  return t;
}
function tryPlace(r, c) {
  if (!game || game.phase === "done" || game.pending || paused()) return;
  var mode = placement(game.board, r, c);
  if (!mode) return;
  if (mode === "replace") {
    addScore(-REPLACE_PENALTY);
    spawnDebris(r, c);
    game.board[r][c] = null;
    game.pending = { r: r, c: c, type: takeQueue(), at: performance.now() + REPLACE_MS };
  } else {
    var piece = makePiece(takeQueue());
    piece.placedAt = performance.now();
    game.board[r][c] = piece;
  }
}
function spawnDebris(r, c) {
  var chunks = [];
  for (var i = 0; i < 7; i++) {
    chunks.push({
      ang: Math.random() * Math.PI * 2,
      sp: 0.0015 + Math.random() * 0.002,   // cells per ms
      sz: 0.08 + Math.random() * 0.10,      // fraction of a cell
      rot: Math.random() * Math.PI
    });
  }
  game.fx.push({ r: r, c: c, start: performance.now(), chunks: chunks });
}
function setFast() {
  if (!game || game.fast || game.phase === "done") return;
  game.fast = true;
  fastBtn.classList.add("on");
  if (game.phase === "countdown") game.countLeft = 0;
  else if (game.phase === "flow") {
    var cur = game.current;
    var t = Math.min(1, cur.elapsed / cur.dur);
    cur.dur = game.params.fastMs;
    cur.elapsed = t * cur.dur;
  }
  syncStatus();
}
function beginFlow() {
  game.phase = "flow";
  var sp = game.startPos, cell = game.board[sp.r][sp.c];
  var pass = { from: "C", to: cell.dir, t: 0, second: false };
  cell.gooPasses.push(pass);
  game.current = { r: sp.r, c: sp.c, pass: pass, elapsed: 0, dur: game.fast ? game.params.fastMs : STUB_MS };
  syncStatus();
}
function advanceSegment(leftover) {
  var cur = game.current;
  var isStub = cur.pass.from === "C";
  if (!isStub) {
    game.dist++;
    addScore(segmentScore(cur.pass.second, game.fast));
    syncDist();
  }
  var res = advanceFlow(game.board, { r: cur.r, c: cur.c, enterSide: isStub ? null : cur.pass.from });
  if (res.done) { endRound(res); return; }
  var st = res.state;
  var pass = { from: st.enterSide, to: st.exit, t: 0, second: st.secondPass };
  game.board[st.r][st.c].gooPasses.push(pass);
  game.current = {
    r: st.r, c: st.c, pass: pass, elapsed: leftover,
    dur: game.fast ? game.params.fastMs : game.params.fillMs
  };
}
function endRound(res) {
  game.phase = "done";
  game.spill = { r: game.current.r, c: game.current.c, dir: res.exitDir, at: performance.now() };
  syncStatus();
  var outcome = roundOutcome(game.dist, game.params.required);
  var g = game;
  if (outcome === "level") {
    var bonus = (game.dist - game.params.required) * DIST_BONUS;
    addScore(bonus);
    setTimeout(function () {
      if (game !== g) return;
      showModal(tr("Nivå " + g.level + " klar! 🎉", "Level " + g.level + " complete! 🎉"),
        tr("Röret blev " + g.dist + " långt (målet var " + g.params.required + ")" +
          (bonus ? " – längdbonus +" + bonus : "") + ". Nu blir vattnet snabbare …",
          "The pipe was " + g.dist + " long (the goal was " + g.params.required + ")" +
          (bonus ? " – length bonus +" + bonus : "") + ". Now the water gets faster …"),
        [[tr("Nästa nivå", "Next level"), nextLevel]]);
    }, 700);
  } else {
    setTimeout(function () {
      if (game !== g) return;
      showModal(tr("Vattnet rann ut! 💦", "The water spilled! 💦"),
        tr("Röret blev " + g.dist + " långt, men målet var " + g.params.required + ".",
          "The pipe was " + g.dist + " long, but the goal was " + g.params.required + "."),
        [[tr("Försök igen", "Try again"), function () { newGame(g.difficulty); }],
         [tr("Byt svårighet", "Change difficulty"), showMenu]]);
    }, 700);
  }
}

// ---------- main loop ----------
function update(dt) {
  if (!game || paused()) return;
  if (game.phase === "countdown") {
    game.countLeft -= dt;
    syncStatus();
    if (game.countLeft <= 0) beginFlow();
  } else if (game.phase === "flow") {
    game.current.elapsed += dt;
    var guard = 0;
    while (game.phase === "flow" && game.current.elapsed >= game.current.dur && guard++ < 300) {
      var leftover = game.current.elapsed - game.current.dur;
      game.current.pass.t = 1;
      advanceSegment(leftover);
    }
    if (game.phase === "flow") {
      game.current.pass.t = Math.min(1, game.current.elapsed / game.current.dur);
    }
  }
  if (game.pending && performance.now() >= game.pending.at) {
    var p = game.pending;
    game.pending = null;
    var piece = makePiece(p.type);
    piece.placedAt = performance.now();
    game.board[p.r][p.c] = piece;
  }
  game.fx = game.fx.filter(function (f) { return performance.now() - f.start < 520; });
}

function render(now) {
  bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  bctx.clearRect(0, 0, cellPx * COLS, cellPx * ROWS);
  var r, c, s = cellPx;
  for (r = 0; r < ROWS; r++) for (c = 0; c < COLS; c++) {
    bctx.fillStyle = SLOT;
    bctx.fillRect(c * s + 1, r * s + 1, s - 2, s - 2);
    bctx.strokeStyle = LINE; bctx.lineWidth = 1;
    bctx.strokeRect(c * s + 0.5, r * s + 0.5, s - 1, s - 1);
  }
  if (!game) return;
  for (r = 0; r < ROWS; r++) for (c = 0; c < COLS; c++) {
    var piece = game.board[r][c];
    if (!piece) continue;
    bctx.save();
    bctx.translate(c * s, r * s);
    if (piece.placedAt) {
      var age = now - piece.placedAt;
      if (age < 140) {
        var k = 0.75 + 0.25 * (age / 140);
        bctx.translate(s / 2 * (1 - k), s / 2 * (1 - k));
        bctx.scale(k, k);
      }
    }
    drawPiece(bctx, s, piece, now);
    bctx.restore();
  }
  // the cursor, with a faint preview of the next piece on an empty square;
  // over a pipe that would be replaced the cursor turns orange instead
  var aim = cursorAim();
  if (aim) {
    if (aim.mode === "place") {
      bctx.save();
      bctx.translate(aim.c * s, aim.r * s);
      bctx.globalAlpha = 0.30;
      drawPiece(bctx, s, makePiece(game.queue[0]), now);
      bctx.restore();
    }
    bctx.strokeStyle = aim.mode === "place" ? ACCENT : REPLACE; bctx.lineWidth = 3;
    bctx.strokeRect(aim.c * s + 2, aim.r * s + 2, s - 4, s - 4);
  }
  // debris from replaced pieces
  game.fx.forEach(function (f) {
    var age = now - f.start, p = age / 520;
    if (age < 0 || p > 1) return;
    bctx.globalAlpha = Math.max(0, 1 - p);
    bctx.fillStyle = BODY;
    f.chunks.forEach(function (ch) {
      var d = ch.sp * age * s;
      var x = f.c * s + s / 2 + Math.cos(ch.ang) * d;
      var y = f.r * s + s / 2 + Math.sin(ch.ang) * d;
      var sz = ch.sz * s * (1 - p * 0.5);
      bctx.save();
      bctx.translate(x, y); bctx.rotate(ch.rot + age / 200);
      bctx.fillRect(-sz / 2, -sz / 2, sz, sz);
      bctx.restore();
    });
    bctx.globalAlpha = 1;
  });
  // water spill where the round ended
  if (game.spill) {
    var sAge = now - game.spill.at;
    if (sAge < 900) {
      var sp = sidePoint(game.spill.dir, s);
      var px = game.spill.c * s + sp[0], py = game.spill.r * s + sp[1];
      var pr = sAge / 900;
      bctx.globalAlpha = 1 - pr;
      bctx.fillStyle = GOO;
      bctx.beginPath();
      bctx.arc(px, py, s * (0.12 + 0.45 * pr), 0, Math.PI * 2);
      bctx.fill();
      bctx.globalAlpha = 1;
    }
  }
  renderQueue(now);
}
// Where the cursor is drawn and what a click there would do, or null when it is hidden.
function cursorAim() {
  if (!cursorOn || !game || game.phase === "done" || game.pending || paused()) return null;
  var mode = placement(game.board, cursor.r, cursor.c);
  return mode ? { r: cursor.r, c: cursor.c, mode: mode } : null;
}
function renderQueue(now) {
  qctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  var qs = 46, gap = 6;
  qctx.clearRect(0, 0, qs * 5 + 24, qs);
  if (!game) return;
  for (var i = 0; i < 5; i++) {
    var x = i * (qs + gap);
    qctx.fillStyle = SLOT;
    qctx.fillRect(x, 0, qs, qs);
    qctx.strokeStyle = i === 0 ? ACCENT : LINE;
    qctx.lineWidth = i === 0 ? 2.5 : 1.5;
    qctx.strokeRect(x + 1, 1, qs - 2, qs - 2);
    qctx.save();
    qctx.translate(x + 5, 5);
    drawPiece(qctx, qs - 10, makePiece(game.queue[i]), now);
    qctx.restore();
  }
}

// One clock for everything (placedAt/pending/fx all use performance.now(),
// so render must too — rAF timestamps can drift from it).
var last = 0;
function frame() {
  var now = performance.now();
  var dt = Math.min(50, now - last);
  last = now;
  update(dt);
  render(now);
  requestAnimationFrame(frame);
}

// ---------- input ----------
boardCv.addEventListener("pointerdown", function (e) {
  e.preventDefault();
  var rect = boardCv.getBoundingClientRect();
  var c = Math.floor((e.clientX - rect.left) / cellPx);
  var r = Math.floor((e.clientY - rect.top) / cellPx);
  if (!inBounds(r, c)) return;
  cursor.r = r; cursor.c = c;
  cursorOn = e.pointerType === "mouse";
  tryPlace(r, c);
});
boardCv.addEventListener("pointermove", function (e) {
  if (e.pointerType !== "mouse") return;
  var rect = boardCv.getBoundingClientRect();
  var c = Math.floor((e.clientX - rect.left) / cellPx);
  var r = Math.floor((e.clientY - rect.top) / cellPx);
  if (inBounds(r, c)) { cursor.r = r; cursor.c = c; cursorOn = true; }
});
window.addEventListener("keydown", function (e) {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (!modal.hidden) {
    // Enter on a focused button presses it as usual; otherwise it takes the main button
    if (e.key === "Enter" && !modal.contains(document.activeElement)) {
      e.preventDefault();
      var btn = modal.querySelector(".btn.go") || modal.querySelector(".btn");
      if (btn) btn.click();
    } else if (e.key === "Escape" && modal.dataset.closable) {
      e.preventDefault();
      hideModal();
    }
    return;
  }
  if (atMenu() || !game) return;
  var moves = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
  if (moves[e.key]) {
    e.preventDefault();
    cursorOn = true;
    cursor.r = Math.max(0, Math.min(ROWS - 1, cursor.r + moves[e.key][0]));
    cursor.c = Math.max(0, Math.min(COLS - 1, cursor.c + moves[e.key][1]));
  } else if (e.key === "Enter") {
    e.preventDefault();
    tryPlace(cursor.r, cursor.c);
  } else if (e.key === " ") {
    e.preventDefault();
    setFast();
  } else if (e.key === "Escape") {
    e.preventDefault();
    showMenu();
  }
});
fastBtn.addEventListener("click", setFast);
document.getElementById("menuBtn").addEventListener("click", showMenu);
document.getElementById("resume").addEventListener("click", showPlay);
document.getElementById("rules").addEventListener("click", showRules);
window.addEventListener("resize", resize);

// ---------- boot ----------
bestEl.textContent = Number(localStorage.getItem(SCORE_KEY) || 0).toLocaleString(NUM_LOCALE);
showMenu();
requestAnimationFrame(frame);

// fungerar utan internet via hubbens service worker
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("../sw.js").catch(function () {});
}
</script>
