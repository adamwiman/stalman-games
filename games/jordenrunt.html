<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Jorden runt</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<!--
  Jorden runt — geografispel: flaggor, huvudstäder och länder (spel-id: jordenrunt)
  Del av spelhubben. Helt fristående: inga nätverksresurser, flaggorna ligger i filen.
  Sex spellägen:
    Flaggor          — flagga → land, land → flagga eller blandat (10 frågor, 8 rätt klarar nivån)
    Huvudstäder      — land → huvudstad, huvudstad → land eller blandat (10 frågor, 8 rätt)
    Storleksordning  — sortera länder efter befolkning eller yta (5 frågor, 4 helt rätt)
    Världsdelar      — lägg länderna i rätt världsdel (10 frågor, 8 rätt)
    Högre eller lägre — vilket av två länder är störst? Tills man svarar fel (10 i rad klarar nivån)
    Mysterielandet   — gissa landet med så få ledtrådar som möjligt (5 länder, 4 lösta)
  Område: hela världen, en världsdel eller "Mina missar" (länder man svarat fel på).
  Nivåer Lätt, Mellan, Svår, Geni, Omöjliga per läge; nästa nivå låses upp när man klarar nivån före.
  Passet: ett land får en stämpel när man svarat rätt om det 3 gånger. Duell: två spelare på samma skärm.
  Länder: FN:s 193 medlemsländer + Vatikanstaten och Palestina (observatörsstater i FN) = 195.
  Källor:
    Flaggor    — flag-icons av Panayiotis Lipiridis m.fl., MIT-licens (4:3, optimerade med svgo)
    Befolkning — Världsbanken, World Development Indicators, 2025 (CC BY 4.0), via github.com/datasets/population
                 (Vatikanstaten: cirka 800)
    Yta, grannländer och kust — github.com/mledoze/countries, ODbL 1.0. Landstabellen COUNTRIES i den här
                 filen är en härledd databas och får användas under samma licens (ODbL 1.0).
    Svenska namn och huvudstäder enligt svenska skrivregler och Isof (t.ex. Helsingfors, Kyjiv).
  localStorage: score.jordenrunt (antal stämplar i passet, visas på hubbens kort)
                state.jordenrunt ({prog: upplåsta nivåer och rekord per läge, pass, miss, pref, names})
-->
<style>
:root{
  /* hubbens färger */
  --sky:#ddf1ff; --ink:#17335b; --sun:#ffc63f; --coral:#ff6b6b; --mint:#38d9a9;
  /* spelets extra färger */
  --ink2:#4a6182; --paper:#ffffff; --hl:#1767d1;
  --good:#1a8a5f; --goodbg:#d4f6ea; --bad:#c93a3a; --badbg:#ffe3e3;
  --p1:#ff8a3d; --p1bg:#ffe8d6; --p2:#7b5cd6; --p2bg:#ebe3ff;
  --font: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", "Arial Rounded MT Bold", system-ui, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:var(--font);color:var(--ink);background:var(--sky);overflow-x:hidden;font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
h1,h2,h3,p{margin:0}
button,input{font:inherit;color:inherit;touch-action:manipulation}
#app{max-width:1000px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:12px}
/* länk tillbaka till hubben (visas på menyn) */
.hubnav{display:none;max-width:1000px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left))}
body.at-menu .hubnav{display:block}
body.at-menu #app{padding-top:8px;min-height:0}
.back{display:inline-block;text-decoration:none;color:var(--ink);font-weight:800;font-size:16px;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:8px 16px;box-shadow:0 3px 0 var(--ink)}
.back:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
:focus-visible{outline:4px solid var(--hl);outline-offset:3px}

.panel{background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:4px 5px 0 var(--ink)}
.btn{font-weight:800;font-size:1.05rem;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:999px;padding:.55em 1.15em;box-shadow:0 4px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s;line-height:1.15;min-height:48px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.go{background:var(--sun)}
.btn.big{font-size:1.2rem;padding:.6em 1.4em;min-height:56px}
.btn.sm{font-size:.95rem;padding:.4em .95em;min-height:44px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 4px 0 var(--ink)}
@media (hover:hover){
  .btn:not(:disabled):hover{background:#f0f8ff}
  .btn.go:not(:disabled):hover{background:#ffd466}
  .mode:hover,.level:not(.locked):hover{filter:brightness(1.03);transform:translateY(-2px)}
  .opt:not(:disabled):hover,.sitem:not(:disabled):hover,.hcard:not(:disabled):hover,.basket:not(:disabled):hover,.ptile:hover{background:#f0f8ff}
}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.center{justify-content:center}
.small{font-size:.9rem;font-weight:800;color:var(--ink2)}
h1{font-size:clamp(2rem,5vw,2.7rem);font-weight:900;letter-spacing:.3px}
h2{font-size:clamp(1.25rem,3vw,1.7rem);font-weight:900}
h3{font-size:1.15rem;font-weight:900}
.sub{color:var(--ink2);font-weight:700;max-width:36em}
.flag{display:block;width:100%;aspect-ratio:4/3;border-radius:8px;box-shadow:0 0 0 2px var(--ink);background:#fff;pointer-events:none}

/* ---------- meny ---------- */
.menu{display:flex;flex-direction:column;gap:14px}
.hero{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:2px 0}
.logo{font-size:clamp(48px,8vw,68px);line-height:1;background:#fff;border:4px solid var(--ink);border-radius:24px;box-shadow:5px 6px 0 var(--ink);padding:.12em .32em}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%;max-width:820px;margin:0 auto}
@media (max-width:600px){.modes{grid-template-columns:1fr}}
.mode{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto 1fr auto;gap:2px 12px;align-items:start;text-align:left;background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:4px 5px 0 var(--ink);padding:12px 16px;cursor:pointer;transition:transform .1s,box-shadow .1s;min-height:96px}
.mode:active{transform:translate(2px,3px);box-shadow:2px 2px 0 var(--ink)}
.mode .ico{font-size:2.3rem;line-height:1;grid-row:span 3;align-self:center}
.mode .nm{font-size:1.3rem;font-weight:900;line-height:1.15}
.mode .ds{color:var(--ink2);font-weight:700;font-size:.93rem}
.mode .tag{justify-self:start;font-size:.8rem;font-weight:900;background:var(--sky);border:2px solid var(--ink);border-radius:999px;padding:1px 9px;margin-top:4px}
.m-flaggor{background:#ffe9e6}.m-huvudstader{background:#e6f0ff}.m-storlek{background:#fff4d1}
.m-varldsdelar{background:#dcf7ec}.m-hogrelagre{background:#ebe3ff}.m-mysterium{background:#dfe7f2}
.tools{gap:12px}
.record{text-align:center;font-weight:800;font-size:1.1rem}

/* ---------- inställningar för ett läge ---------- */
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar h2{flex:1;min-width:0}
.setup{display:flex;flex-direction:column;gap:14px}
.group{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-weight:800;font-size:.98rem;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:.35em .9em;min-height:44px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.chip:disabled{opacity:.45;cursor:not-allowed}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.menumsg{min-height:1.4em;font-weight:900;color:var(--bad)}
.levels{display:flex;flex-direction:column;gap:10px;width:100%}
.level{position:relative;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 14px;text-align:left;border:3px solid var(--ink);border-radius:20px;box-shadow:4px 5px 0 var(--ink);padding:10px 16px;cursor:pointer;min-height:72px;transition:transform .1s,box-shadow .1s}
.level:active{transform:translate(2px,3px);box-shadow:2px 2px 0 var(--ink)}
.level .ico{font-size:2rem;line-height:1;grid-row:span 2}
.level .nm{font-size:1.3rem;font-weight:900;line-height:1.1}
.level .ds{color:var(--ink2);font-weight:700;font-size:.93rem;grid-column:2}
.level .tag{grid-column:3;grid-row:1 / span 2;font-size:.8rem;font-weight:900;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:1px 9px;white-space:nowrap}
@media (max-width:520px){.level{grid-template-columns:auto 1fr}.level .tag{grid-column:2;grid-row:auto;justify-self:start}}
.lv-latt{background:#dcf7ec}.lv-mellan{background:#fff4d1}.lv-svar{background:#ffe6e3}.lv-geni{background:#ebe3ff}.lv-omojliga{background:#dfe7f2}
.level.locked{background:#eef2f7;color:#7d8ea6;border-color:#9fb0c6;box-shadow:3px 4px 0 #9fb0c6;cursor:default}
.level.locked .ds,.level.locked .tag{color:#7d8ea6;border-color:#9fb0c6}
.rules{font-weight:700;color:var(--ink2);background:#fff;border:2px dashed #9fb0c6;border-radius:14px;padding:8px 12px}

/* ---------- spelet ---------- */
.play{display:flex;flex-direction:column;gap:12px;flex:1}
.bar{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.ptitle{flex:1;min-width:130px;display:flex;flex-direction:column;line-height:1.15}
.ptitle b{font-size:1.15rem;font-weight:900}
.ptitle small{font-size:.88rem;font-weight:800;color:var(--ink2)}
.stats{display:flex;gap:8px}
.stat{display:flex;flex-direction:column;align-items:center;min-width:68px;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:2px 10px 3px;box-shadow:0 3px 0 var(--ink)}
.stat .n{font-size:1.35rem;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .l{font-size:.78rem;font-weight:800;color:var(--ink2)}
.stat.good{background:var(--goodbg)}
.turn{align-self:center;font-size:clamp(1.2rem,3vw,1.6rem);font-weight:900;border:3px solid var(--ink);border-radius:999px;padding:.2em 1em;box-shadow:0 3px 0 var(--ink)}
.turn.p0{background:var(--p1bg)}.turn.p1{background:var(--p2bg)}
.ask{text-align:center;font-size:clamp(1.2rem,3vw,1.6rem);font-weight:900}
.ask b{color:var(--hl)}
.prompt{display:flex;flex-direction:column;align-items:center;gap:10px}
.bigflag{width:min(360px,72vw,max(170px,calc((100dvh - 440px) * 4 / 3)))}
body.duel .bigflag{width:min(320px,72vw,max(150px,calc((100dvh - 560px) * 4 / 3)))}
.capflag{width:min(150px,30vw)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%;max-width:760px;margin:0 auto}
@media (min-width:601px){.opts.t3{grid-template-columns:repeat(3,minmax(0,1fr));max-width:900px}}
.opts.flags{grid-template-columns:repeat(3,minmax(0,1fr));max-width:min(900px,calc((100dvh - 250px) * 2))}
.opts.flags.n4{grid-template-columns:repeat(2,minmax(0,1fr));max-width:min(620px,calc((100dvh - 250px) * 4 / 3))}
.opts.flags.n3{max-width:min(900px,calc((100dvh - 250px) * 3))}
@media (max-width:600px){.opts.flags,.opts.flags.n3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.opts.cards{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));max-width:900px}
.opt{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;text-align:center;font-weight:900;font-size:1.15rem;background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink);padding:10px 12px;min-height:60px;cursor:pointer;line-height:1.15;overflow-wrap:break-word;-webkit-hyphens:auto;hyphens:auto}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.opt.f{padding:8px;flex-direction:column}
.opt.fn{flex-direction:column;gap:6px;padding:8px;font-size:1rem}
.opt.fn .flag{width:min(120px,100%)}
.opt.right{background:var(--goodbg);border-color:var(--good);box-shadow:0 4px 0 var(--good)}
.opt.wrong{background:var(--badbg);border-color:var(--bad);box-shadow:0 4px 0 var(--bad)}
.opt.gone{opacity:.35;text-decoration:line-through}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default}
.opt .mark{position:absolute;top:-10px;right:-8px;font-size:1.5rem;line-height:1}
.opt.wrong.shake{animation:shake .4s}

/* korgarna i Världsdelar */
.baskets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%;max-width:820px;margin:0 auto}
@media (max-width:600px){.baskets{grid-template-columns:repeat(2,minmax(0,1fr))}}
.basket{display:flex;flex-direction:column;align-items:center;gap:4px;background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink);padding:8px;min-height:96px;cursor:pointer;font-weight:900}
.basket:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.basket .bi{font-size:1.8rem;line-height:1}
.basket .mini{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;min-height:16px}
.basket .mini img{width:22px;height:16.5px;border-radius:3px;box-shadow:0 0 0 1px var(--ink)}
.basket.right{background:var(--goodbg);border-color:var(--good);box-shadow:0 4px 0 var(--good)}
.basket.wrong{background:var(--badbg);border-color:var(--bad);box-shadow:0 4px 0 var(--bad)}
.basket:disabled{cursor:default}

/* Storleksordning */
.sortlist{display:grid;grid-template-columns:1fr;gap:10px;width:100%;max-width:620px;margin:0 auto}
.sitem{position:relative;display:grid;grid-template-columns:auto 72px 1fr auto;align-items:center;gap:10px;text-align:left;background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:8px 12px;min-height:66px;cursor:pointer;font-weight:900;font-size:1.1rem}
.sitem:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.sitem .num{width:38px;height:38px;border-radius:50%;border:3px dashed #9fb0c6;display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:900;color:#9fb0c6}
.sitem.picked .num{border:3px solid var(--ink);background:var(--sun);color:var(--ink)}
.sitem .val{font-size:.9rem;font-weight:800;color:var(--ink2);text-align:right;white-space:nowrap}
.sitem.right .num,.sitem.wrong .num{border-style:solid;color:var(--ink);background:#fff}
.sitem.right{background:var(--goodbg);border-color:var(--good);box-shadow:0 4px 0 var(--good)}
.sitem.wrong{background:var(--badbg);border-color:var(--bad);box-shadow:0 4px 0 var(--bad)}
.sitem:disabled{cursor:default}
.sitem .yours{font-size:.75rem;font-weight:800;color:var(--ink2);display:block}

/* Högre eller lägre */
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:100%;max-width:760px;margin:0 auto}
.hcard{display:flex;flex-direction:column;align-items:center;gap:8px;background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:0 4px 0 var(--ink);padding:12px;cursor:pointer;font-weight:900;font-size:1.2rem;text-align:center;line-height:1.15}
.hcard:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.hcard .flag{width:min(240px,100%,calc((100dvh - 360px) * 4 / 3))}
.hcard .val{font-size:1rem;font-weight:800;color:var(--ink2);min-height:1.3em}
.hcard.right{background:var(--goodbg);border-color:var(--good);box-shadow:0 4px 0 var(--good)}
.hcard.wrong{background:var(--badbg);border-color:var(--bad);box-shadow:0 4px 0 var(--bad)}
.hcard:disabled{cursor:default}
.vs{display:none}

/* Mysterielandet */
.clues{list-style:none;margin:0 auto;padding:0;display:flex;flex-direction:column;gap:6px;width:100%;max-width:760px}
.clues li{display:flex;gap:10px;align-items:flex-start;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px 12px;font-weight:800}
.clues li .ci{font-size:1.25rem;line-height:1.2}
.clues li.new{animation:pop .3s}
.cluebar{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.pts{font-weight:900;background:var(--sun);border:3px solid var(--ink);border-radius:999px;padding:.2em .8em}
.search{width:100%;max-width:520px;margin:0 auto;display:block;font-size:1.15rem;font-weight:800;border:3px solid var(--ink);border-radius:16px;padding:.6em .9em;box-shadow:0 3px 0 var(--ink);-webkit-user-select:text;user-select:text;background:#fff}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;width:100%;max-width:820px;margin:0 auto;min-height:60px}
.results .none{grid-column:1/-1;text-align:center;font-weight:800;color:var(--ink2)}

/* svaret: blad längst ner med landkort och Nästa */
.sheet{position:sticky;bottom:0;z-index:5;margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:0 -2px 0 var(--ink),4px 5px 0 var(--ink)}
.sheet.ok{background:#f1fcf7;border-color:var(--good)}
.sheet.bad{background:#fff5f5;border-color:var(--bad)}
.sheet .msg{font-size:1.25rem;font-weight:900;text-align:center}
.sheet.ok .msg{color:var(--good)}
.sheet.bad .msg{color:var(--bad)}
.sheet .why{font-weight:800;text-align:center;max-width:40em}
.sheet .foot{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:center;width:100%}
.sheet .foot .lcard{width:auto;flex:0 1 460px}
.sheet.pop{animation:pop .3s}
.lcard{display:flex;gap:12px;align-items:center;text-align:left;width:100%;max-width:560px}
.lcard .flag{width:96px;flex:none}
.lcard .info{display:flex;flex-direction:column;gap:1px;font-weight:800;font-size:.95rem;min-width:0}
.lcard .info b{font-size:1.15rem;font-weight:900}
.lcard .info .note{font-size:.82rem;color:var(--ink2);font-weight:700}
.lcard.big{flex-direction:column;text-align:center;max-width:420px}
.lcard.big .flag{width:min(260px,70vw)}
.lcard.big .info{align-items:center}

/* ---------- resultat ---------- */
.page{padding:18px;display:flex;flex-direction:column;gap:14px}
.summary{align-items:center;text-align:center}
.medal{font-size:64px;line-height:1}
.lead{font-size:1.2rem;font-weight:800;max-width:30em}
.bigstats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.big{min-width:110px;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:8px 16px 10px;box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;align-items:center}
.big b{font-size:2.3rem;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.big span{font-weight:800;color:var(--ink2)}
.big.good{background:var(--goodbg)}
.big.good b{color:var(--good)}
.big.p0{background:var(--p1bg)}.big.p1{background:var(--p2bg)}
.unlock{font-weight:900;font-size:1.2rem;background:var(--sun);border:3px solid var(--ink);border-radius:999px;padding:.3em 1em}
.missed{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;width:100%;max-width:720px}
.mtile{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:.9rem;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:6px;cursor:pointer;line-height:1.15}

/* ---------- passet ---------- */
.passpage{display:flex;flex-direction:column;gap:14px}
.meter{height:22px;background:#fff;border:3px solid var(--ink);border-radius:999px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--mint)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.ptile{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:6px 4px;cursor:pointer;font-weight:800;font-size:.82rem;line-height:1.15;text-align:center;min-height:44px}
.ptile .flag{width:100%}
.ptile>span:not(.stamp):not(.dots){max-width:100%;overflow-wrap:break-word;-webkit-hyphens:auto;hyphens:auto}
.ptile.no .flag{filter:grayscale(1);opacity:.35}
.ptile .stamp{position:absolute;top:-8px;right:-6px;font-size:1.35rem;line-height:1;transform:rotate(12deg)}
.ptile .dots{font-size:.7rem;letter-spacing:2px;color:var(--ink2)}
.ptile.yes{background:#f1fcf7;border-color:var(--good)}

/* ---------- duell ---------- */
.players{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:600px){.players{grid-template-columns:1fr}}
.pcard{display:flex;flex-direction:column;gap:8px;border:3px solid var(--ink);border-radius:20px;box-shadow:4px 5px 0 var(--ink);padding:12px}
.pcard.p0{background:var(--p1bg)}.pcard.p1{background:var(--p2bg)}
.pcard input{font-size:1.15rem;font-weight:900;border:3px solid var(--ink);border-radius:14px;padding:.4em .7em;width:100%;background:#fff;-webkit-user-select:text;user-select:text}
.duelbar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.dpill{font-weight:900;border:3px solid var(--ink);border-radius:999px;padding:.25em .9em;background:#fff;box-shadow:0 3px 0 var(--ink);opacity:.6}
.dpill.p0{background:var(--p1bg)}.dpill.p1{background:var(--p2bg)}
.dpill.on{opacity:1;outline:3px solid var(--ink);outline-offset:2px}

/* ---------- dialog och regler ---------- */
.modal-back{position:fixed;inset:0;background:rgba(23,51,91,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:500}
.modal{max-width:520px;width:100%;max-height:calc(100dvh - 32px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px;text-align:center}
.about{text-align:left}
.about h3{text-align:center}
.about ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px;font-weight:700}
.about li b{font-weight:900}
.about .src{font-size:.85rem;font-weight:700;color:var(--ink2)}

/* ---------- konfetti ---------- */
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:600}
.confetti i{position:absolute;top:-24px;width:11px;height:15px;border-radius:3px;animation:fall linear forwards}

@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
@keyframes fall{to{transform:translateY(112vh) rotate(560deg)}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
/* mobil (t.ex. iPhone 15 Pro, 393 px) */
@media (max-width:600px){
  #app{padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right))}
  .opt{font-size:1.02rem;min-height:56px}
  .stat{min-width:56px}
  .lcard .flag{width:76px}
  .sitem{grid-template-columns:auto 56px 1fr auto;font-size:1rem}
}
</style>

    blurb:'Sortera länderna från störst till minst.'},
  {id:'varldsdelar',name:'Världsdelar',icon:'🧺',kind:'continent',len:10,need:8,worldOnly:true,
    blurb:'Lägg varje land i rätt världsdel.'},
  {id:'hogrelagre',name:'Högre eller lägre',icon:'⚖️',kind:'hilo',len:0,need:10,metric:true,
    blurb:'Vilket av två länder är störst? Hur många rätt i rad klarar du?'},
  {id:'mysterium',name:'Mysterielandet',icon:'🔍',kind:'mystery',len:5,need:4,
    blurb:'Gissa landet med så få ledtrådar som möjligt.'}

const MODE={};for(const m of MODES)MODE[m.id]=m;
const METRICS=[{id:'p',name:'Befolkning'},{id:'a',name:'Yta'},{id:'mix',name:'Blanda'}];
const AREAS=[{id:'world',name:'Hela världen',icon:'🌐'}].concat(CONTINENTS,[{id:'missar',name:'Mina missar',icon:'🎯'}]);
const DUEL_LEN={choice:6,continent:6,sort:3,hilo:6,mystery:2};
const CLUES_MAX=8;     // ledtrådar i Mysterielandet; första gissningen ger 8 poäng
const STAMP=3;         // rätt svar om ett land som ger en stämpel i passet
const MISS_MIN=6;      // så många missar behövs för "Mina missar"

// ---------- slump ----------
function makeRand(seed){
  let a=seed>>>0;
  return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};
}
function shuffle(rand,arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pickWeighted(rand,list,w){
  let tot=0;const ws=list.map(x=>{const v=w(x);tot+=v;return v;});
  let r=rand()*tot;for(let i=0;i<list.length;i++){r-=ws[i];if(r<0)return list[i];}
  return list[list.length-1];
}
const ratio=(x,y)=>Math.max(x,y)/Math.min(x,y);

// ---------- vilka länder som är med ----------
function inArea(c,area,miss){return area==='missar'?!!(miss&&miss[c.c]>0):area==='world'||!area?true:c.k===area;}
function fitsMode(c,modeId,L){
  if(modeId==='huvudstader')return !c.nc;
  if(modeId==='varldsdelar')return L.ambig||!c.x;
  return true;
}
// Länderna som frågorna handlar om. Är de för få på nivån tas mindre kända länder med.
function poolFor(modeId,area,lvl,miss,min){
  const L=LEVELS[lvl];
  const base=COUNTRIES.filter(c=>inArea(c,area,miss)&&fitsMode(c,modeId,L));
  if(area==='missar')return base;
  let t=L.maxTier,pool=base.filter(c=>c.t<=t);
  while(pool.length<(min||8)&&t<4){t++;pool=base.filter(c=>c.t<=t);}
  return pool;
}
// Länder som får vara fel svar.
function decoyPool(modeId,area,lvl){return poolFor(modeId,area==='missar'?'world':area,lvl,null,12);}
// Alla länder i området, oavsett hur kända de är.
function areaAll(modeId,area,lvl){return COUNTRIES.filter(c=>inArea(c,area==='missar'?'world':area,null)&&fitsMode(c,modeId,LEVELS[lvl]));}
function missCount(modeId,miss){return COUNTRIES.filter(c=>miss&&miss[c.c]>0&&fitsMode(c,modeId,LEVELS[4])).length;}

// Svarsalternativ: målet plus fel svar. kind: 'flag', 'cap' eller 'land'.
function makeOptions(rand,kind,target,decoys,L,n){
  const t=BY[target],out=[target];
  const avail=new Set(decoys.map(c=>c.c));avail.delete(target);
  const pairOk=(a,b)=>kind==='flag'?!twin(a,b):kind==='cap'?BY[a].cap!==BY[b].cap:true;
  const fits=x=>avail.has(x)&&!out.includes(x)&&out.every(o=>pairOk(o,x));
  const add=(codes,max)=>{let k=0;for(const x of shuffle(rand,codes)){if(out.length>=n||k>=max)return;if(fits(x)){out.push(x);k++;}}};
  const same=decoys.filter(c=>c.k===t.k).map(c=>c.c);
  const need=n-1;
  if(L.pick==='near')add(same,Math.ceil(need/2));
  else if(L.pick==='mix'){add(kind==='flag'?t.s:t.b,2);add(same,need);}
  else if(L.pick==='similar'){if(kind==='flag')add(t.s,need);add(t.b,need);add(same,need);}
  add([...avail],need);
  if(out.length<n){   // små områden: låna fel svar från hela världen
    for(const c of shuffle(rand,COUNTRIES)){
      if(out.length>=n)break;
      if(!out.includes(c.c)&&!(kind==='cap'&&c.nc)&&out.every(o=>pairOk(o,c.c)))out.push(c.c);
    }
  }
  return shuffle(rand,out);
}
// n länder där alla par skiljer sig minst lo gånger (så att ordningen aldrig är oklar).
function pickSpread(rand,lists,n,lo,val){
  for(const list of lists){
    if(list.length<n)continue;
    for(let a=0;a<60;a++){
      const ch=[];
      for(const c of shuffle(rand,list)){
        if(ch.every(d=>ratio(val(c),val(d))>=lo))ch.push(c);
        if(ch.length===n)return ch;
      }
    }
  }
  return null;
}

// ---------- en omgång ----------
// cfg: {mode, lvl, area, dir, metric}; len 0 betyder "tills man svarar fel" (Högre eller lägre).
function newRound(cfg,seed,miss,len){
  const M=MODE[cfg.mode],L=LEVELS[cfg.lvl];
  const min=M.kind==='sort'?L.sortN+3:8;
  return {cfg,M,L,rand:makeRand(seed),miss:miss||{},
    pool:poolFor(cfg.mode,cfg.area,cfg.lvl,miss,min),
    decoys:decoyPool(cfg.mode,cfg.area,cfg.lvl),
    len:len===undefined?M.len:len,
    used:[],qs:[],i:-1,answered:0,right:0,points:0,streak:0,best:0,lost:false,missed:[],baskets:{}};
}
function pickTarget(R){
  const fresh=R.pool.filter(c=>!R.used.includes(c.c));
  const list=fresh.length?fresh:R.pool;
  const c=pickWeighted(R.rand,list,c=>1+2*Math.min(3,R.miss[c.c]||0));
  R.used.push(c.c);
  return c;
}
const metricOf=(R)=>R.cfg.metric==='mix'?(R.rand()<.5?'p':'a'):(R.cfg.metric||'p');
function genQuestion(R){
  const {M,L,cfg}=R;
  if(M.kind==='choice'){
    const t=pickTarget(R);
    if(M.id==='flaggor'){
      const dir=cfg.dir==='mix'||!cfg.dir?(R.rand()<.5?'f2n':'n2f'):cfg.dir;
      return {type:'choice',dir,target:t.c,options:makeOptions(R.rand,'flag',t.c,R.decoys,L,L.opts)};
    }
    const dir=cfg.dir==='mix'||!cfg.dir?(R.rand()<.5?'n2c':'c2n'):cfg.dir;
    return {type:'choice',dir,target:t.c,options:makeOptions(R.rand,dir==='n2c'?'cap':'land',t.c,R.decoys,L,L.opts)};
  }
  if(M.kind==='continent'){
    const t=pickTarget(R);
    return {type:'continent',target:t.c};
  }
  if(M.kind==='sort'){
    const metric=metricOf(R),val=c=>c[metric];
    const fresh=R.pool.filter(c=>!R.used.includes(c.c));
    const items=pickSpread(R.rand,[fresh,R.pool,areaAll(cfg.mode,cfg.area,cfg.lvl),COUNTRIES],L.sortN,L.sortMin,val);
    items.forEach(c=>R.used.push(c.c));
    const answer=items.slice().sort((a,b)=>val(b)-val(a)).map(c=>c.c);
    return {type:'sort',metric,items:shuffle(R.rand,items.map(c=>c.c)),answer};
  }
  if(M.kind==='hilo'){
    const metric=metricOf(R),val=c=>c[metric],[lo,hi]=L.hilo;
    const fresh=R.pool.filter(c=>!R.used.includes(c.c));
    for(const list of [fresh,R.pool,areaAll(cfg.mode,cfg.area,cfg.lvl),COUNTRIES]){
      for(const a of shuffle(R.rand,list).slice(0,40)){
        const bs=list.filter(b=>b!==a&&ratio(val(a),val(b))>=lo&&ratio(val(a),val(b))<=hi);
        if(!bs.length)continue;
        const b=bs[Math.floor(R.rand()*bs.length)];
        R.used.push(a.c,b.c);
        return {type:'hilo',metric,pair:R.rand()<.5?[a.c,b.c]:[b.c,a.c]};
      }
    }
    return null;
  }
  // Mysterielandet
  const t=pickTarget(R);
  const q={type:'mystery',target:t.c,shown:1,wrong:[],clues:cluesFor(t)};
  if(L.mysOpts)q.options=makeOptions(R.rand,'land',t.c,R.decoys,L,L.mysOpts);
  else q.domain=[...new Set(areaAll(cfg.mode,cfg.area,cfg.lvl).map(c=>c.c).concat(t.c))].sort((a,b)=>BY[a].n.localeCompare(BY[b].n,'sv'));
  return q;
}
function nextQuestion(R){const q=genQuestion(R);R.qs.push(q);R.i=R.qs.length-1;return q;}
const currentQ=R=>R.qs[R.i]||null;
const roundOver=R=>R.len>0?R.answered>=R.len:R.lost;
const roundScore=R=>R.M.kind==='hilo'?R.best:R.M.kind==='mystery'?R.points:R.right;
const roundCleared=R=>R.M.kind==='hilo'?R.best>=R.M.need:R.right>=R.M.need;

// Svar. Ger {q, touched:[[kod, rätt?] …]} eller null om frågan redan är besvarad.
function answer(R,ans){
  const q=currentQ(R);if(!q||q.done||q.type==='mystery')return null;
  let touched=[];
  if(q.type==='choice'){
    if(!q.options.includes(ans))return null;
    q.pick=ans;q.ok=ans===q.target;touched=[[q.target,q.ok]];
  }else if(q.type==='continent'){
    if(!CONT[ans])return null;
    const t=BY[q.target];q.pick=ans;q.ok=ans===t.k||(t.x||[]).includes(ans);touched=[[q.target,q.ok]];
    if(q.ok)(R.baskets[ans]=R.baskets[ans]||[]).push(q.target);
  }else if(q.type==='sort'){
    if(!Array.isArray(ans)||ans.length!==q.items.length||q.items.some(c=>!ans.includes(c)))return null;
    q.order=ans.slice();q.pos=q.order.map((c,i)=>c===q.answer[i]);q.ok=q.pos.every(Boolean);
    touched=q.order.map((c,i)=>[c,q.pos[i]]);
  }else if(q.type==='hilo'){
    if(!q.pair.includes(ans))return null;
    const other=q.pair[0]===ans?q.pair[1]:q.pair[0];
    q.pick=ans;q.ok=BY[ans][q.metric]>BY[other][q.metric];touched=q.pair.map(c=>[c,q.ok]);
  }
  q.done=true;finishQ(R,q,touched);
  return {q,touched};
}
function guessMystery(R,code){
  const q=currentQ(R);
  if(!q||q.type!=='mystery'||q.done||q.wrong.includes(code)||!BY[code])return null;
  if(q.options&&!q.options.includes(code))return null;
  if(code===q.target){q.ok=true;q.points=CLUES_MAX+1-q.shown;q.done=true;}
  else{
    q.wrong.push(code);
    if(q.shown<CLUES_MAX)q.shown++;
    else{q.ok=false;q.points=0;q.done=true;}
  }
  if(!q.done)return {q,touched:[]};
  const touched=[[q.target,q.ok]];
  finishQ(R,q,touched);
  return {q,touched};
}
function moreClue(R){const q=currentQ(R);if(q&&q.type==='mystery'&&!q.done&&q.shown<CLUES_MAX){q.shown++;return true;}return false;}
function finishQ(R,q,touched){
  R.answered++;
  if(q.ok){R.right++;R.streak++;if(R.streak>R.best)R.best=R.streak;}
  else{R.streak=0;if(R.len===0)R.lost=true;}
  if(q.type==='mystery')R.points+=q.points||0;
  for(const [c,ok] of touched)if(!ok&&!R.missed.includes(c))R.missed.push(c);
}

// ---------- tal och text ----------
const groupNum=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
function sig(n,d){if(!n)return 0;const p=Math.pow(10,Math.floor(Math.log10(Math.abs(n)))-d+1);return Math.round(Math.round(n/p)*p);}
const decSv=(x,d)=>x.toFixed(d).replace(/\.?0+$/,'').replace('.',',');
function fmtPop(p){
  if(p<1000)return groupNum(sig(p,1));
  if(p<1e6)return groupNum(sig(p,3));
  if(p<1e9){const m=p/1e6;const s=m<100?decSv(m,1):String(Math.round(m));return s+(s==='1'?' miljon':' miljoner');}
  return decSv(p/1e9,2)+' miljarder';
}
function fmtArea(a){
  if(a<10)return decSv(a,2)+' km²';
  if(a<1000)return groupNum(Math.round(a))+' km²';
  if(a<1e6)return groupNum(sig(a,3))+' km²';
  const m=decSv(a/1e6,1);return m+(m==='1'?' miljon':' miljoner')+' km²';
}
const fmtVal=(c,metric)=>metric==='p'?fmtPop(c.p)+' invånare':fmtArea(c.a);
function timesText(r){
  if(r<10)return 'ungefär '+decSv(Math.round(r*10)/10,1)+' gånger';
  if(r<100)return 'ungefär '+Math.round(r)+' gånger';
  return 'ungefär '+groupNum(sig(r,2))+' gånger';
}
// "Ryssland är ungefär 38 gånger så stort som Sverige."
function compareText(a,b,metric){
  let A=BY[a],B=BY[b];
  if(A[metric]<B[metric])[A,B]=[B,A];
  const r=A[metric]/B[metric];
  if(r<1.05)return metric==='p'?`${A.n} och ${B.n} har nästan lika många invånare.`:`${A.n} och ${B.n} är nästan lika stora.`;
  return metric==='p'?`${A.n} har ${timesText(r)} så många invånare som ${B.n}.`:`${A.n} är ${timesText(r)} så stort som ${B.n}.`;
}
const listSv=xs=>xs.length<2?xs.join(''):xs.slice(0,-1).join(', ')+' och '+xs[xs.length-1];
const letters=s=>s.replace(/[^A-Za-zÀ-ÿĀ-žȘ-ț]/g,'').length;
function continentText(c){return c.x?`${CONT[c.k].name} och ${listSv(c.x.map(k=>CONT[k].name))}`:CONT[c.k].name;}
function famous(codes){return codes.map(x=>BY[x]).sort((a,b)=>a.t-b.t||b.p-a.p)[0];}
// Ledtrådarna i Mysterielandet, från vaga till tydliga.
function cluesFor(c){
  const ref=c.c==='se'?BY.fi:BY.se,r=c.a/ref.a;
  const size=r>=1.15?`${timesText(r)} så stort som ${ref.n}`:r<=0.87?`${ref.n} är ${timesText(1/r)} så stort`:`ungefär lika stort som ${ref.n}`;
  const nb=c.b.length,nbText=nb===1?'ett grannland':nb+' grannländer';
  const coast=!nb?'Landet ligger på en ö eller flera öar och har inga grannländer på land.'
    :c.ll?`Landet har ingen kust mot havet och har ${nbText}.`
    :`Landet har kust mot havet och ${nbText}.`;
  const neighbour=!nb?`Huvudstaden har ${letters(c.cap)} bokstäver.`
    :nb===1?`Landets enda grannland är ${BY[c.b[0]].n}.`
    :`Ett av grannländerna är ${famous(c.b).n}.`;
  const capital=c.same?'Huvudstaden heter samma sak som landet!'
    :c.nc?`Landets namn slutar på ”${c.n.slice(-1)}”.`
    :`Huvudstaden börjar på ${c.cap[0]}.`;
  return [
    {icon:'🌍',text:c.x?`Landet ligger i både ${continentText(c)}.`:`Landet ligger i ${CONT[c.k].name}.`},
    {icon:'👥',text:`I landet bor ungefär ${fmtPop(c.p)} människor.`},
    {icon:'📐',text:`Landet är ${fmtArea(c.a)} stort – ${size}.`},
    {icon:'🌊',text:coast},
    {icon:'🎨',text:`Flaggan har färgerna ${listSv(c.f)}.`},
    {icon:'🤝',text:neighbour},
    {icon:'🏙️',text:capital},
    {icon:'🔤',text:`Landets namn har ${letters(c.n)} bokstäver och börjar på ${c.n[0]}.`}
  ];
}
// Sökning i Mysterielandet (Omöjliga): början av namnet först, sedan var som helst.
const fold=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function searchCountries(domain,text,max){
  const q=fold(text.trim());if(!q)return [];
  const starts=[],inside=[];
  for(const x of domain){const n=fold(BY[x].n);if(n.startsWith(q))starts.push(x);else if(n.includes(q))inside.push(x);}
  return starts.concat(inside).slice(0,max||8);
}

// ---------- framsteg, pass och missar ----------
function cleanProgress(p){
  const out={};
  for(const M of MODES){
    const m=p&&typeof p==='object'&&p[M.id]&&typeof p[M.id]==='object'?p[M.id]:{};
    const u=Number.isInteger(m.u)?Math.max(0,Math.min(LEVELS.length-1,m.u)):0;
    const arr=a=>LEVELS.map((_,i)=>Array.isArray(a)&&Number(a[i])>0?Math.floor(Number(a[i])):0);
    out[M.id]={u,b:arr(m.b),c:arr(m.c)};
  }
  return out;
}
const cleanCounts=(o,max)=>{const out={};if(o&&typeof o==='object')for(const k of Object.keys(o)){const v=Math.floor(Number(o[k]));if(BY[k]&&v>0)out[k]=Math.min(max,v);}return out;};
// Sparar resultatet. Ger index för nivån som låstes upp, annars -1.
function recordRound(prog,modeId,lvl,score,cleared){
  const m=prog[modeId];
  if(score>m.b[lvl])m.b[lvl]=score;
  if(!cleared)return -1;
  m.c[lvl]++;
  if(lvl>=m.u&&m.u<LEVELS.length-1){m.u=lvl+1;return m.u;}
  return -1;
}
function applyTouched(pass,miss,touched){
  for(const [c,ok] of touched){
    if(ok){pass[c]=Math.min(99,(pass[c]||0)+1);if(miss[c]){miss[c]--;if(!miss[c])delete miss[c];}}
    else miss[c]=Math.min(5,(miss[c]||0)+2);
  }
}
const stampCount=pass=>COUNTRIES.filter(c=>(pass[c.c]||0)>=STAMP).length;

// ---------- spelets id och sparade värden ----------
const GAME_ID='jordenrunt';
const SCORE_KEY='score.'+GAME_ID;   // hubbens trofé: antal stämplar i passet
const SAVE_KEY='state.'+GAME_ID;    // nivåer, rekord, pass, missar och val (hubbens konvention: state.<id>)
const PRAISE=['Rätt!','Snyggt!','Precis!','Helt rätt!','Bra!','Toppen!'];
const reduceMotion=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const FLAG_URL={};
const flagSrc=c=>FLAG_URL[c]||(FLAG_URL[c]='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(FLAGS[c]));
const flagImg=(c,cls)=>`<img class="flag${cls?' '+cls:''}" src="${flagSrc(c)}" alt="Flagga" draggable="false">`;

function readSave(){
  try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));return s&&typeof s==='object'?s:{};}catch(e){return {};}
}
function cleanSave(s){
  const pref={};
  if(s.pref&&typeof s.pref==='object')for(const M of MODES){
    const p=s.pref[M.id];if(!p||typeof p!=='object')continue;
    const o={};
    if(AREAS.some(a=>a.id===p.area))o.area=p.area;
    if(M.dirs&&M.dirs.some(d=>d.id===p.dir))o.dir=p.dir;
    if(M.metric&&METRICS.some(m=>m.id===p.metric))o.metric=p.metric;
    pref[M.id]=o;
  }
  const names=Array.isArray(s.names)?s.names.slice(0,2).map(n=>String(n||'').slice(0,14)):[];
  const duel=s.duel&&typeof s.duel==='object'?s.duel:{};
  return {prog:cleanProgress(s.prog),pass:cleanCounts(s.pass,99),miss:cleanCounts(s.miss,5),pref,
    names:[names[0]||'Spelare 1',names[1]||'Spelare 2'],
    duel:{mode:MODE[duel.mode]?duel.mode:'flaggor',lv:Array.isArray(duel.lv)?duel.lv.slice(0,2).map(v=>Number.isInteger(v)&&v>=0&&v<LEVELS.length?v:0):[0,1]}};
}
let S=cleanSave(readSave());
let R=null;        // omgången som spelas (en spelare)
let D=null;        // duellen: {cfg, rounds:[R0,R1], turn, names, lv}
let ACT={};
let guardUntil=0;  // ett tryck som svarar sväljer nästa tryck en kort stund
const app=document.getElementById('app');

function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({prog:S.prog,pass:S.pass,miss:S.miss,pref:S.pref,names:S.names,duel:S.duel}));}catch(e){}}
function writeScore(){const n=stampCount(S.pass);if(n>0)try{localStorage.setItem(SCORE_KEY,String(n));}catch(e){}}
function prefOf(modeId){
  const M=MODE[modeId],p=S.pref[modeId]||(S.pref[modeId]={});
  let area=p.area||'world';
  if(M.worldOnly&&area!=='world'&&area!=='missar')area='world';
  if(area==='missar'&&missCount(modeId,S.miss)<MISS_MIN)area='world';
  return {area,dir:p.dir||(M.dirs?M.dirs[0].id:undefined),metric:p.metric||(M.metric?'p':undefined)};
}

// ---------- skärmar ----------
function go(html,acts,bodyClass,keepScroll){
  closeModal();
  document.body.className=bodyClass||'';
  app.innerHTML=html;ACT=acts||{};
  if(!keepScroll)window.scrollTo(0,0);
}

function showMenu(){
  R=null;D=null;
  const n=stampCount(S.pass);
  go(`<main class="menu">
    <header class="hero">
      <div class="logo" aria-hidden="true">🌍</div>
      <h1>Jorden runt</h1>
      <p class="sub">Flaggor, huvudstäder och länder i hela världen. Vad vill du spela?</p>
    </header>
    <div class="modes">${MODES.map(M=>{const L=LEVELS[S.prog[M.id].u];return `<button class="mode m-${M.id}" data-act="mode" data-mode="${M.id}">
      <span class="ico" aria-hidden="true">${M.icon}</span><span class="nm">${M.name}</span>
      <span class="ds">${M.blurb}</span><span class="tag">${L.icon} ${L.name}</span></button>`;}).join('')}</div>
    <div class="row center tools">
      <button class="btn" data-act="pass">🛂 Mitt pass</button>
      <button class="btn" data-act="duel">⚔️ Duell</button>
      <button class="btn" data-act="about">📖 Om spelet</button>
    </div>
    <p class="record">${n?`🛂 Stämplar i passet: <b>${n}</b> av ${COUNTRIES.length}`:'🛂 Svara rätt om ett land tre gånger så får du din första stämpel!'}</p>
  </main>`,{
    mode:b=>showSetup(b.dataset.mode),
    pass:()=>showPass(),
    duel:()=>showDuelSetup(),
    about:showAbout
  },'at-menu');
}

const tierText=L=>['de mest kända länderna','kända länder','många länder','alla 195 länder'][L.maxTier-1];
const spreadText=r=>r>=2?'stor skillnad':r>=1.35?'mindre skillnad':r>=1.2?'liten skillnad':'pyttelite skillnad';
function levelDetail(M,L){
  switch(M.kind){
    case 'choice':return `${L.opts} svar att välja på · ${tierText(L)}`+(L.pick==='similar'?(M.id==='flaggor'?' · flaggor som nästan är likadana':' · grannländernas huvudstäder'):'');
    case 'sort':return `${L.sortN} länder att sortera · ${spreadText(L.sortMin)}`;
    case 'continent':return tierText(L)+(L.ambig?' · även länder i två världsdelar':'');
    case 'hilo':return `${tierText(L)} · ${spreadText(L.hilo[0])}`;
    default:return (L.mysOpts?`${L.mysOpts} länder att välja bland`:'Skriv själv vilket land det är')+' · '+tierText(L);
  }
}
function bestText(M,v){
  if(!v)return 'Inte spelad än';
  switch(M.kind){
    case 'hilo':return `Rekord: ${v} i rad`;
    case 'mystery':return `Bäst: ${v} poäng`;
    default:return `Bäst: ${v} av ${M.len}`;
  }
}
function rulesText(M){
  switch(M.kind){
    case 'sort':return `${M.len} frågor. Sortera helt rätt ${M.need} gånger så låses nästa nivå upp.`;
    case 'hilo':return `Spela tills du svarar fel. ${M.need} rätt i rad låser upp nästa nivå.`;
    case 'mystery':return `${M.len} länder. Ju färre ledtrådar du behöver, desto fler poäng (max ${CLUES_MAX}). En fel gissning kostar en ledtråd. Hitta ${M.need} länder så låses nästa nivå upp.`;
    default:return `${M.len} frågor. Svara rätt på ${M.need} så låses nästa nivå upp.`;
  }
}
function chipsHtml(act,list,cur,disabledFn){
  return `<div class="chips" role="group">${list.map(x=>{const dis=disabledFn&&disabledFn(x);return `<button class="chip" data-act="${act}" data-v="${x.id}" aria-pressed="${x.id===cur}"${dis?' disabled':''}>${x.icon?x.icon+' ':''}${esc(x.label||x.name)}</button>`;}).join('')}</div>`;
}
function areaList(M,withMiss){
  const nm=missCount(M.id,S.miss);
  const list=AREAS.filter(a=>!M.worldOnly||a.id==='world'||a.id==='missar').filter(a=>withMiss||a.id!=='missar')
    .map(a=>a.id==='missar'?Object.assign({},a,{label:`${a.name} (${nm})`}):a);
  return {list,nm};
}
function showSetup(modeId,msg){
  R=null;D=null;
  const M=MODE[modeId],P=prefOf(modeId),pr=S.prog[modeId];
  const {list,nm}=areaList(M,true);
  go(`<main class="setup">
    <div class="topbar"><button class="btn sm" data-act="menu">← Meny</button><h2>${M.icon} ${M.name}</h2></div>
    <p class="sub">${M.blurb}</p>
    <section class="group"><h3>Var i världen?</h3>
      ${chipsHtml('area',list,P.area,a=>a.id==='missar'&&nm<MISS_MIN)}
      ${nm<MISS_MIN?`<p class="small">🎯 Mina missar: länder du har svarat fel på. Det behövs minst ${MISS_MIN} för att öva på dem.</p>`:''}
    </section>
    ${M.dirs?`<section class="group"><h3>Hur vill du spela?</h3>${chipsHtml('dir',M.dirs,P.dir)}</section>`:''}
    ${M.metric?`<section class="group"><h3>Vad ska jämföras?</h3>${chipsHtml('metric',METRICS,P.metric)}</section>`:''}
    <section class="group"><h3>Välj nivå</h3>
      <p class="menumsg" role="status">${msg?esc(msg):''}</p>
      <div class="levels">${LEVELS.map((L,i)=>{const locked=i>pr.u;return `<button class="level lv-${L.id}${locked?' locked':''}" data-act="level" data-lvl="${i}">
        <span class="ico" aria-hidden="true">${locked?'🔒':L.icon}</span><span class="nm">${L.name}</span>
        <span class="ds">${locked?`Klara ${LEVELS[i-1].name} för att låsa upp.`:levelDetail(M,L)}</span>
        <span class="tag">${locked?'Låst':(pr.c[i]?'✓ ':'')+bestText(M,pr.b[i])}</span></button>`;}).join('')}</div>
    </section>
    <p class="rules">ℹ️ ${rulesText(M)}</p>
  </main>`,{
    menu:()=>showMenu(),
    area:b=>{S.pref[modeId]=Object.assign(prefOf(modeId),{area:b.dataset.v});persist();showSetup(modeId);},
    dir:b=>{S.pref[modeId]=Object.assign(prefOf(modeId),{dir:b.dataset.v});persist();showSetup(modeId);},
    metric:b=>{S.pref[modeId]=Object.assign(prefOf(modeId),{metric:b.dataset.v});persist();showSetup(modeId);},
    level:b=>{
      const i=+b.dataset.lvl;
      if(i>pr.u){const m=app.querySelector('.menumsg');if(m)m.textContent=`${LEVELS[i].name} är låst. Klara ${LEVELS[i-1].name} först!`;return;}
      startRound(modeId,i);
    }
  });
}
const newSeed=()=>((Date.now()&0x7fffffff)^Math.floor(Math.random()*0x7fffffff))>>>0;
function startRound(modeId,lvl){
  const P=prefOf(modeId);
  R=newRound({mode:modeId,lvl,area:P.area,dir:P.dir,metric:P.metric},newSeed(),S.miss);
  guardUntil=0;
  nextQuestion(R);
  renderPlay();
}

// ---------- spelplanen ----------
const activeRound=()=>D?D.rounds[D.turn]:R;
const areaName=id=>{const a=AREAS.find(x=>x.id===id);return a?a.name:'';};
const qNum=Q=>Math.min(Q.len,Q.answered+(currentQ(Q)&&!currentQ(Q).done?1:0));
function statsHtml(Q){
  const st=(n,l,cls)=>`<div class="stat${cls?' '+cls:''}"><span class="n">${n}</span><span class="l">${l}</span></div>`;
  if(Q.M.kind==='hilo'&&Q.len===0)return st(Q.streak,'i rad','good')+st(Math.max(Q.best,S.prog[Q.M.id].b[Q.cfg.lvl]),'rekord');
  return st(`${qNum(Q)}/${Q.len}`,'fråga')+(Q.M.kind==='mystery'?st(Q.points,'poäng','good'):st(Q.right,'rätt','good'));
}
function barHtml(Q){
  const L=Q.L,M=Q.M;
  return `<div class="bar">
    <button class="btn sm" data-act="quit">✕ Avsluta</button>
    <div class="ptitle"><b>${M.icon} ${M.name}</b><small>${L.icon} ${L.name} · ${esc(areaName(Q.cfg.area))}</small></div>
    <div class="stats">${D?'':statsHtml(Q)}</div>
  </div>${D?duelBar():''}`;
}
function duelBar(){
  return `<div class="duelbar">${D.rounds.map((Q,i)=>`<span class="dpill p${i}${i===D.turn?' on':''}">${esc(D.names[i])}: ${duelScore(Q)} ${Q.M.kind==='mystery'?'p':'rätt'}</span>`).join('')}</div>
    <div class="turn p${D.turn}">🎯 ${esc(D.names[D.turn])}s tur · ${LEVELS[D.lv[D.turn]].icon} ${LEVELS[D.lv[D.turn]].name} · ${qNum(activeRound())}/${activeRound().len}</div>`;
}
const duelScore=Q=>Q.M.kind==='mystery'?Q.points:Q.right;

function lcard(code,big){
  const c=BY[code];
  return `<div class="lcard${big?' big':''}">${flagImg(code)}<div class="info">
    <b>${esc(c.n)}</b>
    <span>🏙️ Huvudstad: ${esc(c.cap)}</span>${c.cn?`<span class="note">${esc(c.cn)}</span>`:''}
    <span>🌍 ${esc(continentText(c))}</span>
    <span>👥 ${fmtPop(c.p)} invånare</span>
    <span>📐 ${fmtArea(c.a)}</span>
    ${big?`<span>🤝 ${c.b.length?'Grannländer: '+esc(listSv(c.b.map(x=>BY[x].n).sort((a,b)=>a.localeCompare(b,'sv')))):'Inga grannländer på land'}</span>`:''}
  </div></div>`;
}
function sheetHtml(Q,q,why,codes){
  const last=roundOver(Q)&&(!D||D.rounds.every(roundOver));
  const nextLabel=last?'Se resultat':D?`Nästa: ${esc(D.names[nextTurn()])} →`:'Nästa →';
  const praise=PRAISE[(Q.answered*7+Q.right)%PRAISE.length];
  return `<div class="sheet ${q.ok?'ok':'bad'}${reduceMotion()?'':' pop'}" role="status">
    <p class="msg">${q.ok?'✅ '+praise:'❌ Inte riktigt'}</p>
    ${why?`<p class="why">${why}</p>`:''}
    <div class="foot">${(codes||[]).map(c=>lcard(c)).join('')}<button class="btn go big" data-act="next">${nextLabel}</button></div>
  </div>`;
}
function renderPlay(o){
  o=o||{};
  const Q=activeRound(),q=currentQ(Q);
  if(!q)return showMenu();
  let body='',sheet='';
  if(q.type==='choice'){
    const t=BY[q.target];
    const flagOpts=q.dir==='n2f',capOpts=q.dir==='n2c';
    let ask;
    if(q.dir==='f2n')ask=`<div class="prompt"><p class="ask">Vilket land har den här flaggan?</p>${flagImg(t.c,'bigflag')}</div>`;
    else if(q.dir==='n2f')ask=`<p class="ask">Vilken flagga har <b>${esc(t.n)}</b>?</p>`;
    else if(q.dir==='n2c')ask=`<div class="prompt">${Q.L.capFlag?flagImg(t.c,'capflag'):''}<p class="ask">Vad heter huvudstaden i <b>${esc(t.n)}</b>?</p></div>`;
    else ask=`<p class="ask"><b>${esc(t.cap)}</b> är huvudstad i vilket land?</p>`;
    const cls=flagOpts?`flags n${q.options.length}`:q.dir==='c2n'?'cards':q.options.length===4?'':'t3';
    body=ask+`<div class="opts ${cls}">${q.options.map((c,i)=>{
      const st=q.done?(c===q.target?' right':c===q.pick?' wrong':' dim'):'';
      const mark=q.done&&c===q.target?'<span class="mark">✅</span>':q.done&&c===q.pick?'<span class="mark">❌</span>':'';
      const inner=flagOpts?flagImg(c):capOpts?esc(BY[c].cap):q.dir==='c2n'?flagImg(c)+`<span>${esc(BY[c].n)}</span>`:esc(BY[c].n);
      return `<button class="opt${flagOpts?' f':q.dir==='c2n'?' fn':''}${st}" data-act="pick" data-c="${c}" data-i="${i+1}"${flagOpts?` aria-label="Flagga ${i+1}"`:''}${q.done?' disabled':''}>${inner}${mark}</button>`;
    }).join('')}</div>`;
    if(q.done){
      let why='';
      if(!q.ok){
        if(q.dir==='f2n'||q.dir==='n2f')why=`Det var ${esc(t.n)}s flagga. Du valde ${esc(BY[q.pick].n)}s.`;
        else if(q.dir==='n2c')why=`Huvudstaden i ${esc(t.n)} är ${esc(t.cap)}. ${esc(BY[q.pick].cap)} är huvudstad i ${esc(BY[q.pick].n)}.`;
        else why=`${esc(t.cap)} är huvudstad i ${esc(t.n)}.`;
      }
      sheet=sheetHtml(Q,q,why,[q.target]);
    }
  }else if(q.type==='continent'){
    const t=BY[q.target],okKs=[t.k].concat(t.x||[]);
    body=`<div class="prompt">${flagImg(t.c,'capflag')}<p class="ask">I vilken världsdel ligger <b>${esc(t.n)}</b>?</p></div>
      <div class="baskets">${CONTINENTS.map((k,i)=>{
        const st=q.done?(okKs.includes(k.id)?' right':k.id===q.pick?' wrong':''):'';
        const mini=(Q.baskets[k.id]||[]).map(c=>`<img src="${flagSrc(c)}" alt="">`).join('');
        return `<button class="basket${st}" data-act="cont" data-k="${k.id}" data-i="${i+1}"${q.done?' disabled':''}><span class="bi" aria-hidden="true">${k.icon}</span><span>${k.name}</span><span class="mini">${mini}</span></button>`;
      }).join('')}</div>`;
    if(q.done){
      const why=t.x?`${esc(t.n)} ligger i både ${esc(continentText(t))}. Båda svaren är rätt.`:q.ok?'':`${esc(t.n)} ligger i ${CONT[t.k].name}.`;
      sheet=sheetHtml(Q,q,why,[q.target]);
    }
  }else if(q.type==='sort'){
    const head=q.metric==='p'?'Sortera från flest till minst invånare':'Sortera från störst till minst yta';
    if(!q.done){
      const sel=Q.sel||(Q.sel=[]);
      body=`<p class="ask">${head}</p><p class="small" style="text-align:center">Tryck på länderna i ordning. Tryck igen för att ångra.</p>
        <div class="sortlist">${q.items.map((c,i)=>{const k=sel.indexOf(c);return `<button class="sitem${k>=0?' picked':''}" data-act="sortpick" data-c="${c}" data-i="${i+1}"><span class="num">${k>=0?k+1:''}</span>${flagImg(c)}<span>${esc(BY[c].n)}</span><span></span></button>`;}).join('')}</div>
        <div class="row center"><button class="btn" data-act="sortclear"${sel.length?'':' disabled'}>Börja om</button><button class="btn go big" data-act="sortdone"${sel.length===q.items.length?'':' disabled'}>Klar!</button></div>`;
    }else{
      body=`<p class="ask">${head}</p><div class="sortlist">${q.answer.map((c,i)=>{const yours=q.order.indexOf(c)+1;return `<button class="sitem ${q.order[i]===c?'right':'wrong'}" disabled><span class="num">${i+1}</span>${flagImg(c)}<span>${esc(BY[c].n)}<span class="yours">${q.order[i]===c?'✅ rätt plats':`❌ du satte den som nr ${yours}`}</span></span><span class="val">${fmtVal(BY[c],q.metric)}</span></button>`;}).join('')}</div>`;
      const why=esc(compareText(q.answer[0],q.answer[q.answer.length-1],q.metric))+(q.ok?'':` Rätt ordning: ${esc(q.answer.map(c=>BY[c].n).join(' → '))}.`);
      sheet=sheetHtml(Q,q,why,[]);
    }
  }else if(q.type==='hilo'){
    const ask=q.metric==='p'?'Vilket land har flest invånare?':'Vilket land är störst till ytan?';
    body=`<p class="ask">${ask}</p><div class="duo">${q.pair.map((c,i)=>{
      const big=BY[c][q.metric]>=BY[q.pair[1-i]][q.metric];
      const st=q.done?(big?' right':c===q.pick?' wrong':''):'';
      return `<button class="hcard${st}" data-act="hilo" data-c="${c}" data-i="${i+1}"${q.done?' disabled':''}>${flagImg(c)}<span>${esc(BY[c].n)}</span><span class="val">${q.done?fmtVal(BY[c],q.metric):''}</span></button>`;
    }).join('')}</div>`;
    if(q.done)sheet=sheetHtml(Q,q,esc(compareText(q.pair[0],q.pair[1],q.metric))+(q.ok&&Q.len===0&&Q.streak===Q.M.need&&Q.cfg.lvl<LEVELS.length-1?' 🔓 10 i rad – nästa nivå är upplåst när rundan är slut!':''),[]);
  }else if(q.type==='mystery'){
    const clues=q.clues.slice(0,q.done?CLUES_MAX:q.shown);
    body=`<p class="ask">Vilket land är det?</p>
      <ol class="clues">${clues.map((cl,i)=>`<li class="${i===q.shown-1&&!q.done&&!reduceMotion()?'new':''}"><span class="ci" aria-hidden="true">${cl.icon}</span><span>${esc(cl.text)}</span></li>`).join('')}</ol>
      ${q.done?'':`<div class="cluebar"><span class="pts">Ger nu ${CLUES_MAX+1-q.shown} poäng</span><button class="btn sm" data-act="clue"${q.shown>=CLUES_MAX?' disabled':''}>💡 Ny ledtråd</button></div>`}
      ${q.options?`<div class="opts cards">${q.options.map((c,i)=>{
        const st=q.done?(c===q.target?' right':' dim'):q.wrong.includes(c)?' wrong gone':'';
        return `<button class="opt fn${st}" data-act="guess" data-c="${c}" data-i="${i+1}"${q.done||q.wrong.includes(c)?' disabled':''}>${flagImg(c)}<span>${esc(BY[c].n)}</span></button>`;}).join('')}</div>`
        :q.done?'':`<input class="search" type="text" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Skriv ett land …" aria-label="Skriv ett land" value="${esc(Q.searchText||'')}">
          <div class="results">${resultsHtml(Q,q)}</div>`}`;
    if(q.done){
      const t=BY[q.target];
      const why=q.ok?`Det var ${esc(t.n)}! Du fick ${q.points} poäng.`:`Det var ${esc(t.n)}.`;
      sheet=sheetHtml(Q,q,why,[q.target]);
    }
  }
  go(`<main class="play">${barHtml(Q)}${body}${sheet}</main>`,PLAY_ACTS,D?'duel':'',o.keep);
  if(o.focus){const s=app.querySelector('.search');if(s){s.focus({preventScroll:true});const v=s.value.length;s.setSelectionRange(v,v);}}
  if(q.done&&q.ok===false){const w=app.querySelector('.opt.wrong,.hcard.wrong,.basket.wrong');if(w&&!reduceMotion())w.classList.add('shake');}
}
function resultsHtml(Q,q){
  const text=Q.searchText||'';
  if(!text.trim())return `<p class="none">Börja skriva så kommer förslag.</p>`;
  const hits=searchCountries(q.domain,text,8);
  if(!hits.length)return `<p class="none">Inget land heter så.</p>`;
  return hits.map((c,i)=>`<button class="opt fn${q.wrong.includes(c)?' wrong gone':''}" data-act="guess" data-c="${c}" data-i="${i+1}"${q.wrong.includes(c)?' disabled':''}>${flagImg(c)}<span>${esc(BY[c].n)}</span></button>`).join('');
}
// Ett svar: pass och missar uppdateras, ett nytt svar sväljer nästa tryck en kort stund.
function afterAnswer(res,o){
  if(!res)return;
  if(res.touched.length){applyTouched(S.pass,S.miss,res.touched);persist();writeScore();}
  if(res.q.done)guardUntil=Date.now()+350;
  renderPlay(Object.assign({keep:true},o));
}
const nextTurn=()=>{const o=1-D.turn;return roundOver(D.rounds[o])?D.turn:o;};
function goNext(){
  if(Date.now()<guardUntil)return;
  const Q=activeRound(),q=currentQ(Q);
  if(!q||!q.done)return;
  if(D){
    if(D.rounds.every(roundOver))return showDuelSummary();
    D.turn=nextTurn();
    const N=activeRound();
    if(!currentQ(N)||currentQ(N).done)nextQuestion(N);
    N.sel=null;N.searchText='';
    return renderPlay();
  }
  if(roundOver(Q))return showSummary();
  Q.sel=null;Q.searchText='';
  nextQuestion(Q);
  renderPlay();
}
const PLAY_ACTS={
  quit:()=>{
    const Q=activeRound();
    if(Q.answered===0&&!D)return showSetup(Q.M.id);
    modal(`<h3>Avsluta?</h3><p>${D?'Duellen avbryts.':'Rundan räknas inte för att låsa upp nya nivåer. Stämplarna i passet finns kvar.'}</p>
      <div class="row center"><button class="btn go" data-m="close">Spela vidare</button><button class="btn" data-m="quit">Avsluta</button></div>`,
      {quit:()=>D?showMenu():showSetup(Q.M.id)});
  },
  pick:b=>{if(Date.now()<guardUntil)return;afterAnswer(answer(activeRound(),b.dataset.c));},
  cont:b=>{if(Date.now()<guardUntil)return;afterAnswer(answer(activeRound(),b.dataset.k));},
  hilo:b=>{if(Date.now()<guardUntil)return;afterAnswer(answer(activeRound(),b.dataset.c));},
  sortpick:b=>{
    const Q=activeRound(),q=currentQ(Q);if(!q||q.done)return;
    const sel=Q.sel||(Q.sel=[]),c=b.dataset.c,k=sel.indexOf(c);
    if(k>=0)sel.splice(k,1);else sel.push(c);
    renderPlay({keep:true});
  },
  sortclear:()=>{const Q=activeRound();Q.sel=[];renderPlay({keep:true});},
  sortdone:()=>{const Q=activeRound();if(Date.now()<guardUntil||!Q.sel)return;afterAnswer(answer(Q,Q.sel));},
  guess:b=>{
    if(Date.now()<guardUntil)return;
    const Q=activeRound(),res=guessMystery(Q,b.dataset.c);
    if(res&&!res.q.done&&!res.q.options){Q.searchText='';return afterAnswer(res,{focus:true});}
    afterAnswer(res);
  },
  clue:()=>{if(moreClue(activeRound()))renderPlay({keep:true});},
  next:()=>goNext()
};

// ---------- resultat ----------
function showSummary(){
  const Q=R,M=Q.M,L=Q.L,lvl=Q.cfg.lvl;
  const prevBest=S.prog[M.id].b[lvl];
  const score=roundScore(Q),cleared=roundCleared(Q);
  const unlocked=recordRound(S.prog,M.id,lvl,score,cleared);
  persist();writeScore();
  let title,lead,medal,stats;
  if(M.kind==='hilo'){
    title=cleared?'Nivån är klarad!':score>prevBest&&score>0?'Nytt rekord!':'Bra kämpat!';
    lead=`Du hade ${score} rätt i rad på ${L.name}.`+(cleared?'':` Klara ${M.need} i rad för att låsa upp nästa nivå.`);
    stats=`<div class="big${cleared?' good':''}" data-sum="best"><b>${score}</b><span>i rad</span></div><div class="big" data-sum="record"><b>${Math.max(score,prevBest)}</b><span>rekord</span></div>`;
  }else if(M.kind==='mystery'){
    title=Q.right===M.len?'Alla länder hittade!':cleared?'Nivån är klarad!':'Bra kämpat!';
    lead=`Du hittade ${Q.right} av ${M.len} länder och fick ${Q.points} poäng på ${L.name}.`+(cleared?'':` Hitta ${M.need} länder för att låsa upp nästa nivå.`);
    stats=`<div class="big${cleared?' good':''}" data-sum="right"><b>${Q.right}/${M.len}</b><span>länder</span></div><div class="big" data-sum="points"><b>${Q.points}</b><span>poäng</span></div>`;
  }else{
    title=Q.right===Q.len?'Alla rätt – perfekt!':cleared?'Nivån är klarad!':'Bra kämpat!';
    lead=`Du hade ${Q.right} av ${Q.len} rätt på ${L.name}.`+(cleared?'':` Svara rätt på ${M.need} för att låsa upp nästa nivå.`);
    stats=`<div class="big${cleared?' good':''}" data-sum="right"><b>${Q.right}/${Q.len}</b><span>rätt</span></div>`;
  }
  medal=Q.right===Q.len&&M.kind!=='hilo'?'🏅':cleared?'🎉':'💪';
  const miss=Q.missed.slice(0,12);
  go(`<main class="panel page summary">
    <div class="medal" aria-hidden="true">${medal}</div>
    <h2>${title}</h2>
    <p class="lead">${lead}</p>
    <div class="bigstats">${stats}</div>
    ${unlocked>=0?`<p class="unlock">🔓 Du har låst upp ${LEVELS[unlocked].icon} ${LEVELS[unlocked].name}!</p>`:''}
    <div class="row center">
      <button class="btn go big" data-act="again">Spela igen</button>
      <button class="btn big" data-act="setup">Byt nivå</button>
      <button class="btn big" data-act="menu">Meny</button>
    </div>
    ${miss.length?`<h3>Öva mer på</h3><div class="missed">${miss.map(c=>`<button class="mtile" data-act="info" data-c="${c}">${flagImg(c)}<span>${esc(BY[c].n)}</span></button>`).join('')}</div>`:''}
  </main>`,{
    again:()=>startRound(M.id,lvl),
    setup:()=>showSetup(M.id),
    menu:()=>showMenu(),
    info:b=>infoModal(b.dataset.c)
  });
  if(cleared)confetti();
}
function infoModal(code){
  modal(`${lcard(code,true)}<div class="row center"><button class="btn go" data-m="close">Stäng</button></div>`);
}

// ---------- duell ----------

  const modeId=S.duel.mode,M=MODE[modeId],P=prefOf(modeId);
  const {list}=areaList(M,false);
  const area=P.area==='missar'?'world':P.area;
  go(`<main class="setup">
    <div class="topbar"><button class="btn sm" data-act="menu">← Meny</button><h2>⚔️ Duell</h2></div>
    <p class="sub">Två spelare turas om på samma skärm. Var och en väljer sin egen nivå, så kan stora och små tävla mot varandra.</p>
    <div class="players">${[0,1].map(i=>`<div class="pcard p${i}">
      <label class="small" for="pn${i}">Spelare ${i+1}</label>
      <input id="pn${i}" class="pname" data-i="${i}" maxlength="14" value="${esc(S.names[i])}" autocomplete="off" spellcheck="false">
      <div class="chips" role="group">${LEVELS.map((L,j)=>`<button class="chip" data-act="plv" data-i="${i}" data-v="${j}" aria-pressed="${S.duel.lv[i]===j}">${L.icon} ${L.name}</button>`).join('')}</div>
    </div>`).join('')}</div>
    <section class="group"><h3>Vilket spel?</h3>${chipsHtml('dmode',MODES,modeId)}</section>
    <section class="group"><h3>Var i världen?</h3>${chipsHtml('area',list,area)}</section>
    ${M.dirs?`<section class="group"><h3>Hur?</h3>${chipsHtml('dir',M.dirs,P.dir)}</section>`:''}
    ${M.metric?`<section class="group"><h3>Vad ska jämföras?</h3>${chipsHtml('metric',METRICS,P.metric)}</section>`:''}
    <p class="rules">ℹ️ Var och en får ${DUEL_LEN[M.kind]} ${M.kind==='mystery'?'länder att gissa. Flest poäng vinner.':'frågor. Flest rätt vinner.'}</p>
    <div class="row center"><button class="btn go big" data-act="start">Starta duellen!</button></div>
  </main>`,{
    menu:()=>{saveNames();showMenu();},
    plv:b=>{saveNames();S.duel.lv[+b.dataset.i]=+b.dataset.v;persist();showDuelSetup();},
    dmode:b=>{saveNames();S.duel.mode=b.dataset.v;persist();showDuelSetup();},
    area:b=>{saveNames();S.pref[modeId]=Object.assign(prefOf(modeId),{area:b.dataset.v});persist();showDuelSetup();},
    dir:b=>{saveNames();S.pref[modeId]=Object.assign(prefOf(modeId),{dir:b.dataset.v});persist();showDuelSetup();},
    metric:b=>{saveNames();S.pref[modeId]=Object.assign(prefOf(modeId),{metric:b.dataset.v});persist();showDuelSetup();},
    start:()=>{saveNames();startDuel();}
  });
}
function saveNames(){
  app.querySelectorAll('.pname').forEach(inp=>{const v=inp.value.trim().slice(0,14);S.names[+inp.dataset.i]=v||`Spelare ${+inp.dataset.i+1}`;});
  persist();
}
function startDuel(){
  const modeId=S.duel.mode,M=MODE[modeId],P=prefOf(modeId);
  const area=P.area==='missar'?'world':P.area;
  const seed=newSeed();
  guardUntil=0;
  D={names:S.names.slice(),lv:S.duel.lv.slice(),turn:0,
    rounds:[0,1].map(i=>newRound({mode:modeId,lvl:S.duel.lv[i],area,dir:P.dir,metric:P.metric},seed+i*7919,null,DUEL_LEN[M.kind]))};
  nextQuestion(D.rounds[0]);
  renderPlay();
}

  const sc=D.rounds.map(duelScore),M=D.rounds[0].M;
  const unit=M.kind==='mystery'?'poäng':'rätt';
  const win=sc[0]===sc[1]?-1:sc[0]>sc[1]?0:1;
  go(`<main class="panel page summary">
    <div class="medal" aria-hidden="true">${win<0?'🤝':'🏆'}</div>
    <h2>${win<0?'Oavgjort!':esc(D.names[win])+' vinner!'}</h2>
    <p class="lead">${M.icon} ${M.name} · ${esc(areaName(D.rounds[0].cfg.area))}</p>
    <div class="bigstats">${[0,1].map(i=>`<div class="big p${i}" data-sum="p${i}"><b>${sc[i]}</b><span>${esc(D.names[i])} · ${LEVELS[D.lv[i]].name}</span></div>`).join('')}</div>
    <p class="small">${unit==='poäng'?'Poäng':'Antal rätt'} av ${D.rounds[0].len} ${M.kind==='mystery'?'länder':'frågor'} var.</p>
    <div class="row center">
      <button class="btn go big" data-act="again">Revansch!</button>
      <button class="btn big" data-act="setup">Ändra</button>
      <button class="btn big" data-act="menu">Meny</button>
    </div>
  </main>`,{again:()=>startDuel(),setup:()=>showDuelSetup(),menu:()=>showMenu()});
  confetti();
}

// ---------- om spelet ----------
function showAbout(){
  modal(`<div class="about">
    <h3>📖 Om spelet</h3>
    <ul>
      <li><b>Sex spel:</b> Flaggor, Huvudstäder, Storleksordning, Världsdelar, Högre eller lägre och Mysterielandet.</li>
      <li><b>Nivåer:</b> Lätt, Mellan, Svår, Geni och Omöjliga. Nästa nivå låses upp när du klarar nivån före, i varje spel för sig.</li>
      <li><b>Område:</b> hela världen eller en världsdel. <b>Mina missar</b> är länder du har svarat fel på – de kommer också oftare i vanliga rundor.</li>
      <li><b>Passet:</b> svara rätt om ett land ${STAMP} gånger så får det en stämpel. Kan du samla alla ${COUNTRIES.length}?</li>
      <li><b>Duell:</b> två spelare turas om, var och en på sin egen nivå.</li>
      <li><b>Länderna:</b> FN:s 193 medlemsländer plus Vatikanstaten och Palestina, som är observatörer i FN.</li>
    </ul>
    <p class="src">Flaggor: flag-icons (MIT-licens). Befolkning: Världsbanken 2025 (CC BY 4.0). Yta, grannländer och kust: mledoze/countries (ODbL 1.0). Svenska namn enligt svenska skrivregler och Isof. Siffrorna är avrundade.</p>
    <div class="row center"><button class="btn go" data-m="close">Stäng</button></div>
  </div>`);
}

// ---------- dialog och konfetti ----------
let modalOpen=null;
function modal(html,handlers){
  closeModal();
  const back=document.createElement('div');back.className='modal-back';
  back.innerHTML=`<div class="modal panel" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(back);
  modalOpen={handlers:handlers||{}};
  back.addEventListener('click',e=>{
    const b=e.target.closest('[data-m]');
    if(b){const fn=modalOpen&&modalOpen.handlers[b.dataset.m];closeModal();if(fn)fn(b);}
    else if(e.target===back)closeModal();
  });
  const f=back.querySelector('.btn.go')||back.querySelector('button');if(f)f.focus({preventScroll:true});
}
function closeModal(){
  const open=document.querySelectorAll('.modal-back');
  open.forEach(m=>m.remove());modalOpen=null;
  if(open.length&&document.activeElement&&document.activeElement!==document.body)document.activeElement.blur();
}
function confetti(){
  if(reduceMotion())return;
  const box=document.createElement('div');box.className='confetti';box.setAttribute('aria-hidden','true');
  const cols=['#ff6b6b','#3d8be0','#ffc63f','#9a6ad6','#38d9a9'];
  for(let i=0;i<70;i++){
    const p=document.createElement('i');
    p.style.left=Math.random()*100+'%';p.style.background=cols[i%cols.length];
    p.style.animationDelay=(Math.random()*.6)+'s';p.style.animationDuration=(1.7+Math.random()*1.5)+'s';
    box.appendChild(p);
  }
  document.body.appendChild(box);setTimeout(()=>box.remove(),3800);
}

// ---------- inmatning ----------
app.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');
  if(a&&!a.disabled){const fn=ACT[a.dataset.act];if(fn){e.preventDefault();fn(a,e);}}
});
// sökrutan i Mysterielandet: bara förslagen ritas om, så att tangentbordet stannar kvar
app.addEventListener('input',e=>{
  if(!e.target.classList.contains('search'))return;
  const Q=activeRound(),q=Q&&currentQ(Q);if(!q||q.done)return;
  Q.searchText=e.target.value;
  const box=app.querySelector('.results');if(box)box.innerHTML=resultsHtml(Q,q);
});
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(modalOpen){if(e.key==='Escape'){e.preventDefault();closeModal();}return;}
  const inSearch=e.target&&e.target.classList&&e.target.classList.contains('search');
  if(e.target&&e.target.tagName==='INPUT'&&!inSearch)return;
  const Q=activeRound(),q=Q&&currentQ(Q);
  if(!q||!app.querySelector('.play'))return;
  if(e.key==='Enter'){
    e.preventDefault();
    if(q.done)return goNext();
    if(q.type==='sort'&&Q.sel&&Q.sel.length===q.items.length)return PLAY_ACTS.sortdone();
    if(inSearch){const b=app.querySelector('.results [data-act="guess"]:not(:disabled)');if(b)PLAY_ACTS.guess(b);}
    return;
  }
  if(inSearch||q.done||!/^[1-9]$/.test(e.key))return;
  const b=app.querySelector(`.play [data-i="${e.key}"]:not(:disabled)`);
  if(b){e.preventDefault();const fn=ACT[b.dataset.act];if(fn)fn(b,e);}
});

showMenu();

// fungerar utan internet via hubbens service worker
if('serviceWorker' in navigator){navigator.serviceWorker.register('../sw.js').catch(function(){});}
</script>
