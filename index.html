<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Stalman games</title>

  <!-- PWA / iPad home-screen install -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Stalman games">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <meta name="theme-color" content="#ddf1ff">

  <link rel="stylesheet" href="styles.css">
  <script src="shared/i18n.js"></script>
</head>
<body>
  <header>
    <h1>Stalman games<span class="dot">.</span></h1>
    <div class="tools">
      <div class="lang" role="group" aria-label="Språk" data-en-aria-label="Language">
        <button type="button" data-lang="sv" lang="sv" aria-label="Svenska"><span aria-hidden="true">🇸🇪</span> <span class="lname">Svenska</span></button>
        <button type="button" data-lang="en" lang="en" aria-label="English"><span aria-hidden="true">🇬🇧</span> <span class="lname">English</span></button>
      </div>
      <button id="gear" class="gear" aria-label="Föräldrainställningar" data-en-aria-label="Parent settings">⚙️</button>
    </div>
  </header>

  <main>
    <div id="grid" class="grid"></div>
  </main>

  <footer data-en="Works offline · high scores stay on this iPad">Fungerar utan internet · rekorden sparas på den här iPaden</footer>

  <!-- settings overlay -->
  <div id="overlay" class="overlay" role="dialog" aria-modal="true">
    <div id="panel" class="panel"></div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
