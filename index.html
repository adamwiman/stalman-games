<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Game Hub</title>

  <!-- PWA / iPad home-screen install -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Games">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#ddf1ff">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Game Hub<span class="dot">.</span></h1>
    <button id="gear" class="gear" aria-label="Parent settings">⚙️</button>
  </header>

  <main>
    <div id="grid" class="grid"></div>
  </main>

  <footer>Works offline · high scores stay on this iPad</footer>

  <!-- settings overlay -->
  <div id="overlay" class="overlay" role="dialog" aria-modal="true">
    <div id="panel" class="panel"></div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
